<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Starting…</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --red: #f85149;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
        padding: 32px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      .spinner.error {
        animation: none;
        border-top-color: var(--red);
        border-color: var(--red);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
      }
      p {
        font-size: 13px;
        color: var(--muted);
        max-width: 340px;
        line-height: 1.5;
      }
      code {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Project Board wordt gestart…</h1>
      <p id="msg">Even geduld, de lokale server komt zo online.</p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var target = params.get("url") || "http://localhost:9876/";
        var pollUrl = new URL(target).origin + "/__root";
        var elapsed = 0;
        var intervalMs = 400;
        var timeoutMs = 20000;

        function poll() {
          fetch(pollUrl, { cache: "no-store" })
            .then(function (r) {
              if (r.ok) {
                location.replace(target);
                return;
              }
              scheduleNext();
            })
            .catch(scheduleNext);
        }

        function scheduleNext() {
          elapsed += intervalMs;
          if (elapsed >= timeoutMs) {
            document.getElementById("spinner").classList.add("error");
            document.getElementById("title").textContent =
              "Dit duurt langer dan verwacht";
            document.getElementById("msg").innerHTML =
              "Controleer of Node.js geïnstalleerd is, of bekijk het logbestand: <code>/tmp/backlog-server.log</code>.";
            return;
          }
          setTimeout(poll, intervalMs);
        }

        poll();
      })();
    </script>
  </body>
</html>

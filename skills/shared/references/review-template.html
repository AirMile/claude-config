<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Design review</title>
    <script src="/lib/themes.js"></script>
    <link rel="stylesheet" href="/css/theme-picker.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-hover: #1c2230;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --purple: #d2a8ff;
        --green: #3fb950;
        --amber: #d29922;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        scrollbar-color: var(--border) transparent;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 32px 80px;
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        gap: 24px;
      }
      .full {
        grid-column: 1 / -1;
      }
      @media (max-width: 820px) {
        .wrap {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }
      .card h2 {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .head h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.4px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .head p {
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.55;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid transparent;
      }
      .badge.type {
        color: var(--purple);
        background: color-mix(in srgb, var(--purple) 12%, transparent);
        border-color: color-mix(in srgb, var(--purple) 30%, transparent);
      }
      .badge.status {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border-color: color-mix(in srgb, var(--accent) 30%, transparent);
      }
      /* Wireframe */
      .wf {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .wf-box {
        border: 1px dashed
          color-mix(in srgb, var(--border) 60%, var(--text-muted));
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface-hover) 60%, transparent);
        padding: 18px 16px;
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
      }
      .wf-box .idx {
        color: var(--muted);
        font-size: 11px;
        margin-right: 8px;
      }
      .matrix {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .chip-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        min-width: 64px;
      }
      .chip {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
        font-style: italic;
      }
      /* Spec detail */
      .kv {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .kv .row .k {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .kv .row .v {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
      }
      /* Open questions */
      .q {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
        background: var(--bg);
      }
      .q.resolved {
        opacity: 0.7;
      }
      .q-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .q textarea {
        width: 100%;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
        resize: vertical;
      }
      .q .q-question {
        font-weight: 600;
        min-height: 38px;
        margin-bottom: 8px;
      }
      .q .q-answer {
        min-height: 54px;
      }
      .q .lbl {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
        margin: 8px 0 4px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        transition: all 0.15s;
      }
      .btn:hover {
        border-color: color-mix(in srgb, var(--border) 60%, var(--text-muted));
      }
      .btn-primary {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 15%, transparent);
        color: var(--accent);
      }
      .btn-ghost {
        background: none;
        color: var(--muted);
      }
      .btn-sm {
        padding: 3px 9px;
        font-size: 12px;
      }
      .q-actions {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }
      .save-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }
      .save-state {
        font-size: 12px;
        color: var(--muted);
      }
      .save-state.dirty {
        color: var(--amber);
      }
      .save-state.saved {
        color: var(--green);
      }
      .notfound {
        max-width: 640px;
        margin: 80px auto;
        text-align: center;
        color: var(--muted);
      }
      .notfound h1 {
        color: var(--text);
        font-size: 20px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <script id="review-data" type="application/json">
      {}
    </script>
    <div id="app"></div>
    <script>
      var data = {};
      try {
        data = JSON.parse(document.getElementById("review-data").textContent);
      } catch (e) {
        data = {};
      }

      // Working copy of the open questions (review notes)
      var notes = JSON.parse(JSON.stringify(data.reviewNotes || []));
      var dirty = false;
      var lastSaved = null;

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function baseUrl() {
        return (
          "/" + data.projectDir + "/review/" + encodeURIComponent(data.entity)
        );
      }

      function nowISO() {
        return new Date().toISOString();
      }

      // ── Wireframe panels ──
      function renderWireframe() {
        var spec = data.spec || {};
        if (data.type === "PAGE") {
          var secs = spec.sections || [];
          if (!secs.length)
            return '<div class="empty">Geen sections in de spec.</div>';
          return (
            '<div class="wf">' +
            secs
              .map(function (s, i) {
                return (
                  '<div class="wf-box"><span class="idx">' +
                  (i + 1) +
                  "</span>" +
                  esc(s) +
                  "</div>"
                );
              })
              .join("") +
            "</div>"
          );
        }
        // COMPONENT — variant/state/size matrix
        var rows = [
          ["Variants", spec.variants],
          ["Sizes", spec.sizes],
          ["States", spec.states],
        ];
        var hasAny = rows.some(function (r) {
          return r[1] && r[1].length;
        });
        var box =
          '<div class="wf-box" style="min-height:80px;font-size:14px">' +
          esc(data.entity) +
          "</div>";
        if (!hasAny)
          return (
            '<div class="wf">' +
            box +
            '<div class="empty">Geen variants/sizes/states in de spec.</div></div>'
          );
        var matrix = rows
          .filter(function (r) {
            return r[1] && r[1].length;
          })
          .map(function (r) {
            return (
              '<div class="chip-row"><span class="chip-label">' +
              r[0] +
              "</span>" +
              r[1]
                .map(function (v) {
                  return '<span class="chip">' + esc(v) + "</span>";
                })
                .join("") +
              "</div>"
            );
          })
          .join("");
        return (
          '<div class="wf">' +
          box +
          '<div class="matrix">' +
          matrix +
          "</div></div>"
        );
      }

      // ── Read-only spec detail ──
      function specRows() {
        var spec = data.spec || {};
        var rows = [];
        function list(v) {
          return v && v.length
            ? esc(v.join(", "))
            : '<span class="empty">—</span>';
        }
        if (data.type === "PAGE") {
          rows.push([
            "Routes",
            spec.routes ? esc(spec.routes) : list(spec.flows),
          ]);
          rows.push(["Flows", list(spec.flows)]);
          rows.push(["Uses components", list(spec.uses)]);
        } else {
          rows.push([
            "Scope",
            spec.scope ? esc(spec.scope) : '<span class="empty">—</span>',
          ]);
          rows.push(["Props", list(spec.props)]);
          rows.push(["Slots", list(spec.slots)]);
          rows.push(["Used in", list(spec.usedIn)]);
        }
        if (spec.notes) rows.push(["Notes", esc(spec.notes)]);
        return (
          '<div class="kv">' +
          rows
            .map(function (r) {
              return (
                '<div class="row"><div class="k">' +
                r[0] +
                '</div><div class="v">' +
                r[1] +
                "</div></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      // ── Open questions ──
      function renderQuestions() {
        if (!notes.length)
          return '<div class="empty" style="margin-bottom:12px">Nog geen openstaande vragen — voeg er een toe om een review-beslissing vast te leggen.</div>';
        return notes
          .map(function (n, i) {
            var resolved = n.status === "resolved";
            return (
              '<div class="q' +
              (resolved ? " resolved" : "") +
              '" data-idx="' +
              i +
              '">' +
              '<div class="q-top">' +
              '<span class="badge ' +
              (resolved ? "status" : "type") +
              '" style="font-size:10px">' +
              (resolved ? "RESOLVED" : "OPEN") +
              "</span>" +
              '<div class="q-actions">' +
              '<button class="btn btn-ghost btn-sm" data-act="toggle" data-idx="' +
              i +
              '">' +
              (resolved ? "Heropen" : "Markeer opgelost") +
              "</button>" +
              '<button class="btn btn-ghost btn-sm" data-act="remove" data-idx="' +
              i +
              '">Verwijder</button>' +
              "</div></div>" +
              '<span class="lbl">Vraag</span>' +
              '<textarea class="q-question" data-field="question" data-idx="' +
              i +
              '" placeholder="Open vraag of beslissing…">' +
              esc(n.question) +
              "</textarea>" +
              '<span class="lbl">Antwoord / beslissing</span>' +
              '<textarea class="q-answer" data-field="answer" data-idx="' +
              i +
              '" placeholder="Antwoord van de reviewer…">' +
              esc(n.answer) +
              "</textarea>" +
              "</div>"
            );
          })
          .join("");
      }

      function saveStateHtml() {
        var cls = dirty ? "dirty" : lastSaved ? "saved" : "";
        var txt = dirty
          ? "Niet-opgeslagen wijzigingen"
          : lastSaved
            ? "Opgeslagen"
            : "";
        return (
          '<span class="save-state ' +
          cls +
          '" id="save-state">' +
          txt +
          "</span>"
        );
      }

      function render() {
        var app = document.getElementById("app");
        if (!data.type || !data.spec) {
          app.innerHTML =
            '<div class="notfound"><h1>Geen design-spec gevonden</h1>' +
            "<p>Voor <strong>" +
            esc(data.entity) +
            "</strong> staat nog geen PAGE/COMPONENT in <code>project.json → design</code>. " +
            "Definieer het eerst met <code>/design-convert</code>.</p></div>";
          return;
        }
        var spec = data.spec;
        app.innerHTML =
          '<div class="wrap">' +
          // header
          '<div class="card head full">' +
          "<h1>" +
          esc(data.entity) +
          '<span class="badge type">' +
          esc(data.type) +
          "</span>" +
          (spec.status
            ? '<span class="badge status">' + esc(spec.status) + "</span>"
            : "") +
          "</h1>" +
          (spec.purpose ? "<p>" + esc(spec.purpose) + "</p>" : "") +
          "</div>" +
          // wireframe
          '<div class="card"><h2>Wireframe</h2>' +
          renderWireframe() +
          "</div>" +
          // spec detail
          '<div class="card"><h2>Spec</h2>' +
          specRows() +
          "</div>" +
          // open questions
          '<div class="card full"><h2>Open vragen &amp; beslissingen</h2>' +
          '<div id="qlist">' +
          renderQuestions() +
          "</div>" +
          '<div class="save-bar">' +
          '<button class="btn" id="add-q">+ Vraag toevoegen</button>' +
          '<button class="btn btn-primary" id="save-q">Opslaan</button>' +
          saveStateHtml() +
          "</div>" +
          "</div>" +
          "</div>";
        bind();
      }

      function markDirty() {
        dirty = true;
        lastSaved = null;
        var el = document.getElementById("save-state");
        if (el) {
          el.className = "save-state dirty";
          el.textContent = "Niet-opgeslagen wijzigingen";
        }
      }

      function bind() {
        // live text edits — update model without re-render (keeps focus)
        document
          .querySelectorAll("textarea[data-field]")
          .forEach(function (ta) {
            ta.addEventListener("input", function () {
              var i = +ta.getAttribute("data-idx");
              var f = ta.getAttribute("data-field");
              if (notes[i]) {
                notes[i][f] = ta.value;
                markDirty();
              }
            });
          });
        // action buttons (toggle / remove) — re-render
        document.querySelectorAll("button[data-act]").forEach(function (b) {
          b.addEventListener("click", function () {
            var i = +b.getAttribute("data-idx");
            var act = b.getAttribute("data-act");
            if (act === "toggle" && notes[i]) {
              notes[i].status =
                notes[i].status === "resolved" ? "open" : "resolved";
            } else if (act === "remove") {
              notes.splice(i, 1);
            }
            markDirty();
            document.getElementById("qlist").innerHTML = renderQuestions();
            bindList();
          });
        });
        var add = document.getElementById("add-q");
        if (add)
          add.addEventListener("click", function () {
            notes.push({
              question: "",
              answer: "",
              status: "open",
              at: nowISO(),
            });
            markDirty();
            document.getElementById("qlist").innerHTML = renderQuestions();
            bindList();
          });
        var save = document.getElementById("save-q");
        if (save) save.addEventListener("click", saveNotes);
      }

      // Re-bind only the question list (after partial re-render)
      function bindList() {
        document
          .querySelectorAll("#qlist textarea[data-field]")
          .forEach(function (ta) {
            ta.addEventListener("input", function () {
              var i = +ta.getAttribute("data-idx");
              var f = ta.getAttribute("data-field");
              if (notes[i]) {
                notes[i][f] = ta.value;
                markDirty();
              }
            });
          });
        document
          .querySelectorAll("#qlist button[data-act]")
          .forEach(function (b) {
            b.addEventListener("click", function () {
              var i = +b.getAttribute("data-idx");
              var act = b.getAttribute("data-act");
              if (act === "toggle" && notes[i]) {
                notes[i].status =
                  notes[i].status === "resolved" ? "open" : "resolved";
              } else if (act === "remove") {
                notes.splice(i, 1);
              }
              markDirty();
              document.getElementById("qlist").innerHTML = renderQuestions();
              bindList();
            });
          });
      }

      function saveNotes() {
        // stamp new entries that lack a timestamp
        notes.forEach(function (n) {
          if (!n.at) n.at = nowISO();
        });
        fetch(baseUrl() + "/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: data.type, reviewNotes: notes }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (res) {
            if (res && res.ok) {
              dirty = false;
              lastSaved = nowISO();
              data.reviewNotes = JSON.parse(JSON.stringify(notes));
              var el = document.getElementById("save-state");
              if (el) {
                el.className = "save-state saved";
                el.textContent = "Opgeslagen";
              }
            } else {
              alert("Opslaan mislukt: " + (res && res.error));
            }
          })
          .catch(function (err) {
            alert("Opslaan mislukt: " + err.message);
          });
      }

      // ── Live reload (skip while there are unsaved edits) ──
      (function () {
        if (!data.projectDir) return;
        try {
          var es = new EventSource("/" + data.projectDir + "/events");
          es.onmessage = function (e) {
            if (e.data !== "dashboard") return;
            if (dirty) return;
            fetch(baseUrl() + "/data")
              .then(function (r) {
                return r.json();
              })
              .then(function (nd) {
                if (JSON.stringify(nd) === JSON.stringify(data)) return;
                data = nd;
                notes = JSON.parse(JSON.stringify(data.reviewNotes || []));
                render();
              })
              .catch(function () {});
          };
        } catch (e) {}
      })();

      render();
    </script>
  </body>
</html>

      function closeDeleteModal() {
        document.getElementById("delete-modal").classList.remove("active");
        deletingName = null;
      }

      document
        .getElementById("delete-confirm")
        .addEventListener("click", () => {
          if (!deletingName) return;
          const name = deletingName;
          removeItem(name);
          syncJSON();
          closeDeleteModal();
          render();
          toast(name + " deleted");
        });

      document
        .getElementById("delete-modal")
        .addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeDeleteModal();
          if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("delete-confirm").click();
          }
        });

      // ─── Detail drawer: close wiring ──────────────────────────────────
      document
        .getElementById("drawer-close")
        .addEventListener("click", closeDetailDrawer);
      document
        .getElementById("drawer-overlay")
        .addEventListener("click", (e) => {
          if (e.target.id === "drawer-overlay") closeDetailDrawer();
        });
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Escape" &&
          document.getElementById("drawer-overlay").classList.contains("open")
        ) {
          closeDetailDrawer();
        }
      });

      // Close modals on overlay click
      ["modal", "delete-modal"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener("click", (e) => {
          if (e.target === el) {
            if (id === "modal") closeModal();
            else closeDeleteModal();
          }
        });
      });

      // ─── Init ───────────────────────────────────────────────────────
      let _sidebarResizeT;
      window.addEventListener("resize", () => {
        clearTimeout(_sidebarResizeT);
        _sidebarResizeT = setTimeout(updateSidebarVisibility, 150);
      });
      document.addEventListener("click", () => {
        document
          .querySelectorAll(".row-menu:not([hidden])")
          .forEach((m) => (m.hidden = true));
        document
          .querySelectorAll('.row-menu-btn[aria-expanded="true"]')
          .forEach((b) => b.setAttribute("aria-expanded", "false"));
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape")
          document
            .querySelectorAll(".row-menu:not([hidden])")
            .forEach((m) => (m.hidden = true));
      });
      document.addEventListener("click", (e) => {
        const openBtn = e.target.closest(".bk-file-open-btn");
        if (openBtn) {
          e.preventDefault();
          e.stopPropagation();
          openInVSCode(openBtn.dataset.openUrl, openBtn);
          return;
        }
        const row = e.target.closest(".bk-file-row");
        if (row) {
          e.preventDefault();
          toggleFileDiffRow(row);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          const row = document.activeElement?.closest?.(".bk-file-row");
          if (row && document.activeElement === row) {
            e.preventDefault();
            toggleFileDiffRow(row);
          }
        }
      });
      render();

      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        const sec = id ? document.getElementById(id) : null;
        if (sec && sec.classList.contains("collapsed")) {
          sec.classList.remove("collapsed");
          setCollapsed("section:" + id, false);
        }
      });
    </script>
    <button
      id="back-to-top"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
      title="Back to top"
    >
      ↑
    </button>
    <script>
      (function () {
        const btn = document.getElementById("back-to-top");
        window.addEventListener(
          "scroll",
          () => {
            btn.classList.toggle("visible", window.scrollY > 300);
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>

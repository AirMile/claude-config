    <script>
      // ─── State ──────────────────────────────────────────────────────
      const fileRaw = document.getElementById("backlog-data").textContent;
      let data = JSON.parse(fileRaw);
      if (!data.features) data.features = [];
      initCollapseStore("backlog", data.project);

      let _trackFilter = "ALL"; // "ALL" | "DESIGN" | "DEV"

      // Wire up project settings modal (⚙ button auto-mounted by /lib/settings-modal.js)
      if (window.SettingsModal) {
        const _projectDir =
          location.pathname.split("/").filter(Boolean)[0] || "";
        window.SettingsModal.configure({
          projectDir: _projectDir,
          getMode: () => (data.team && data.team.mode) || "solo",
          onSaved: (mode) => {
            if (!data.team) data.team = {};
            data.team.mode = mode;
            render();
          },
        });
        window.SettingsModal.mountToggle(
          document.getElementById("team-mode-toggle-slot"),
        );
      }

      const STATUSES = ["TODO", "DEFINED", "DOING", "DONE"];
      const ARCHIVED_STATUSES = ["CANCELLED"];

      const STATUS_LABELS_DEV = {
        TODO: "To do",
        DEFINED: "To build",
        DOING: "To verify",
        DONE: "To refactor",
        CANCELLED: "Archived",
      };

      const TRANSITION_LABELS_DESIGN = {
        TODO: "designing",
        DEFINED: "converting",
        DOING: "contenting",
        DONE: "shipping",
      };
      const TRANSITION_LABELS_DEV = {
        TODO: "defining",
        DEFINED: "building",
        DOING: "verifying",
        DONE: "refactoring",
      };

      function isDesignTrackType(type) {
        return DESIGN_PIPELINE_TYPES.includes(type || "FEATURE");
      }
      const STATUS_COLORS = {
        TODO: "var(--todo)",
        DEFINED: "var(--defined)",
        DOING: "var(--doing)",
        DONE: "var(--done)",
        CANCELLED: "var(--text-dim)",
      };
      const PHASE_CLASSES = {
        P1: "phase-p1",
        P2: "phase-p2",
        P3: "phase-p3",
        P4: "phase-p4",
      };

      const PRIMARY_TYPE = {
        FEATURE: "FEATURE",
        PAGE: "FEATURE",
        COMPONENT: "FEATURE",
        INTEGRATION: "FEATURE",
        UI: "FEATURE",
        API: "FEATURE",
        THEME: "FEATURE",
        A11Y: "FEATURE",
        BUG: "BUG",
        CHANGE: "CHANGE",
        PERF: "CHANGE",
        REFACTOR: "REFACTOR",
        "PAGE-GAP": "GAP",
      };

      const TYPE_ICONS = {
        FEATURE: { icon: "◆", cls: "type-feature" },
        BUG: { icon: "✕", cls: "type-bug" },
        CHANGE: { icon: "✎", cls: "type-change" },
        REFACTOR: { icon: "↻", cls: "type-refactor" },
        GAP: { icon: "□", cls: "type-gap" },
      };

      const SUB_TYPE_LABELS = {
        PAGE: "page",
        COMPONENT: "component",
        INTEGRATION: "integration",
        UI: "ui",
        API: "api",
        THEME: "theme",
        A11Y: "a11y",
        PERF: "perf",
        "PAGE-GAP": "gap",
      };

      const DESIGN_TYPES = [
        "PAGE",
        "COMPONENT",
        "THEME",
        "A11Y",
        "PERF",
        "PAGE-GAP",
      ];
      const DESIGN_PIPELINE_TYPES = ["PAGE", "COMPONENT"];
      const DESIGN_ONESHOT_TYPES = ["THEME", "A11Y", "PERF"];

      // ─── Helpers ────────────────────────────────────────────────────
      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str || "";
        return d.innerHTML;
      }

      function md(s) {
        if (!s) return "";
        try {
          return marked.parse(s);
        } catch {
          return esc(s);
        }
      }

      function findItem(name) {
        const item = data.features.find((f) => f.name === name);
        if (item) return { item, list: "features" };
        return null;
      }

      function removeItem(name) {
        const fi = data.features.findIndex((f) => f.name === name);
        if (fi !== -1) data.features.splice(fi, 1);
      }

      function updateStatus(name, newStatus) {
        const found = findItem(name);
        if (!found) return;
        found.item.status = newStatus;
        delete found.item.stage;
        if (newStatus === "DONE") {
          found.item.date = new Date().toISOString().slice(0, 10);
        }
      }

      function syncJSON() {
        data.updated = new Date().toISOString().slice(0, 10);
        const persistable = data;
        const el = document.getElementById("backlog-data");
        el.textContent = "\n" + JSON.stringify(persistable, null, 2) + "\n";
        saveToDisk(persistable);
      }

      const SAVE_URL = (() => {
        const p = location.pathname.replace(/\/+$/, "");
        return p ? p + "/save" : "/save";
      })();

      let saveTimer = null;
      function saveToDisk(payload) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            const res = await fetch(SAVE_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload ?? data),
            });
            if (!res.ok) throw new Error("save failed");
          } catch {
            toast("Server not reachable — start: node serve-backlog.js");
          }
        }, 300);
      }

      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("visible");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("visible"), 2000);
      }

      function openInVSCode(url, el) {
        const orig = el.style.color;
        el.style.color = "var(--text-dim)";
        fetch(url, { method: "POST" })
          .then((r) => r.json())
          .then((d) => {
            if (d.ok) {
              el.style.color = "var(--done)";
              setTimeout(() => (el.style.color = orig), 1000);
            } else {
              el.style.color = "var(--danger)";
              toast("Error: " + (d.error || "unknown"));
              setTimeout(() => (el.style.color = orig), 2000);
            }
          })
          .catch(() => {
            el.style.color = "var(--danger)";
            toast("Could not reach VS Code");
            setTimeout(() => (el.style.color = orig), 2000);
          });
      }

      async function toggleFileDiffRow(row) {
        const panel = row.nextElementSibling?.classList.contains("bk-file-diff")
          ? row.nextElementSibling
          : row.closest(".fm-file")?.querySelector(".fm-file-diff");
        if (!panel) return;
        const open = row.getAttribute("aria-expanded") === "true";
        if (open) {
          panel.hidden = true;
          row.setAttribute("aria-expanded", "false");
          return;
        }
        row.setAttribute("aria-expanded", "true");
        panel.hidden = false;
        if (!panel.dataset.loaded) {
          panel.innerHTML = '<div class="bk-diff-loading">Loading…</div>';
          const basePath = location.pathname.replace(
            /\/(backlog|dashboard)\/?$/,
            "",
          );
          const url =
            basePath +
            "/diff/" +
            encodeURIComponent(row.dataset.path).replace(/%2F/g, "/");
          try {
            const r = await fetch(url);
            const d = await r.json();
            panel.innerHTML = renderDiff(d, row.dataset.path);
            panel.dataset.loaded = "1";
          } catch (e) {
            panel.innerHTML = `<div class="bk-diff-error">Could not load diff: ${esc(e.message)}</div>`;
          }
        }
      }

      function renderDiff(d, filePath = "") {
        if (!d.git)
          return '<div class="bk-diff-empty">No git repo — diff not available.</div>';
        if (!d.tracked && !d.working)
          return '<div class="bk-diff-empty">File not yet tracked by git.</div>';
        const hasWorking = !!d.working;
        const hasRecent = !!d.recent;
        const showLabels = hasWorking && hasRecent;
        const sections = [];
        if (hasWorking) {
          const label = showLabels
            ? '<div class="bk-diff-label">Uncommitted</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatDiff(d.working, filePath)}</div>`,
          );
        }
        if (hasRecent) {
          const label = showLabels
            ? '<div class="bk-diff-label">Recent commits</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatGitLog(d.recent, filePath)}</div>`,
          );
        }
        if (!sections.length)
          return '<div class="bk-diff-empty">No changes found.</div>';
        return sections.join("");
      }

      function formatDiff(text, filePath = "") {
        const ext = (filePath.split(".").pop() || "").toLowerCase();
        const langMap = {
          ts: "typescript",
          tsx: "typescript",
          js: "javascript",
          jsx: "javascript",
          css: "css",
          json: "json",
          html: "xml",
          md: "markdown",
          py: "python",
          rs: "rust",
          go: "go",
          sh: "bash",
        };
        const lang = langMap[ext] || null;
        function hl(s) {
          if (lang && typeof hljs !== "undefined") {
            try {
              return hljs.highlight(s, { language: lang }).value;
            } catch {}
          }
          return esc(s);
        }
        const SKIP = [
          "diff --git ",
          "index ",
          "new file mode",
          "deleted file mode",
          "similarity index",
          "rename from",
          "rename to",
          "Binary files",
          "--- ",
          "+++ ",
          "\\ No newline",
        ];
        const lines = text.split("\n");
        let oldLn = 0,
          newLn = 0;
        const rows = [];
        for (const line of lines) {
          if (SKIP.some((p) => line.startsWith(p))) continue;
          if (line.startsWith("@@")) {
            const m = line.match(
              /@@\s+-(\d+)(?:,\d+)?\s+\+(\d+)(?:,\d+)?\s+@@/,
            );
            if (m) {
              oldLn = parseInt(m[1], 10);
              newLn = parseInt(m[2], 10);
            }
            const ctx = line.replace(/^@@.*?@@\s*/, "").trim();
            rows.push(
              `<div class="bk-diff-hunk"><span class="bk-diff-gutter"></span><span class="bk-diff-text">${ctx ? "… " + esc(ctx) : "…"}</span></div>`,
            );
            continue;
          }
          let cls = "",
            l = "",
            r = "";
          if (line.startsWith("+")) {
            cls = "bk-diff-add";
            r = newLn++;
          } else if (line.startsWith("-")) {
            cls = "bk-diff-del";
            l = oldLn++;
          } else {
            l = oldLn++;
            r = newLn++;
          }
          const content = line.length ? line.slice(1) : "";
          rows.push(
            `<div class="bk-diff-row ${cls}"><span class="bk-diff-gutter">${l || ""}<span class="sep">·</span>${r || ""}</span><span class="bk-diff-text">${hl(content)}</span></div>`,
          );
        }
        return `<div class="bk-diff">${rows.join("")}</div>`;
      }

      function formatGitLog(text, filePath = "") {
        const lines = text.split("\n");
        const out = [];
        let buf = [];
        let currentHead = null;
        const flush = () => {
          if (!currentHead && !buf.length) return;
          const diffHtml = buf.length
            ? formatDiff(buf.join("\n"), filePath)
            : "";
          let headHtml = "";
          if (currentHead) {
            const [, subject, age] = currentHead;
            const m = subject.match(/^(\w+)[\s(]/);
            const phase = m ? m[1].toLowerCase() : "other";
            const p = ["build", "verify", "refactor"].includes(phase)
              ? phase
              : "other";
            headHtml = `<div class="bk-commit-head"><span class="bk-phase-badge bk-phase-badge--${p}">${esc(p)}</span><span class="bk-commit-subject">${esc(subject)}</span><span class="bk-commit-age">${esc(age || "")}</span></div>`;
          }
          out.push(`<div class="bk-commit-block">${headHtml}${diffHtml}</div>`);
          buf = [];
          currentHead = null;
        };
        for (const line of lines) {
          if (
            line.includes("\t") &&
            !line.startsWith(" ") &&
            !line.match(/^[+\-@]/)
          ) {
            flush();
            const parts = line.split("\t");
            currentHead = [parts[0] || "", parts[1] || "", parts[2] || ""];
          } else {
            buf.push(line);
          }
        }
        flush();
        return out.join("");
      }

      function getNextSkill(f) {
        const isGame = data.source && data.source.startsWith("/game");
        const devPrefix = isGame ? "game" : "dev";

        // PAGE-GAP en non-design → dev/game-pipeline
        if (!DESIGN_TYPES.includes(f.type) || f.type === "PAGE-GAP") {
          if (f.status === "TODO")
            return { cmd: `/${devPrefix}-define ${f.name}` };
          if (f.status === "DEFINED")
            return { cmd: `/${devPrefix}-build ${f.name}` };
          if (f.status === "DOING")
            return { cmd: `/${devPrefix}-verify ${f.name}` };
          if (f.status === "DONE")
            return { cmd: `/${devPrefix}-refactor ${f.name}` };
          return null;
        }

        // PAGE/COMPONENT mini-pipeline: design → convert → content → /design-check (batch)
        if (DESIGN_PIPELINE_TYPES.includes(f.type)) {
          if (f.status === "TODO") return { cmd: `/design-create ${f.name}` };
          if (f.status === "DEFINED")
            return { cmd: `/design-create ${f.name}` };
          if (f.status === "DOING") {
            // Show content-fill button when built but not yet content-filled
            if (f.stage === "built" && f.contentStatus !== "filled")
              return { cmd: `/design-content ${f.name}` };
            return null; // content done or pre-build — runtime audit via /design-check batch at release end
          }
          return null; // DONE: no button
        }

        // One-shot: THEME/A11Y/PERF — TODO only
        if (f.status !== "TODO") return null;
        switch (f.type) {
          case "THEME":
            return { cmd: `/design-tokens` };
          case "A11Y":
            return { cmd: `/design-check --scope=a11y ${f.name}` };
          case "PERF":
            return { cmd: `/design-check ${f.name}` };
        }
        return null;
      }

      // ─── Render ─────────────────────────────────────────────────────
      function render() {
        // Update page header
        const title = document.getElementById("page-title");
        const subtitle = document.getElementById("page-subtitle");
        if (title) title.textContent = data.project || "Backlog";
        if (subtitle) subtitle.textContent = data.overview || "";

        // Build board
        const board = document.getElementById("board");
        if (!board) return;
        board.innerHTML = "";

        const active = data.features.filter((f) => !f.shipped);
        const hasDesign = active.some((f) => isDesignTrackType(f.type));
        const hasDev = active.some((f) => !isDesignTrackType(f.type));
        const dualTrack = hasDesign && hasDev;

        // Build track filter pills
        const pillsContainer = document.getElementById("type-pills");
        if (pillsContainer) {
          if (dualTrack) {
            pillsContainer.innerHTML =
              `<button class="type-pill${_trackFilter === "ALL" ? " active" : ""}" onclick="_trackFilter='ALL';render()">All</button>` +
              `<button class="type-pill${_trackFilter === "DESIGN" ? " active" : ""}" onclick="_trackFilter='DESIGN';render()">Design</button>` +
              `<button class="type-pill${_trackFilter === "DEV" ? " active" : ""}" onclick="_trackFilter='DEV';render()">Dev</button>`;
          } else {
            pillsContainer.innerHTML = "";
          }
        }

        // Build action-btn toolbar
        const actionContainer = document.getElementById("action-btns");
        if (actionContainer) {
          let actionHtml = "";
          if ((data.features?.length || 0) === 0 && data.flags?.hasSeed) {
            actionHtml +=
              `<button class="action-btn action-plan" data-cmd="/project-plan" title="/project-plan">` +
              `<span class="action-icon">⊕</span><span class="action-label">Plan</span></button>`;
          }
          if (data.team?.mode === "team" && data.team?.tracker) {
            actionHtml +=
              `<button class="action-btn action-issues" data-cmd="/team-issues" title="/team-issues">` +
              `<span class="action-icon">↻</span><span class="action-label">Sync issues</span></button>`;
          }
          actionContainer.innerHTML = actionHtml;
          actionContainer.querySelectorAll(".action-btn").forEach((btn) => {
            btn.addEventListener("click", async (e) => {
              e.stopPropagation();
              const cmd = btn.dataset.cmd;
              await navigator.clipboard.writeText(cmd);
              const lbl = btn.querySelector(".action-label");
              const orig = lbl.textContent;
              lbl.textContent = "Copied";
              setTimeout(() => {
                lbl.textContent = orig;
              }, 1500);
              toast("Copied: " + cmd);
            });
          });
        }

        const searchTerm = (
          document.getElementById("search-input")?.value || ""
        ).toLowerCase();

        let sidebarHtml = "";

        // ─── renderSection ────────────────────────────────────────────
        function renderSection({
          id,
          label,
          status,
          typeFilter,
          batchSkill,
          transitionLabels,
        }) {
          const effectiveTypeFilter = (type) => {
            if (_trackFilter === "DESIGN" && !isDesignTrackType(type))
              return false;
            if (_trackFilter === "DEV" && isDesignTrackType(type))
              return false;
            return typeFilter(type);
          };

          let items = data.features.filter(
            (f) =>
              f.status === status &&
              !f.shipped &&
              effectiveTypeFilter(f.type) &&
              (status === "TODO" || !DESIGN_ONESHOT_TYPES.includes(f.type)),
          );

          if (searchTerm) {
            items = items.filter(
              (f) =>
                f.name.toLowerCase().includes(searchTerm) ||
                (f.description || "").toLowerCase().includes(searchTerm),
            );
          }

          // Always render TO DO section (even empty) so the "+ add" button stays reachable.
          const isTodoSection = status === "TODO" && id === "todo";
          if (items.length === 0 && !isTodoSection) return;
          if (items.length === 0 && searchTerm) return;

          const sectionId = `${id}-section`;

          const section = document.createElement("section");
          section.className = "group";
          section.id = sectionId;
          section.dataset.status = status;

          const header = document.createElement("div");
          header.className = "group-header";
          header.dataset.status = status;

          let blockedSuffix = "";
          if (status === "DEFINED") {
            const blockedCount = items.filter((f) => {
              const deps = f.dependencies || [];
              return deps.some((dep) => {
                const found = findItem(dep);
                return !found || found.item.status !== "DONE";
              });
            }).length;
            blockedSuffix =
              blockedCount > 0
                ? ` <span class="header-blocked-count">(${blockedCount} blocked)</span>`
                : "";
          }

          let batchBtnHtml = "";
          if (batchSkill && items.length > 0 && data.team?.mode !== "team") {
            const isDesignSection = batchSkill === "check";
            const cmdPrefix = isDesignSection
              ? "design"
              : data.source && data.source.startsWith("/game")
                ? "game"
                : "dev";
            const cmd = `/${cmdPrefix}-${batchSkill}`;
            batchBtnHtml = `<button class="group-batch-btn" data-cmd="${cmd}" title="Copy ${cmd}" aria-label="Copy ${cmd}">
                  <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M5 11H3.5A1.5 1.5 0 012 9.5v-7A1.5 1.5 0 013.5 1h7A1.5 1.5 0 0112 2.5V5"/></svg>
                  <span>batch (${items.length})</span>
                 </button>`;
          }

          const addBtnHtml =
            status === "TODO"
              ? `<button class="group-add-btn" data-cmd="/project-todo" title="Copy /project-todo" aria-label="Add todo">
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
                 </button>`
              : "";

          header.innerHTML = `<h2>${esc(label)}${blockedSuffix}</h2>${batchBtnHtml}${addBtnHtml}`;

          header.addEventListener("click", (e) => {
            const addBtn = e.target.closest(".group-add-btn");
            if (addBtn) {
              e.stopPropagation();
              const cmd = addBtn.dataset.cmd;
              navigator.clipboard.writeText(cmd).then(() => {
                toast(`Copied: ${cmd}`);
              });
              return;
            }
            const batchBtn = e.target.closest(".group-batch-btn");
            if (batchBtn) {
              e.stopPropagation();
              const cmd = batchBtn.dataset.cmd;
              navigator.clipboard.writeText(cmd).then(() => {
                const targets = data.features.filter(
                  (f) =>
                    f.status === status &&
                    !f.shipped &&
                    !f.refactor &&
                    effectiveTypeFilter(f.type),
                );
                targets.forEach((f) => {
                  f.transition = transitionLabels[status] || "active";
                });
                if (targets.length) {
                  syncJSON();
                  render();
                }
                toast(
                  `Copied: ${cmd}${targets.length ? ` — ${targets.length} marked` : ""}`,
                );
              });
              return;
            }
            section.classList.toggle("collapsed");
            setCollapsed(
              "section:" + section.id,
              section.classList.contains("collapsed"),
            );
          });

          section.appendChild(header);

          const body = document.createElement("div");
          body.className = "group-body";

          if (items.length === 0 && isTodoSection) {
            const emptyEl = document.createElement("div");
            emptyEl.style.cssText =
              "padding:12px 16px;font-size:13px;opacity:0.45;font-style:italic;";
            emptyEl.textContent = "No tasks yet — click + to add one.";
            body.appendChild(emptyEl);
          } else {
            const phaseOrder = ["P1", "P2", "P3", "P4", "—"];
            const phases = [...new Set(items.map((f) => f.phase || "—"))].sort(
              (a, b) => phaseOrder.indexOf(a) - phaseOrder.indexOf(b),
            );

            phases.forEach((phase) => {
              const phaseItems = items.filter(
                (f) => (f.phase || "—") === phase,
              );
              const phaseGroup = document.createElement("div");
              phaseGroup.className = "phase-group";
              phaseGroup.dataset.collapseKey = "phase:" + status + ":" + phase;

              const phaseHeader = document.createElement("header");
              phaseHeader.className = "phase-header";
              phaseHeader.innerHTML = `<svg class="phase-chevron" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(phase)}`;
              phaseHeader.onclick = () => {
                phaseGroup.classList.toggle("phase-collapsed");
                setCollapsed(
                  phaseGroup.dataset.collapseKey,
                  phaseGroup.classList.contains("phase-collapsed"),
                );
              };
              phaseGroup.appendChild(phaseHeader);

              phaseItems.forEach((f) => {
                phaseGroup.appendChild(renderRow(f));
              });

              body.appendChild(phaseGroup);
            });
          } // end else (items.length > 0)

          section.appendChild(body);
          board.appendChild(section);

          sidebarHtml += `<a href="#${sectionId}" class="sb-${status.toLowerCase()}" data-status="${status}">${esc(label)}</a>`;
        }

        // ─── Sections ─────────────────────────────────────────────────
        const sections = [
          {
            id: "todo",
            label: "To do",
            status: "TODO",
            typeFilter: () => true,
            batchSkill: null,
            transitionLabels: TRANSITION_LABELS_DEV,
          },
          {
            id: "build",
            label: "To build",
            status: "DEFINED",
            typeFilter: (t) => !isDesignTrackType(t),
            batchSkill: null,
            transitionLabels: TRANSITION_LABELS_DEV,
          },
          {
            id: "verify",
            label: "To verify",
            status: "DOING",
            typeFilter: (t) => !isDesignTrackType(t),
            batchSkill: null,
            transitionLabels: TRANSITION_LABELS_DEV,
          },
          {
            id: "refactor",
            label: "To refactor",
            status: "DONE",
            typeFilter: (t) => !isDesignTrackType(t),
            batchSkill: "refactor",
            transitionLabels: TRANSITION_LABELS_DEV,
          },
          {
            id: "convert",
            label: "To convert",
            status: "DEFINED",
            typeFilter: isDesignTrackType,
            batchSkill: null,
            transitionLabels: TRANSITION_LABELS_DESIGN,
          },
          {
            id: "building",
            label: "To check",
            status: "DOING",
            typeFilter: isDesignTrackType,
            batchSkill: "check",
            transitionLabels: TRANSITION_LABELS_DESIGN,
          },
        ];
        sections.forEach(renderSection);

        // Archived (CANCELLED) section — collapsed by default
        const cancelledItems = data.features.filter(
          (f) => f.status === "CANCELLED",
        );
        if (cancelledItems.length > 0) {
          const archSection = document.createElement("section");
          archSection.className = "group group--archived collapsed";
          archSection.id = "cancelled-section";

          const archHeader = document.createElement("div");
          archHeader.className = "group-header";
          archHeader.dataset.status = "CANCELLED";
          archHeader.innerHTML = `<h2>${esc("Archived")} (${cancelledItems.length})</h2>`;
          archHeader.addEventListener("click", () => {
            archSection.classList.toggle("collapsed");
            setCollapsed(
              "section:cancelled-section",
              archSection.classList.contains("collapsed"),
            );
          });
          archSection.appendChild(archHeader);

          const archBody = document.createElement("div");
          archBody.className = "group-body";
          cancelledItems.forEach((f) => {
            archBody.appendChild(renderRow(f));
          });
          archSection.appendChild(archBody);
          board.appendChild(archSection);

          sidebarHtml += `<a href="#cancelled-section" class="sb-cancelled" data-status="CANCELLED" style="opacity:0.45;font-size:11px">${esc("Archived")} (${cancelledItems.length})</a>`;
        }

        // Build sidebar
        const sidebar = document.getElementById("sidebar");
        if (sidebar) {
          sidebar.innerHTML = sidebarHtml;
          sidebar.onclick = (e) => {
            const link = e.target.closest("a[data-status]");
            if (!link) return;
            const sectionId = link.getAttribute("href").slice(1);
            const sec = document.getElementById(sectionId);
            if (sec && sec.classList.contains("collapsed")) {
              sec.classList.remove("collapsed");
              setCollapsed("section:" + sectionId, false);
            }
          };
        }

        updateSidebarVisibility();
        updateSidebarActive();
        applyCollapseState();
      }

      function applyCollapseState() {
        // Status sections (default open, except cancelled which defaults closed)
        document.querySelectorAll("section.group[id]").forEach((sec) => {
          const defaultClosed = sec.id === "cancelled-section";
          sec.classList.toggle(
            "collapsed",
            isCollapsed("section:" + sec.id, defaultClosed),
          );
        });

        // Phase groups (default open)
        document
          .querySelectorAll("[data-collapse-key^='phase:']")
          .forEach((el) => {
            el.classList.toggle(
              "phase-collapsed",
              isCollapsed(el.dataset.collapseKey, false),
            );
          });

        // Expanded feature row (single selection, default none)
        const expandedName = getSingle("expandedRow");
        if (expandedName) {
          const row = document.querySelector(
            `.row[data-name="${CSS.escape(expandedName)}"]`,
          );
          if (row) toggleRowExpand(row, expandedName);
        }
      }

      function updateSidebarVisibility() {
        const layoutEl = document.querySelector(".layout");
        const sidebarEl = document.getElementById("sidebar");
        if (!layoutEl || !sidebarEl) return;
        const linkCount = sidebarEl.querySelectorAll("a").length;
        const fitsViewport =
          document.documentElement.scrollHeight <= window.innerHeight + 1;
        layoutEl.classList.toggle(
          "layout--no-sidebar",
          linkCount <= 1 || fitsViewport,
        );
      }

      // ─── Row rendering ───────────────────────────────────────────────
      function renderRow(f) {
        const primaryType = PRIMARY_TYPE[f.type] || "FEATURE";
        const typeInfo = TYPE_ICONS[primaryType] || TYPE_ICONS.FEATURE;
        const subLabel = SUB_TYPE_LABELS[f.type] || null;

        let metaHtml = "";
        const deps = f.dependencies || [];
        const unresolvedDeps = deps.filter((dep) => {
          const found = findItem(dep);
          return !found || found.item.status !== "DONE";
        });
        const isBlocked = unresolvedDeps.length > 0;
        if (isBlocked) {
          metaHtml += `<span class="dep-blocked-label">blocked by</span>`;
          unresolvedDeps.forEach((dep) => {
            metaHtml += `<span class="dep-icon" title="Waiting for ${esc(dep)}">${esc(dep)}</span>`;
          });
        }
        if (f.auto && f.status !== "DONE") {
          metaHtml += `<span class="auto-badge">AUTO</span>`;
        }
        const pendingGaps = Array.isArray(f.gaps)
          ? f.gaps.filter((g) => g.status === "pending").length
          : 0;
        if (pendingGaps > 0) {
          metaHtml += `<span class="gap-badge" title="${pendingGaps} unlinked handler${pendingGaps > 1 ? "s" : ""} — run /design-create ${f.name} to link">⚠ ${pendingGaps} gap${pendingGaps > 1 ? "s" : ""}</span>`;
        }
        if (f.status === "DONE" && f.refactor) {
          if (f.refactor === "ROLLED_BACK") {
            metaHtml += `<span class="refactor-badge refactor-rollback">⚠ rolled back</span>`;
          } else {
            metaHtml += `<span class="refactor-badge refactor-done">✓ refactored</span>`;
          }
        }
        if (
          DESIGN_PIPELINE_TYPES.includes(f.type) &&
          f.stage === "built" &&
          f.contentStatus !== "filled"
        ) {
          metaHtml += `<span class="copy-badge" title="Copy not yet filled — run /design-content ${esc(f.name)}">copy: placeholder</span>`;
        }
        if (f.externalRef?.url) {
          const refType = f.externalRef.type || "github";
          const refId = f.externalRef.id || "?";
          const refLabel = refType === "github" ? `#${refId}` : refId;
          metaHtml +=
            `<a class="card-ref-link card-ref-${esc(refType)}" href="${esc(f.externalRef.url)}" target="_blank" rel="noopener" title="${esc(f.externalRef.url)}">${esc(refLabel)}</a>` +
            `<button class="card-ref-copy" data-copy="${esc(f.externalRef.url)}" title="Copy issue URL">⎘</button>`;
        } else if (f.github_issue) {
          const ghNum = f.github_issue.match(/\/(\d+)$/);
          metaHtml += `<a class="card-gh-link" href="${esc(f.github_issue)}" target="_blank" rel="noopener" title="${esc(f.github_issue)}">#${ghNum ? ghNum[1] : "?"}</a>`;
        }

        if (f.shipped && f.transition) delete f.transition;

        const row = document.createElement("div");
        const isActive = !!f.transition;
        row.className =
          "row" +
          (isBlocked ? " row--blocked" : "") +
          (isActive ? " row--active" : "");
        row.dataset.name = f.name;

        const next = getNextSkill(f);
        const copyCmd = next ? next.cmd : null;
        const copyTitle = copyCmd || f.name;

        const actionBtnHtml = isActive
          ? `<button class="row-annuleer-btn" title="Cancel">
              <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 2l12 12M14 2L2 14"/></svg>
             </button>`
          : `<button class="row-copy-btn ${typeInfo.cls}" title="${copyTitle}" data-cmd="${copyCmd || ""}">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M5 11H3.5A1.5 1.5 0 012 9.5v-7A1.5 1.5 0 013.5 1h7A1.5 1.5 0 0112 2.5V5"/></svg>
             </button>`;

        const menuItemsHtml = (() => {
          if (f.status === "TODO" || f.status === "DEFINED") {
            const canOutsource = !f.externalRef?.url && !f.github_issue;
            const outsourceItem = canOutsource
              ? `<button class="row-menu-item row-outsource-btn" data-cmd="/team-outsource ${esc(f.name)}">→ Outsource</button>`
              : "";
            const canConvert =
              f.status === "TODO" && DESIGN_PIPELINE_TYPES.includes(f.type);
            const convertItem = canConvert
              ? `<button class="row-menu-item row-convert-btn" data-cmd="/design-create ${esc(f.name)}">⌅ Convert from sketch</button>`
              : "";
            const canReview = DESIGN_PIPELINE_TYPES.includes(f.type);
            const reviewItem = canReview
              ? `<button class="row-menu-item row-review-btn" data-name="${esc(f.name)}">▦ Bekijk design →</button>`
              : "";
            return (
              `<button class="row-menu-item row-edit-btn">✎ Edit</button>` +
              reviewItem +
              outsourceItem +
              convertItem +
              `<button class="row-menu-item row-cancel-btn">○ Archive</button>` +
              `<button class="row-menu-item row-delete-btn row-menu-item--danger">✕ Delete</button>`
            );
          }
          if (f.status === "CANCELLED") {
            return (
              `<button class="row-menu-item row-restore-btn">↩ Restore</button>` +
              `<button class="row-menu-item row-delete-btn row-menu-item--danger">✕ Delete permanently</button>`
            );
          }
          return "";
        })();
        const editDeleteHtml = menuItemsHtml
          ? `<div class="row-menu-wrap">
               <button class="row-menu-btn" title="Actions" aria-haspopup="menu" aria-expanded="false">⋯</button>
               <div class="row-menu" role="menu" hidden>${menuItemsHtml}</div>
             </div>`
          : "";

        row.innerHTML = `<div class="row-summary">
          ${actionBtnHtml}
          <span class="row-name">${esc(f.name)}</span>
          ${isActive ? `<span class="row-transition-label">${esc(f.transition)}</span>` : ""}
          ${subLabel ? `<span class="row-sub-tag">${subLabel}</span>` : ""}
          ${f.description ? `<span class="row-desc">${esc(f.description)}</span>` : ""}
          <div class="row-actions-group">
            <div class="row-meta">${metaHtml}</div>
            ${editDeleteHtml}
          </div>
        </div>
        <div class="row-expand"></div>`;

        const summary = row.querySelector(".row-summary");
        const editBtn = row.querySelector(".row-edit-btn");
        const deleteBtn = row.querySelector(".row-delete-btn");
        const cancelBtn = row.querySelector(".row-cancel-btn");
        const restoreBtn = row.querySelector(".row-restore-btn");
        let copyBtn = null;

        if (isActive) {
          const annuleerBtn = row.querySelector(".row-annuleer-btn");
          annuleerBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findItem(f.name);
            if (found) {
              delete found.item.transition;
              syncJSON();
              render();
            }
          });
        } else {
          copyBtn = row.querySelector(".row-copy-btn");
          copyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const cmd = copyBtn.dataset.cmd;
            if (!cmd) return;
            navigator.clipboard.writeText(cmd).then(() => {
              const found = findItem(f.name);
              if (found) {
                const tlabels = isDesignTrackType(f.type)
                  ? TRANSITION_LABELS_DESIGN
                  : TRANSITION_LABELS_DEV;
                found.item.transition = tlabels[f.status] || "active";
                syncJSON();
                render();
              }
              toast("Copied: " + cmd);
            });
          });
        }

        const refCopyBtn = row.querySelector(".card-ref-copy");
        if (refCopyBtn) {
          refCopyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(refCopyBtn.dataset.copy).then(() => {
              toast("URL copied");
            });
          });
        }

        const outsourceBtn = row.querySelector(".row-outsource-btn");
        if (outsourceBtn) {
          outsourceBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const cmd = outsourceBtn.dataset.cmd;
            navigator.clipboard.writeText(cmd).then(() => {
              toast("Copied: " + cmd);
            });
          });
        }

        const convertSketchBtn = row.querySelector(".row-convert-btn");
        if (convertSketchBtn) {
          convertSketchBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const cmd = convertSketchBtn.dataset.cmd;
            navigator.clipboard.writeText(cmd).then(() => {
              toast("Copied: " + cmd);
            });
          });
        }

        const reviewBtn = row.querySelector(".row-review-btn");
        if (reviewBtn) {
          reviewBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const basePath = location.pathname
              .replace(/\/backlog\/?$/, "")
              .replace(/\/+$/, "");
            location.href =
              basePath +
              "/review/" +
              encodeURIComponent(reviewBtn.dataset.name);
          });
        }

        if (editBtn)
          editBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openEditModal(f.name);
          });
        if (deleteBtn)
          deleteBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openDeleteModal(f.name);
          });
        if (cancelBtn)
          cancelBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findItem(f.name);
            if (found) {
              found.item.status = "CANCELLED";
              syncJSON();
              render();
              toast(f.name + " archived");
            }
          });
        if (restoreBtn)
          restoreBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findItem(f.name);
            if (found) {
              found.item.status = "TODO";
              syncJSON();
              render();
              toast(f.name + " restored to TODO");
            }
          });

        const menuBtn = row.querySelector(".row-menu-btn");
        const menu = row.querySelector(".row-menu");
        if (menuBtn && menu) {
          menuBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            document
              .querySelectorAll(".row-menu:not([hidden])")
              .forEach((m) => m !== menu && (m.hidden = true));
            menu.hidden = !menu.hidden;
            menuBtn.setAttribute("aria-expanded", String(!menu.hidden));
          });
          menu.addEventListener("click", (e) => {
            e.stopPropagation();
            setTimeout(() => {
              menu.hidden = true;
              menuBtn.setAttribute("aria-expanded", "false");
            }, 0);
          });
        }

        summary.addEventListener("click", (e) => {
          if (copyBtn && (e.target === copyBtn || copyBtn.contains(e.target)))
            return;
          if (menuBtn && (e.target === menuBtn || menuBtn.contains(e.target)))
            return;
          if (menu && menu.contains(e.target)) return;
          if (f.status === "TODO" || f.status === "CANCELLED") return;
          toggleRowExpand(row, f.name);
        });

        return row;
      }

      // ─── Inline expand ───────────────────────────────────────────────
      const featureDetailCache = {};

      async function toggleRowExpand(rowEl, name) {
        const isExpanded = rowEl.classList.contains("expanded");

        document.querySelectorAll(".row.expanded").forEach((r) => {
          if (r !== rowEl) r.classList.remove("expanded");
        });

        if (isExpanded) {
          rowEl.classList.remove("expanded");
          setSingle("expandedRow", null);
          return;
        }

        const expandEl = rowEl.querySelector(".row-expand");

        if (!expandEl.dataset.loaded) {
          const found = findItem(name);
          if (!found) return;
          const f = found.item;

          let html = "";

          let detail = featureDetailCache[name];
          if (!detail) {
            const basePath = location.pathname
              .replace(/\/backlog\/?$/, "")
              .replace(/\/+$/, "");
            try {
              const res = await fetch(
                basePath + "/feature/" + encodeURIComponent(name),
              );
              if (res.ok) {
                detail = await res.json();
                featureDetailCache[name] = detail;
              }
            } catch {}
          }

          const status = f.status || "TODO";

          if (status === "TODO" || !detail) {
            if (f.dependencies && f.dependencies.length > 0) {
              html += `<div class="expand-section"><div class="expand-label">Dependencies</div><div class="expand-deps">${f.dependencies.map((d) => `<span class="expand-dep">${esc(d)}</span>`).join("")}</div></div>`;
            }
            if (f.source) {
              html += `<div class="expand-section"><div class="expand-label">Source</div><div class="expand-summary">${esc(f.source)}</div></div>`;
            }
            if (f.date) {
              html += `<div class="expand-section"><div class="expand-label">Date</div><div class="expand-summary">${esc(f.date)}</div></div>`;
            }
          } else if (status === "DEFINED") {
            if (f.dependencies && f.dependencies.length > 0) {
              html += `<div class="expand-section"><div class="expand-label">Dependencies</div><div class="expand-deps">${f.dependencies.map((d) => `<span class="expand-dep">${esc(d)}</span>`).join("")}</div></div>`;
            }
            const reqs = detail.requirements || [];
            if (reqs.length) {
              const hasStatus = reqs.some(
                (r) => r.status && r.status !== "pending",
              );
              html += `<div class="expand-section"><div class="bk-section-label">Requirements (${reqs.length})</div><div class="bk-reqs">`;
              reqs.forEach((r) => {
                const statusCls =
                  r.status === "PASS"
                    ? " bk-req-status--pass"
                    : r.status === "FAIL"
                      ? " bk-req-status--fail"
                      : "";
                html += `<div class="bk-req-row">
                  <span class="bk-req-id">${esc(r.id)}</span>
                  <span class="bk-req-desc">${esc(r.description)}</span>
                  ${r.category ? `<span class="bk-req-cat">${esc(r.category)}</span>` : ""}
                  ${hasStatus && r.status && r.status !== "pending" ? `<span class="bk-req-status${statusCls}">${esc(r.status.toUpperCase())}</span>` : ""}
                </div>`;
              });
              html += `</div></div>`;
            }
          } else if (status === "DOING") {
            const files = detail.files || [];
            if (files.length) {
              const icons = { create: "+", modify: "~", delete: "−" };
              const colors = {
                create: "var(--done)",
                modify: "var(--accent)",
                delete: "var(--danger)",
              };
              const basePath = location.pathname.replace(
                /\/(backlog|dashboard)\/?$/,
                "",
              );
              html += `<div class="expand-section"><div class="bk-section-label">Files (${files.length})</div><div class="bk-files">`;
              files.forEach((fFile) => {
                const openUrl =
                  basePath +
                  "/open/" +
                  encodeURIComponent(fFile.path).replace(/%2F/g, "/");
                html += `<div class="bk-file-row" data-path="${esc(fFile.path)}" role="button" tabindex="0" aria-expanded="false">
                  <span class="bk-file-action" style="color:${colors[fFile.action] || "var(--text-dim)"}">${icons[fFile.action] || "·"}</span>
                  <span class="bk-file-chevron">▸</span>
                  <span class="bk-file-path">${esc(fFile.path)}</span>
                  <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(fFile.path)} in VS Code">↗</button>
                </div>
                <div class="bk-file-diff" hidden></div>`;
              });
              html += `</div></div>`;
            }
          } else if (status === "DONE") {
            const doneFiles = detail.files || [];
            if (doneFiles.length) {
              const icons = { create: "+", modify: "~", delete: "−" };
              const colors = {
                create: "var(--done)",
                modify: "var(--accent)",
                delete: "var(--danger)",
              };
              const basePath = location.pathname.replace(/\/backlog\/?$/, "");
              html += `<div class="expand-section"><div class="bk-section-label">Files (${doneFiles.length})</div><div class="bk-files">`;
              doneFiles.forEach((fFile) => {
                const openUrl =
                  basePath +
                  "/open/" +
                  encodeURIComponent(fFile.path).replace(/%2F/g, "/");
                html += `<div class="bk-file-row" data-path="${esc(fFile.path)}" role="button" tabindex="0" aria-expanded="false">
                  <span class="bk-file-action" style="color:${colors[fFile.action] || "var(--text-dim)"}">${icons[fFile.action] || "·"}</span>
                  <span class="bk-file-chevron">▸</span>
                  <span class="bk-file-path">${esc(fFile.path)}</span>
                  <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(fFile.path)} in VS Code">↗</button>
                </div>
                <div class="bk-file-diff" hidden></div>`;
              });
              html += `</div></div>`;
            }
          }

          if (!html) {
            html =
              '<div class="empty">No details available — use ⋮ for actions</div>';
          }

          expandEl.innerHTML = html;
          expandEl.dataset.loaded = "1";
        }

        rowEl.classList.add("expanded");
        setSingle("expandedRow", name);
      }

      // ─── Sidebar active state ───────────────────────────────────────
      function updateSidebarActive() {
        const sidebar = document.getElementById("sidebar");
        if (!sidebar) return;
        const links = sidebar.querySelectorAll("a[data-status]");
        const sections = document.querySelectorAll("section.group[id]");

        let activeStatus = null;
        sections.forEach((s) => {
          const rect = s.getBoundingClientRect();
          if (rect.top <= 140) {
            activeStatus =
              s.dataset.status || s.id.replace("-section", "").toUpperCase();
          }
        });

        if (!activeStatus && sections.length) {
          activeStatus =
            sections[0].dataset.status ||
            sections[0].id.replace("-section", "").toUpperCase();
        }

        links.forEach((link) => {
          link.classList.toggle("active", link.dataset.status === activeStatus);
        });
      }

      window.addEventListener("scroll", updateSidebarActive, { passive: true });

      // ─── Modal: Add / Edit ──────────────────────────────────────────
      let editingName = null;
      let addToStatus = null;

      function openAddModal(status) {
        editingName = null;
        addToStatus = status;
        document.getElementById("modal-title").textContent = "Add card";
        document.getElementById("field-name").value = "";
        document.getElementById("field-desc").value = "";
        document.getElementById("field-type").value = "FEATURE";
        document.getElementById("field-phase").value = "P1";
        document.getElementById("field-dep").value = "";
        document.getElementById("field-name").disabled = false;
        document.getElementById("modal-save").textContent = "Add";
        document.getElementById("modal").classList.add("active");
        document.getElementById("field-name").focus();
      }

      function openEditModal(name) {
        const found = findItem(name);
        if (!found) return;
        editingName = name;
        addToStatus = null;
        document.getElementById("modal-title").textContent = "Edit card";
        document.getElementById("field-name").value = found.item.name;
        document.getElementById("field-desc").value =
          found.item.description || "";
        document.getElementById("field-type").value = found.item.type;
        document.getElementById("field-phase").value = found.item.phase || "P1";
        document.getElementById("field-dep").value = (
          found.item.dependencies || []
        ).join(", ");
        document.getElementById("field-name").disabled = false;
        document.getElementById("modal-save").textContent = "Save";
        document.getElementById("modal").classList.add("active");
        document.getElementById("field-name").focus();
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        editingName = null;
        addToStatus = null;
      }

      document.getElementById("modal-save").addEventListener("click", () => {
        const name = document.getElementById("field-name").value.trim();
        const desc = document.getElementById("field-desc").value.trim();
        const type = document.getElementById("field-type").value;
        const phase = document.getElementById("field-phase").value;
        const deps = document
          .getElementById("field-dep")
          .value.trim()
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        if (!name) return;

        if (editingName) {
          const found = findItem(editingName);
          if (!found) return;
          found.item.name = name;
          found.item.description = desc;
          found.item.type = type;
          found.item.phase = phase;
          found.item.dependencies = deps;
          toast(name + " updated");
        } else {
          data.features.push({
            name,
            type,
            status: addToStatus || "TODO",
            phase,
            description: desc,
            dependencies: deps,
          });
          toast(name + " added");
        }

        syncJSON();
        closeModal();
        render();
      });

      document.getElementById("modal").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
          e.preventDefault();
          document.getElementById("modal-save").click();
        }
        if (e.key === "Escape") closeModal();
      });

      // ─── Modal: Delete ──────────────────────────────────────────────
      let deletingName = null;

      function openDeleteModal(name) {
        deletingName = name;
        document.getElementById("delete-name").textContent = name;
        document.getElementById("delete-modal").classList.add("active");
      }

      function closeDeleteModal() {
        document.getElementById("delete-modal").classList.remove("active");
        deletingName = null;
      }

      document
        .getElementById("delete-confirm")
        .addEventListener("click", () => {
          if (!deletingName) return;
          const name = deletingName;
          removeItem(name);
          syncJSON();
          closeDeleteModal();
          render();
          toast(name + " deleted");
        });

      document
        .getElementById("delete-modal")
        .addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeDeleteModal();
          if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("delete-confirm").click();
          }
        });

      // ─── (detail modal removed) ──────────────────────────────────────

      // Close modals on overlay click
      ["modal", "delete-modal"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener("click", (e) => {
          if (e.target === el) {
            if (id === "modal") closeModal();
            else closeDeleteModal();
          }
        });
      });

      // ─── Init ───────────────────────────────────────────────────────
      let _sidebarResizeT;
      window.addEventListener("resize", () => {
        clearTimeout(_sidebarResizeT);
        _sidebarResizeT = setTimeout(updateSidebarVisibility, 150);
      });
      document.addEventListener("click", () => {
        document
          .querySelectorAll(".row-menu:not([hidden])")
          .forEach((m) => (m.hidden = true));
        document
          .querySelectorAll('.row-menu-btn[aria-expanded="true"]')
          .forEach((b) => b.setAttribute("aria-expanded", "false"));
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape")
          document
            .querySelectorAll(".row-menu:not([hidden])")
            .forEach((m) => (m.hidden = true));
      });
      document.addEventListener("click", (e) => {
        const openBtn = e.target.closest(".bk-file-open-btn");
        if (openBtn) {
          e.preventDefault();
          e.stopPropagation();
          openInVSCode(openBtn.dataset.openUrl, openBtn);
          return;
        }
        const row = e.target.closest(".bk-file-row");
        if (row) {
          e.preventDefault();
          toggleFileDiffRow(row);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          const row = document.activeElement?.closest?.(".bk-file-row");
          if (row && document.activeElement === row) {
            e.preventDefault();
            toggleFileDiffRow(row);
          }
        }
      });
      render();

      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        const sec = id ? document.getElementById(id) : null;
        if (sec && sec.classList.contains("collapsed")) {
          sec.classList.remove("collapsed");
          setCollapsed("section:" + id, false);
        }
      });
    </script>
    <button
      id="back-to-top"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
      title="Back to top"
    >
      ↑
    </button>
    <script>
      (function () {
        const btn = document.getElementById("back-to-top");
        window.addEventListener(
          "scroll",
          () => {
            btn.classList.toggle("visible", window.scrollY > 300);
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>

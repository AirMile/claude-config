<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Backlog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-backlog.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script src="/lib/pwa-register.js" defer></script>
    <script src="/lib/themes.js"></script>
    <script src="/lib/collapse-store.js"></script>
    <link rel="stylesheet" href="/css/backlog.css?v=13" />
    <link rel="stylesheet" href="/css/theme-picker.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    ></script>
  </head>
  <body>
    <script id="backlog-data" type="application/json">
      {
        "project": "Example Project",
        "generated": "2026-02-20",
        "updated": "2026-02-20",
        "source": "/thinking-concept",
        "overview": "Placeholder backlog shown when no real project data is loaded.",
        "features": [],
        "notes": ""
      }
    </script>

    <!-- Page structure -->
    <div class="layout">
      <main class="board-area">
        <nav class="top-nav">
          <div class="top-nav-left">
            <div class="section-chips" id="section-chips"></div>
            <div class="type-pills" id="type-pills"></div>
          </div>
          <div class="top-nav-center">
            <input
              class="top-nav-search"
              id="search-input"
              placeholder="Search..."
              oninput="render()"
            />
          </div>
          <div class="action-btns" id="action-btns"></div>
        </nav>
        <div id="board"></div>
      </main>
    </div>

    <!-- Modal: add/edit -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h3 id="modal-title">Add card</h3>

        <label for="field-name">Name</label>
        <input type="text" id="field-name" placeholder="feature-name" />

        <label for="field-desc">Description</label>
        <textarea id="field-desc" placeholder="Short description"></textarea>

        <div class="modal-row">
          <div>
            <label for="field-type">Type</label>
            <select id="field-type">
              <option value="FEATURE">FEATURE</option>
              <option value="API">API</option>
              <option value="INTEGRATION">INTEGRATION</option>
              <option value="UI">UI</option>
              <option value="REFACTOR">REFACTOR</option>
              <option value="PAGE">PAGE</option>
              <option value="COMPONENT">COMPONENT</option>
              <option value="THEME">THEME</option>
              <option value="A11Y">A11Y</option>
              <option value="PERF">PERF</option>
              <option value="PAGE-GAP">PAGE-GAP</option>
              <option value="BUG">BUG</option>
              <option value="CHANGE">CHANGE</option>
              <option value="SECURITY">SECURITY</option>
              <option value="TWEAK">TWEAK</option>
              <option value="VERIFY">VERIFY</option>
            </select>
          </div>
          <div>
            <label for="field-phase">Priority</label>
            <select id="field-phase">
              <option value="P1">P1</option>
              <option value="P2">P2</option>
              <option value="P3">P3</option>
              <option value="P4">P4</option>
            </select>
          </div>
        </div>

        <label for="field-dep">Dependencies (comma-separated, optional)</label>
        <input type="text" id="field-dep" placeholder="feature-a, feature-b" />

        <div class="modal-buttons">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" id="modal-save">Save</button>
        </div>
      </div>
    </div>

    <!-- Modal: delete confirm -->
    <div class="modal-overlay" id="delete-modal">
      <div class="modal">
        <h3>Delete card</h3>
        <p
          style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px"
        >
          Are you sure you want to delete
          <strong id="delete-name" style="color: var(--text)"></strong>?
        </p>
        <div class="modal-buttons">
          <button class="btn-cancel" onclick="closeDeleteModal()">
            Cancel
          </button>
          <button class="btn-danger" id="delete-confirm">Delete</button>
        </div>
      </div>
    </div>

    <!-- Detail drawer -->
    <div class="drawer-overlay" id="drawer-overlay">
      <aside
        class="detail-drawer"
        id="detail-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="drawer-title"
      >
        <header class="drawer-header">
          <div class="drawer-header-top">
            <span class="drawer-type-pill" id="drawer-type"></span>
            <span class="drawer-status-badge" id="drawer-status"></span>
            <button
              class="drawer-close-btn"
              id="drawer-close"
              aria-label="Close"
            >
              ✕
            </button>
          </div>
          <h2 class="drawer-title" id="drawer-title"></h2>
          <p class="drawer-summary" id="drawer-summary"></p>
        </header>
        <div class="drawer-actions" id="drawer-actions"></div>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
      // ─── State ──────────────────────────────────────────────────────
      const fileRaw = document.getElementById("backlog-data").textContent;
      let data = JSON.parse(fileRaw);
      if (!data.features) data.features = [];
      initCollapseStore("backlog", data.project);

      let _trackFilter = "ALL"; // "ALL" | "DESIGN" | "DEV"

      // team.mode is read-only here (gates the outsource + batch buttons below).
      // The solo/team toggle lives on the dashboard toolbar only.

      const STATUSES = ["TODO", "DEFINED", "DOING", "DONE"];
      const ARCHIVED_STATUSES = ["CANCELLED"];

      const STATUS_LABELS_DEV = {
        TODO: "To do",
        DEFINED: "To build",
        DOING: "To verify",
        DONE: "To refactor",
        CANCELLED: "Archived",
      };

      const TRANSITION_LABELS_DESIGN = {
        TODO: "designing",
        DEFINED: "converting",
        DOING: "contenting",
        DONE: "shipping",
      };
      const TRANSITION_LABELS_DEV = {
        TODO: "defining",
        DEFINED: "building",
        DOING: "verifying",
        DONE: "refactoring",
      };

      // Live skill signal (.project/session/active-*.json via /session API,
      // populated by the server patch backlog-session.js) → display label
      const LIVE_SKILL_LABELS = {
        define: "defining",
        plan: "planning",
        build: "building",
        verify: "verifying",
        test: "testing",
        debug: "debugging",
        refactor: "refactoring",
        ship: "shipping",
        design: "designing",
        content: "contenting",
        check: "checking",
      };
      function getLiveSignal(f) {
        return (window._activeSessions || {})[f.name] || null;
      }
      // Parked-checkpoint label (ship-*.json survives session death → the /session
      // API marks it {parked:true, pipeline, phase, status}). Maps to a human label.
      function parkedLabel(entry) {
        if (!entry) return "parked";
        var phase = entry.phase || "";
        if (entry.status === "failed") {
          return "failed at " + (phase || "an earlier phase");
        }
        if (phase.indexOf("plan gate") !== -1) return "plan approval pending";
        if (phase === "PHASE 3") {
          return entry.pipeline === "game"
            ? "playtest pending"
            : "manual tests pending";
        }
        if (phase === "PHASE 4" && entry.pipeline === "design") {
          return "review pending";
        }
        return "interrupted at " + (phase || "an earlier phase");
      }
      // In progress = queued (transition set by a copy action) OR a live
      // skill signal. These rows render in the dedicated IN PROGRESS section.
      function isInProgress(f) {
        return (
          !f.shipped &&
          f.status !== "CANCELLED" &&
          (!!f.transition || !!getLiveSignal(f))
        );
      }

      function isDesignTrackType(type) {
        return DESIGN_PIPELINE_TYPES.includes(type || "FEATURE");
      }
      const STATUS_COLORS = {
        TODO: "var(--todo)",
        DEFINED: "var(--defined)",
        DOING: "var(--doing)",
        DONE: "var(--done)",
        CANCELLED: "var(--text-dim)",
      };
      const PHASE_CLASSES = {
        P1: "phase-p1",
        P2: "phase-p2",
        P3: "phase-p3",
        P4: "phase-p4",
      };

      const PRIMARY_TYPE = {
        FEATURE: "FEATURE",
        PAGE: "FEATURE",
        COMPONENT: "FEATURE",
        INTEGRATION: "FEATURE",
        UI: "FEATURE",
        API: "FEATURE",
        THEME: "FEATURE",
        A11Y: "FEATURE",
        BUG: "BUG",
        CHANGE: "CHANGE",
        PERF: "CHANGE",
        REFACTOR: "REFACTOR",
        "PAGE-GAP": "GAP",
        SECURITY: "BUG",
        TWEAK: "TWEAK",
        VERIFY: "VERIFY",
      };

      const TYPE_ICONS = {
        FEATURE: { icon: "◆", cls: "type-feature" },
        BUG: { icon: "✕", cls: "type-bug" },
        CHANGE: { icon: "✎", cls: "type-change" },
        REFACTOR: { icon: "↻", cls: "type-refactor" },
        GAP: { icon: "□", cls: "type-gap" },
        TWEAK: { icon: "✦", cls: "type-tweak" },
        VERIFY: { icon: "◎", cls: "type-verify" },
      };

      const SUB_TYPE_LABELS = {
        PAGE: "page",
        COMPONENT: "component",
        INTEGRATION: "integration",
        UI: "ui",
        API: "api",
        THEME: "theme",
        A11Y: "a11y",
        PERF: "perf",
        "PAGE-GAP": "gap",
        SECURITY: "security",
      };

      const DESIGN_TYPES = [
        "PAGE",
        "COMPONENT",
        "THEME",
        "A11Y",
        "PERF",
        "PAGE-GAP",
      ];
      const DESIGN_PIPELINE_TYPES = ["PAGE", "COMPONENT"];
      const DESIGN_ONESHOT_TYPES = ["THEME", "A11Y", "PERF"];

      // ─── Helpers ────────────────────────────────────────────────────
      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str || "";
        return d.innerHTML;
      }

      function md(s) {
        if (!s) return "";
        try {
          return marked.parse(s);
        } catch {
          return esc(s);
        }
      }

      function findItem(name) {
        const item = data.features.find((f) => f.name === name);
        if (item) return { item, list: "features" };
        return null;
      }

      // A dependency stops blocking once its blocker is fully done — status
      // DONE *or* shipped. Components ship with shipped:true but never reach
      // DONE (they ship with their consuming page), so shipped must clear the
      // block too. Unknown deps (renamed/deleted) stay flagged.
      function isDepResolved(dep) {
        const found = findItem(dep);
        if (!found) return false;
        return found.item.shipped === true || found.item.status === "DONE";
      }

      function removeItem(name) {
        const fi = data.features.findIndex((f) => f.name === name);
        if (fi !== -1) data.features.splice(fi, 1);
      }

      function updateStatus(name, newStatus) {
        const found = findItem(name);
        if (!found) return;
        found.item.status = newStatus;
        delete found.item.stage;
        if (newStatus === "DONE") {
          found.item.date = new Date().toISOString().slice(0, 10);
        }
      }

      function syncJSON() {
        data.updated = new Date().toISOString().slice(0, 10);
        const persistable = data;
        const el = document.getElementById("backlog-data");
        el.textContent = "\n" + JSON.stringify(persistable, null, 2) + "\n";
        saveToDisk(persistable);
      }

      const SAVE_URL = (() => {
        const p = location.pathname.replace(/\/+$/, "");
        return p ? p + "/save" : "/save";
      })();

      let saveTimer = null;
      function saveToDisk(payload) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            const res = await fetch(SAVE_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload ?? data),
            });
            if (!res.ok) throw new Error("save failed");
          } catch {
            toast("Server not reachable — start: node serve-backlog.js");
          }
        }, 300);
      }

      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("visible");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("visible"), 2000);
      }

      function openInVSCode(url, el) {
        const orig = el.style.color;
        el.style.color = "var(--text-dim)";
        fetch(url, { method: "POST" })
          .then((r) => r.json())
          .then((d) => {
            if (d.ok) {
              el.style.color = "var(--done)";
              setTimeout(() => (el.style.color = orig), 1000);
            } else {
              el.style.color = "var(--danger)";
              toast("Error: " + (d.error || "unknown"));
              setTimeout(() => (el.style.color = orig), 2000);
            }
          })
          .catch(() => {
            el.style.color = "var(--danger)";
            toast("Could not reach VS Code");
            setTimeout(() => (el.style.color = orig), 2000);
          });
      }

      async function toggleFileDiffRow(row) {
        const panel = row.nextElementSibling?.classList.contains("bk-file-diff")
          ? row.nextElementSibling
          : row.closest(".fm-file")?.querySelector(".fm-file-diff");
        if (!panel) return;
        const open = row.getAttribute("aria-expanded") === "true";
        if (open) {
          panel.hidden = true;
          row.setAttribute("aria-expanded", "false");
          return;
        }
        row.setAttribute("aria-expanded", "true");
        panel.hidden = false;
        if (!panel.dataset.loaded) {
          panel.innerHTML = '<div class="bk-diff-loading">Loading…</div>';
          const basePath = location.pathname.replace(
            /\/(backlog|dashboard)\/?$/,
            "",
          );
          const url =
            basePath +
            "/diff/" +
            encodeURIComponent(row.dataset.path).replace(/%2F/g, "/");
          try {
            const r = await fetch(url);
            const d = await r.json();
            panel.innerHTML = renderDiff(d, row.dataset.path);
            panel.dataset.loaded = "1";
          } catch (e) {
            panel.innerHTML = `<div class="bk-diff-error">Could not load diff: ${esc(e.message)}</div>`;
          }
        }
      }

      function renderDiff(d, filePath = "") {
        if (!d.git)
          return '<div class="bk-diff-empty">No git repo — diff not available.</div>';
        if (!d.tracked && !d.working)
          return '<div class="bk-diff-empty">File not yet tracked by git.</div>';
        const hasWorking = !!d.working;
        const hasRecent = !!d.recent;
        const showLabels = hasWorking && hasRecent;
        const sections = [];
        if (hasWorking) {
          const label = showLabels
            ? '<div class="bk-diff-label">Uncommitted</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatDiff(d.working, filePath)}</div>`,
          );
        }
        if (hasRecent) {
          const label = showLabels
            ? '<div class="bk-diff-label">Recent commits</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatGitLog(d.recent, filePath)}</div>`,
          );
        }
        if (!sections.length)
          return '<div class="bk-diff-empty">No changes found.</div>';
        return sections.join("");
      }

      function formatDiff(text, filePath = "") {
        const ext = (filePath.split(".").pop() || "").toLowerCase();
        const langMap = {
          ts: "typescript",
          tsx: "typescript",
          js: "javascript",
          jsx: "javascript",
          css: "css",
          json: "json",
          html: "xml",
          md: "markdown",
          py: "python",
          rs: "rust",
          go: "go",
          sh: "bash",
        };
        const lang = langMap[ext] || null;
        function hl(s) {
          if (lang && typeof hljs !== "undefined") {
            try {
              return hljs.highlight(s, { language: lang }).value;
            } catch {}
          }
          return esc(s);
        }
        const SKIP = [
          "diff --git ",
          "index ",
          "new file mode",
          "deleted file mode",
          "similarity index",
          "rename from",
          "rename to",
          "Binary files",
          "--- ",
          "+++ ",
          "\\ No newline",
        ];
        const lines = text.split("\n");
        let oldLn = 0,
          newLn = 0;
        const rows = [];
        for (const line of lines) {
          if (SKIP.some((p) => line.startsWith(p))) continue;
          if (line.startsWith("@@")) {
            const m = line.match(
              /@@\s+-(\d+)(?:,\d+)?\s+\+(\d+)(?:,\d+)?\s+@@/,
            );
            if (m) {
              oldLn = parseInt(m[1], 10);
              newLn = parseInt(m[2], 10);
            }
            const ctx = line.replace(/^@@.*?@@\s*/, "").trim();
            rows.push(
              `<div class="bk-diff-hunk"><span class="bk-diff-gutter"></span><span class="bk-diff-text">${ctx ? "… " + esc(ctx) : "…"}</span></div>`,
            );
            continue;
          }
          let cls = "",
            l = "",
            r = "";
          if (line.startsWith("+")) {
            cls = "bk-diff-add";
            r = newLn++;
          } else if (line.startsWith("-")) {
            cls = "bk-diff-del";
            l = oldLn++;
          } else {
            l = oldLn++;
            r = newLn++;
          }
          const content = line.length ? line.slice(1) : "";
          rows.push(
            `<div class="bk-diff-row ${cls}"><span class="bk-diff-gutter">${l || ""}<span class="sep">·</span>${r || ""}</span><span class="bk-diff-text">${hl(content)}</span></div>`,
          );
        }
        return `<div class="bk-diff">${rows.join("")}</div>`;
      }

      function formatGitLog(text, filePath = "") {
        const lines = text.split("\n");
        const out = [];
        let buf = [];
        let currentHead = null;
        const flush = () => {
          if (!currentHead && !buf.length) return;
          const diffHtml = buf.length
            ? formatDiff(buf.join("\n"), filePath)
            : "";
          let headHtml = "";
          if (currentHead) {
            const [, subject, age] = currentHead;
            const m = subject.match(/^(\w+)[\s(]/);
            const phase = m ? m[1].toLowerCase() : "other";
            const p = ["build", "verify", "refactor"].includes(phase)
              ? phase
              : "other";
            headHtml = `<div class="bk-commit-head"><span class="bk-phase-badge bk-phase-badge--${p}">${esc(p)}</span><span class="bk-commit-subject">${esc(subject)}</span><span class="bk-commit-age">${esc(age || "")}</span></div>`;
          }
          out.push(`<div class="bk-commit-block">${headHtml}${diffHtml}</div>`);
          buf = [];
          currentHead = null;
        };
        for (const line of lines) {
          if (
            line.includes("\t") &&
            !line.startsWith(" ") &&
            !line.match(/^[+\-@]/)
          ) {
            flush();
            const parts = line.split("\t");
            currentHead = [parts[0] || "", parts[1] || "", parts[2] || ""];
          } else {
            buf.push(line);
          }
        }
        flush();
        return out.join("");
      }

      function getNextSkill(f) {
        const isGame = data.source && data.source.startsWith("/game");

        // PAGE-GAP en non-design → dev/game-pipeline. De ship-flow is het
        // enige resume-commando voor élke actieve status: /dev-ship (web) of
        // /game-ship (game) draait define→build→verify→refactor als één flow.
        // De granulaire skills (dev-build/verify/refactor + game-equivalenten)
        // bestaan niet meer — een DEFINED/DOING/DONE-kaart hervat via ship.
        if (!DESIGN_TYPES.includes(f.type) || f.type === "PAGE-GAP") {
          // TWEAK is de fast-path uitzondering: 1-3 bestanden, geen pipeline —
          // dus de eigen tweak-skill, niet de volledige ship-flow.
          if (f.type === "TWEAK") {
            if (["TODO", "DEFINED", "DOING", "DONE"].includes(f.status))
              return {
                cmd: isGame ? `/game-tweak ${f.name}` : `/dev-tweak ${f.name}`,
              };
            return null;
          }
          // VERIFY is een deferred manual re-test (geen code-wijziging): pickup
          // via de manual-round-skill, niet de ship-pipeline. Levenscyclus is
          // TODO→shipped. Argument is de parent-feature (canoniek), niet de
          // verify-{feature} kaartnaam.
          if (f.type === "VERIFY") {
            if (f.status === "TODO") {
              const feat = f.parentFeature || f.name.replace(/^verify-/, "");
              return {
                cmd: isGame ? `/game-ship ${feat}` : `/dev-manual ${feat}`,
              };
            }
            return null;
          }
          if (["TODO", "DEFINED", "DOING", "DONE"].includes(f.status))
            return {
              cmd: isGame ? `/game-ship ${f.name}` : `/dev-ship ${f.name}`,
            };
          return null;
        }

        // PAGE/COMPONENT mini-pipeline: design → convert → content → /design-ship (check)
        if (DESIGN_PIPELINE_TYPES.includes(f.type)) {
          if (f.status === "TODO")
            // Web PAGE/COMPONENT start met de ship-flow (build→content→check);
            // game-track heeft geen design-ship → design-convert.
            return {
              cmd: isGame
                ? `/design-convert ${f.name}`
                : `/design-ship ${f.name}`,
            };
          if (f.status === "DEFINED")
            return { cmd: `/design-convert ${f.name}` };
          if (f.status === "DOING") {
            // Show content-fill button when built but not yet content-filled
            if (f.stage === "built" && f.contentStatus !== "filled")
              return { cmd: `/design-content ${f.name}` };
            return null; // content done or pre-build — runtime audit runs inside /design-ship's check phase
          }
          return null; // DONE: no button
        }

        // One-shot: THEME/A11Y/PERF — TODO only
        if (f.status !== "TODO") return null;
        switch (f.type) {
          case "THEME":
            return { cmd: `/design-tokens` };
          case "A11Y":
            return { cmd: `/design-ship ${f.name}` };
          case "PERF":
            return { cmd: `/design-ship ${f.name}` };
        }
        return null;
      }

      // ─── Render ─────────────────────────────────────────────────────
      function render() {
        // Update page header
        const title = document.getElementById("page-title");
        const subtitle = document.getElementById("page-subtitle");
        if (title) title.textContent = data.project || "Backlog";
        if (subtitle) subtitle.textContent = data.overview || "";

        // Build board
        const board = document.getElementById("board");
        if (!board) return;
        board.innerHTML = "";

        const active = data.features.filter((f) => !f.shipped);
        const hasDesign = active.some((f) => isDesignTrackType(f.type));
        const hasDev = active.some((f) => !isDesignTrackType(f.type));
        const dualTrack = hasDesign && hasDev;

        // Build track filter pills
        const pillsContainer = document.getElementById("type-pills");
        if (pillsContainer) {
          if (dualTrack) {
            pillsContainer.innerHTML =
              `<button class="type-pill${_trackFilter === "ALL" ? " active" : ""}" onclick="_trackFilter='ALL';render()">All</button>` +
              `<button class="type-pill${_trackFilter === "DESIGN" ? " active" : ""}" onclick="_trackFilter='DESIGN';render()">Design</button>` +
              `<button class="type-pill${_trackFilter === "DEV" ? " active" : ""}" onclick="_trackFilter='DEV';render()">Dev</button>`;
          } else {
            pillsContainer.innerHTML = "";
          }
        }

        // Build action-btn toolbar
        const actionContainer = document.getElementById("action-btns");
        if (actionContainer) {
          let actionHtml = "";
          if ((data.features?.length || 0) === 0 && data.flags?.hasSeed) {
            actionHtml +=
              `<button class="action-btn action-plan" data-cmd="/project-plan" title="/project-plan">` +
              `<span class="action-icon">⊕</span><span class="action-label">Plan</span></button>`;
          }
          if (data.team?.mode === "team" && data.team?.tracker) {
            actionHtml +=
              `<button class="action-btn action-issues" data-cmd="/team-issues" title="/team-issues">` +
              `<span class="action-icon">↻</span><span class="action-label">Sync issues</span></button>`;
          }
          actionContainer.innerHTML = actionHtml;
          actionContainer.querySelectorAll(".action-btn").forEach((btn) => {
            btn.addEventListener("click", async (e) => {
              e.stopPropagation();
              const cmd = btn.dataset.cmd;
              await navigator.clipboard.writeText(cmd);
              const lbl = btn.querySelector(".action-label");
              const orig = lbl.textContent;
              lbl.textContent = "Copied";
              setTimeout(() => {
                lbl.textContent = orig;
              }, 1500);
              toast("Copied: " + cmd);
            });
          });
        }

        const searchTerm = (
          document.getElementById("search-input")?.value || ""
        ).toLowerCase();

        let chipsHtml = "";

        // ─── renderSection ────────────────────────────────────────────
        function renderSection({
          id,
          label,
          status,
          typeFilter,
          batchSkill,
          transitionLabels,
        }) {
          const effectiveTypeFilter = (type) => {
            if (_trackFilter === "DESIGN" && !isDesignTrackType(type))
              return false;
            if (_trackFilter === "DEV" && isDesignTrackType(type)) return false;
            return typeFilter(type);
          };

          let items = data.features.filter(
            (f) =>
              f.status === status &&
              !f.shipped &&
              !isInProgress(f) &&
              effectiveTypeFilter(f.type) &&
              (status === "TODO" || !DESIGN_ONESHOT_TYPES.includes(f.type)),
          );

          if (searchTerm) {
            items = items.filter(
              (f) =>
                f.name.toLowerCase().includes(searchTerm) ||
                (f.description || "").toLowerCase().includes(searchTerm),
            );
          }

          // Always render TO DO section (even empty) so the "+ add" button stays reachable.
          const isTodoSection = status === "TODO" && id === "todo";
          if (items.length === 0 && !isTodoSection) return;
          if (items.length === 0 && searchTerm) return;

          const sectionId = `${id}-section`;

          const section = document.createElement("section");
          section.className = "group";
          section.id = sectionId;
          section.dataset.status = status;

          const header = document.createElement("div");
          header.className = "group-header";
          header.dataset.status = status;

          let batchBtnHtml = "";
          if (batchSkill && items.length > 0 && data.team?.mode !== "team") {
            const isDesignSection = batchSkill === "check";
            const cmdPrefix = isDesignSection
              ? "design"
              : data.source && data.source.startsWith("/game")
                ? "game"
                : "dev";
            const cmd = `/${cmdPrefix}-${batchSkill}`;
            batchBtnHtml = `<button class="group-batch-btn" data-cmd="${cmd}" title="Copy ${cmd}" aria-label="Copy ${cmd}">
                  <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M5 11H3.5A1.5 1.5 0 012 9.5v-7A1.5 1.5 0 013.5 1h7A1.5 1.5 0 0112 2.5V5"/></svg>
                  <span>batch (${items.length})</span>
                 </button>`;
          }

          const addBtnHtml =
            status === "TODO"
              ? `<button class="group-add-btn" data-cmd="/project-todo" title="Copy /project-todo" aria-label="Add todo">
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
                 </button>`
              : "";

          header.innerHTML = `<h2>${esc(label)}</h2>${batchBtnHtml}${addBtnHtml}`;

          header.addEventListener("click", (e) => {
            const addBtn = e.target.closest(".group-add-btn");
            if (addBtn) {
              e.stopPropagation();
              const cmd = addBtn.dataset.cmd;
              navigator.clipboard.writeText(cmd).then(() => {
                toast(`Copied: ${cmd}`);
              });
              return;
            }
            const batchBtn = e.target.closest(".group-batch-btn");
            if (batchBtn) {
              e.stopPropagation();
              const cmd = batchBtn.dataset.cmd;
              navigator.clipboard.writeText(cmd).then(() => {
                const targets = data.features.filter(
                  (f) =>
                    f.status === status &&
                    !f.shipped &&
                    !f.refactor &&
                    effectiveTypeFilter(f.type),
                );
                targets.forEach((f) => {
                  f.transition = transitionLabels[status] || "active";
                });
                if (targets.length) {
                  syncJSON();
                  render();
                }
                toast(
                  `Copied: ${cmd}${targets.length ? ` — ${targets.length} marked` : ""}`,
                );
              });
              return;
            }
            section.classList.toggle("collapsed");
            setCollapsed(
              "section:" + section.id,
              section.classList.contains("collapsed"),
            );
          });

          section.appendChild(header);

          const body = document.createElement("div");
          body.className = "group-body";

          if (items.length === 0 && isTodoSection) {
            const emptyEl = document.createElement("div");
            emptyEl.style.cssText =
              "padding:12px 16px;font-size:13px;opacity:0.45;font-style:italic;";
            emptyEl.textContent = "No tasks yet — click + to add one.";
            body.appendChild(emptyEl);
          } else {
            const phaseOrder = ["P1", "P2", "P3", "P4", "—"];

            // A blocker always outranks the card(s) it blocks: it is bumped
            // into the highest-priority phase-bucket among its (transitive)
            // dependents, so it visually renders above them even cross-phase.
            // Stored f.phase is untouched — this only affects bucket display.
            const byName = new Map(items.map((f) => [f.name, f]));
            const blocks = new Map(); // dep name -> items this section blocks
            items.forEach((x) => {
              (x.dependencies || []).forEach((dep) => {
                if (!byName.has(dep)) return;
                if (!blocks.has(dep)) blocks.set(dep, []);
                blocks.get(dep).push(x);
              });
            });
            const effMemo = new Map();
            const effInProg = new Set();
            function effIdx(f) {
              if (effMemo.has(f.name)) return effMemo.get(f.name);
              if (effInProg.has(f.name))
                return phaseOrder.indexOf(f.phase || "—"); // cycle guard
              effInProg.add(f.name);
              let idx = phaseOrder.indexOf(f.phase || "—");
              (blocks.get(f.name) || []).forEach((dependent) => {
                idx = Math.min(idx, effIdx(dependent));
              });
              effInProg.delete(f.name);
              effMemo.set(f.name, idx);
              return idx;
            }

            const bucketIdxs = [...new Set(items.map(effIdx))].sort(
              (a, b) => a - b,
            );

            bucketIdxs.forEach((idx) => {
              const phase = phaseOrder[idx];
              const bucketItems = items.filter((f) => effIdx(f) === idx);
              const bucketByName = new Map(bucketItems.map((f) => [f.name, f]));

              // Stable topo-order within the bucket: a same-bucket blocker
              // renders before the card(s) it blocks.
              const ordered = [];
              const seen = new Set();
              function visit(f) {
                if (seen.has(f.name)) return;
                seen.add(f.name);
                (f.dependencies || []).forEach((dep) => {
                  const blocker = bucketByName.get(dep);
                  if (blocker) visit(blocker);
                });
                ordered.push(f);
              }
              bucketItems.forEach(visit);

              const phaseGroup = document.createElement("div");
              phaseGroup.className = "phase-group";
              phaseGroup.dataset.collapseKey = "phase:" + status + ":" + phase;
              phaseGroup.dataset.phase = phase;
              // Drag-to-reorder only applies to the To do section — other
              // sections compute their own order (progressRank, parked
              // timestamp, …) and would just fight a manual drop.
              if (status === "TODO") wirePhaseGroupDrop(phaseGroup);

              const phaseHeader = document.createElement("header");
              phaseHeader.className = "phase-header";
              phaseHeader.innerHTML = `<svg class="phase-chevron" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(phase)}`;
              phaseHeader.onclick = () => {
                phaseGroup.classList.toggle("phase-collapsed");
                setCollapsed(
                  phaseGroup.dataset.collapseKey,
                  phaseGroup.classList.contains("phase-collapsed"),
                );
              };
              phaseGroup.appendChild(phaseHeader);

              ordered.forEach((f) => {
                phaseGroup.appendChild(renderRow(f));
              });

              body.appendChild(phaseGroup);
            });
          } // end else (items.length > 0)

          section.appendChild(body);
          board.appendChild(section);

          chipsHtml += `<a href="#${sectionId}" class="sb-${status.toLowerCase()}" data-status="${status}">${esc(label)}</a>`;
        }

        // ─── Sections ─────────────────────────────────────────────────
        // Ship-only workflow: the intermediate resting columns (To build /
        // To verify / To refactor for dev, To convert / To check for design)
        // are gone — /dev-ship and /design-ship set transition: "shipping" and
        // keep the card in the IN PROGRESS section for the whole run, then ship
        // it (removed from board). Board flow: To do → In progress → shipped.
        const sections = [
          {
            id: "todo",
            label: "To do",
            status: "TODO",
            typeFilter: () => true,
            batchSkill: null,
            transitionLabels: TRANSITION_LABELS_DEV,
          },
        ];

        // ─── In progress section (queued copies + live skill signals) ──
        (function renderInProgressSection() {
          let items = data.features.filter(
            (f) =>
              isInProgress(f) &&
              (_trackFilter === "ALL" ||
                (_trackFilter === "DESIGN"
                  ? isDesignTrackType(f.type)
                  : !isDesignTrackType(f.type))),
          );
          if (searchTerm) {
            items = items.filter(
              (f) =>
                f.name.toLowerCase().includes(searchTerm) ||
                (f.description || "").toLowerCase().includes(searchTerm),
            );
          }
          if (items.length === 0) return;

          // Waiting-for-input rows first (most actionable), then parked
          // checkpoints, then live, then queued.
          const progressRank = (f) => {
            const l = getLiveSignal(f);
            if (!l) return 3;
            if (l.waiting) return 0;
            if (l.parked) return 1;
            return 2;
          };
          items.sort((a, b) => progressRank(a) - progressRank(b));

          const section = document.createElement("section");
          section.className = "group group--inprogress";
          section.id = "inprogress-section";

          const header = document.createElement("div");
          header.className = "group-header group-header--inprogress";
          header.innerHTML = `<h2>In progress</h2>`;
          header.addEventListener("click", () => {
            section.classList.toggle("collapsed");
            setCollapsed(
              "section:" + section.id,
              section.classList.contains("collapsed"),
            );
          });
          section.appendChild(header);

          const body = document.createElement("div");
          body.className = "group-body";
          items.forEach((f) => body.appendChild(renderRow(f)));
          section.appendChild(body);
          board.appendChild(section);

          chipsHtml += `<a href="#inprogress-section" class="sb-inprogress">In progress</a>`;
        })();

        sections.forEach(renderSection);

        // ─── Parked section (catch-all safety net) ────────────────────
        // Any active card that no other section claims: not shipped, not TODO
        // (that's "To do"), not CANCELLED (that's Archived), and not currently
        // In progress (no transition + no live signal). Reachable when a run
        // exits without shipping — e.g. a shipped COMPONENT left at DOING, a
        // failed /dev-ship (transition cleared, status still DEFINED/DOING/
        // DONE), or a cancelled-then-uncancelled card. Without this net those
        // rows would render nowhere. Copy button offers the resume command via
        // getNextSkill (ship flow), same affordance as a To do card.
        (function renderParkedSection() {
          let items = data.features.filter(
            (f) =>
              !f.shipped &&
              f.status !== "TODO" &&
              f.status !== "CANCELLED" &&
              !isInProgress(f) &&
              (_trackFilter === "ALL" ||
                (_trackFilter === "DESIGN"
                  ? isDesignTrackType(f.type)
                  : !isDesignTrackType(f.type))),
          );
          if (searchTerm) {
            items = items.filter(
              (f) =>
                f.name.toLowerCase().includes(searchTerm) ||
                (f.description || "").toLowerCase().includes(searchTerm),
            );
          }
          if (items.length === 0) return;

          const section = document.createElement("section");
          section.className = "group group--parked";
          section.id = "parked-section";

          const header = document.createElement("div");
          header.className = "group-header";
          header.innerHTML = `<h2>${esc("Parked")}</h2>`;
          header.addEventListener("click", () => {
            section.classList.toggle("collapsed");
            setCollapsed(
              "section:" + section.id,
              section.classList.contains("collapsed"),
            );
          });
          section.appendChild(header);

          const body = document.createElement("div");
          body.className = "group-body";
          items.forEach((f) => body.appendChild(renderRow(f)));
          section.appendChild(body);
          board.appendChild(section);

          chipsHtml += `<a href="#parked-section" class="sb-parked" data-status="PARKED">${esc("Parked")}</a>`;
        })();

        // Archived (CANCELLED) section — collapsed by default
        const cancelledItems = data.features.filter(
          (f) => f.status === "CANCELLED",
        );
        if (cancelledItems.length > 0) {
          const archSection = document.createElement("section");
          archSection.className = "group group--archived collapsed";
          archSection.id = "cancelled-section";

          const archHeader = document.createElement("div");
          archHeader.className = "group-header";
          archHeader.dataset.status = "CANCELLED";
          archHeader.innerHTML = `<h2>${esc("Archived")} (${cancelledItems.length})</h2>`;
          archHeader.addEventListener("click", () => {
            archSection.classList.toggle("collapsed");
            setCollapsed(
              "section:cancelled-section",
              archSection.classList.contains("collapsed"),
            );
          });
          archSection.appendChild(archHeader);

          const archBody = document.createElement("div");
          archBody.className = "group-body";
          cancelledItems.forEach((f) => {
            archBody.appendChild(renderRow(f));
          });
          archSection.appendChild(archBody);
          board.appendChild(archSection);

          chipsHtml += `<a href="#cancelled-section" class="sb-cancelled" data-status="CANCELLED" style="opacity:0.45;font-size:11px">${esc("Archived")} (${cancelledItems.length})</a>`;
        }

        // Build section chips
        const chips = document.getElementById("section-chips");
        if (chips) {
          chips.innerHTML = chipsHtml;
          chips.onclick = (e) => {
            const link = e.target.closest("a[data-status]");
            if (!link) return;
            const sectionId = link.getAttribute("href").slice(1);
            const sec = document.getElementById(sectionId);
            if (sec && sec.classList.contains("collapsed")) {
              sec.classList.remove("collapsed");
              setCollapsed("section:" + sectionId, false);
            }
          };
        }

        updateSidebarVisibility();
        updateSidebarActive();
        applyCollapseState();
      }

      function applyCollapseState() {
        // Status sections (default open, except cancelled which defaults closed)
        document.querySelectorAll("section.group[id]").forEach((sec) => {
          const defaultClosed = sec.id === "cancelled-section";
          sec.classList.toggle(
            "collapsed",
            isCollapsed("section:" + sec.id, defaultClosed),
          );
        });

        // Phase groups (default open)
        document
          .querySelectorAll("[data-collapse-key^='phase:']")
          .forEach((el) => {
            el.classList.toggle(
              "phase-collapsed",
              isCollapsed(el.dataset.collapseKey, false),
            );
          });

        // Detail drawer (single selection, persisted across renders). The
        // drawer lives outside #board so it isn't destroyed by the rebuild
        // above — re-populate it here so it never shows stale actions/status
        // after a local mutation or an SSE-driven backlog refresh, and close
        // it if the open feature disappeared (e.g. shipped, deleted).
        const expandedName = getSingle("expandedRow");
        if (expandedName) {
          if (findItem(expandedName)) {
            openDetailDrawer(expandedName);
          } else {
            closeDetailDrawer();
          }
        }
      }

      function updateSidebarVisibility() {
        const chips = document.getElementById("section-chips");
        if (!chips) return;
        chips.hidden = chips.querySelectorAll("a").length <= 1;
      }

      // ─── Row rendering ───────────────────────────────────────────────
      // A parked checkpoint is resumed by re-invoking its ship skill with the
      // feature name — carry that command on the copy button.
      const PARKED_SHIP_CMD = {
        dev: "/dev-ship",
        game: "/game-ship",
        design: "/design-ship",
      };

      // ─── Shared card action state (row + detail drawer) ────────────────
      // Computes everything the "primary action" button, progress label and
      // ⋯ menu need. Both renderRow() and openDetailDrawer() call this so
      // the row and the drawer always agree on what actions are available.
      function computeCardMeta(f) {
        if (f.shipped && f.transition) delete f.transition;

        const primaryType = PRIMARY_TYPE[f.type] || "FEATURE";
        const typeInfo = TYPE_ICONS[primaryType] || TYPE_ICONS.FEATURE;

        const live = getLiveSignal(f);
        const isParked = !!(live && live.parked);
        const isWaiting = !!(live && live.waiting);
        const isQueued = !!f.transition && !live;

        const next = getNextSkill(f);
        const copyCmd = next ? next.cmd : null;
        const copyTitle = copyCmd || f.name;

        // dev parked at PHASE 3/4 → the standalone manual-round skill is the preferred re-entry
        // (same resume, just the command that names what actually happens next); PHASE 0-2 has no
        // manual-round ledger yet, so it must stay /dev-ship.
        const devParkedCmd =
          live && (live.phase === "PHASE 3" || live.phase === "PHASE 4")
            ? "/dev-manual"
            : "/dev-ship";
        const parkedResumeCmd = isParked
          ? `${live.pipeline === "dev" ? devParkedCmd : PARKED_SHIP_CMD[live.pipeline] || "/dev-ship"} ${f.name}`
          : null;

        // parked → copy button carrying the resume command (one-click resume)
        // live → pulsing dot (skill is running, not cancellable from the board)
        // queued → cancel button (undo the copy) · idle → copy button
        const actionBtnHtml = isParked
          ? `<button class="row-copy-btn ${typeInfo.cls}" title="parked at ${esc(live.phase || "")} — copy to resume" data-cmd="${esc(parkedResumeCmd)}">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M5 11H3.5A1.5 1.5 0 012 9.5v-7A1.5 1.5 0 013.5 1h7A1.5 1.5 0 0112 2.5V5"/></svg>
             </button>`
          : live
            ? `<span class="row-live-dot" title="${isWaiting ? `waiting for input: ${esc(live.waiting)}` : `running: ${esc(live.skill || "")}`}"></span>`
            : isQueued
              ? `<button class="row-annuleer-btn" title="Cancel">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 2l12 12M14 2L2 14"/></svg>
             </button>`
              : `<button class="row-copy-btn ${typeInfo.cls}" title="${copyTitle}" data-cmd="${copyCmd || ""}">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M5 11H3.5A1.5 1.5 0 012 9.5v-7A1.5 1.5 0 013.5 1h7A1.5 1.5 0 0112 2.5V5"/></svg>
             </button>`;

        const progressLabelHtml = isParked
          ? `<span class="row-live-label">⏸ ${esc(parkedLabel(live))} · parked</span>`
          : live
            ? `<span class="row-live-label">${esc(LIVE_SKILL_LABELS[live.skill] || live.skill || "active")}${isWaiting ? " · input needed" : ""}</span>`
            : isQueued
              ? `<span class="row-transition-label row-transition-label--queued">⧉ ${esc(f.transition)} · queued</span>`
              : "";

        const menuItemsHtml = (() => {
          if (f.status === "TODO" || f.status === "DEFINED") {
            const canOutsource = !f.externalRef?.url && !f.github_issue;
            const outsourceItem = canOutsource
              ? `<button class="row-menu-item row-outsource-btn" data-cmd="/team-outsource ${esc(f.name)}">→ Outsource</button>`
              : "";
            const canConvert =
              f.status === "TODO" && DESIGN_PIPELINE_TYPES.includes(f.type);
            const convertItem = canConvert
              ? `<button class="row-menu-item row-convert-btn" data-cmd="/design-convert ${esc(f.name)}">⌅ Convert from sketch</button>`
              : "";
            const canReview = DESIGN_PIPELINE_TYPES.includes(f.type);
            const reviewItem = canReview
              ? `<button class="row-menu-item row-review-btn" data-name="${esc(f.name)}">▦ Bekijk design →</button>`
              : "";
            // Ship (dev-ship/design-ship) wordt al door de primaire copy-knop
            // van een TODO gekopieerd → geen apart menu-item nodig.
            return (
              `<button class="row-menu-item row-edit-btn">✎ Edit</button>` +
              reviewItem +
              outsourceItem +
              convertItem +
              `<button class="row-menu-item row-cancel-btn">○ Archive</button>` +
              `<button class="row-menu-item row-delete-btn row-menu-item--danger">✕ Delete</button>`
            );
          }
          if (f.status === "CANCELLED") {
            return (
              `<button class="row-menu-item row-restore-btn">↩ Restore</button>` +
              `<button class="row-menu-item row-delete-btn row-menu-item--danger">✕ Delete permanently</button>`
            );
          }
          return "";
        })();

        return {
          live,
          isParked,
          isWaiting,
          isQueued,
          copyCmd,
          copyTitle,
          parkedResumeCmd,
          actionBtnHtml,
          progressLabelHtml,
          menuItemsHtml,
        };
      }

      // Wires the shared action buttons (copy/cancel, ref-copy, outsource,
      // convert, review, edit, delete, archive, restore, and the ⋯ dropdown
      // when present) inside `container`. Used for both a row and the detail
      // drawer, since both render the identical button markup from `meta`.
      // Returns the elements the caller needs for its own click guards.
      function wireCardActions(container, f, meta) {
        const { live, isParked, isQueued } = meta;
        let copyBtn = null;

        if (isQueued) {
          const annuleerBtn = container.querySelector(".row-annuleer-btn");
          annuleerBtn?.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findItem(f.name);
            if (found) {
              delete found.item.transition;
              syncJSON();
              render();
            }
          });
        } else if (!live || isParked) {
          copyBtn = container.querySelector(".row-copy-btn");
          copyBtn?.addEventListener("click", (e) => {
            e.stopPropagation();
            const cmd = copyBtn.dataset.cmd;
            if (!cmd) return;
            navigator.clipboard.writeText(cmd).then(() => {
              // Een parked item wordt gedreven door het ship-checkpoint, niet
              // door transition — bij hervatten re-armt de skill zelf de
              // live-signal. Alleen kopiëren + toast, geen queue-mutatie.
              if (!isParked) {
                const found = findItem(f.name);
                if (found) {
                  // Ship-commando's (dev-ship/design-ship) doorlopen de hele
                  // pipeline → "shipping"; granulaire stappen → status-label.
                  const isShip =
                    cmd.startsWith("/dev-ship") ||
                    cmd.startsWith("/design-ship");
                  const isTweak =
                    cmd.startsWith("/dev-tweak") ||
                    cmd.startsWith("/game-tweak");
                  // VERIFY (dev-track) copies /dev-manual — game-track VERIFY
                  // copies /game-ship and is already covered by isShip above.
                  const isReverify = cmd.startsWith("/dev-manual");
                  const tlabels = isDesignTrackType(f.type)
                    ? TRANSITION_LABELS_DESIGN
                    : TRANSITION_LABELS_DEV;
                  found.item.transition = isShip
                    ? "shipping"
                    : isTweak
                      ? "tweaking"
                      : isReverify
                        ? "verifying"
                        : tlabels[f.status] || "active";
                  syncJSON();
                  render();
                }
              }
              toast("Copied: " + cmd);
            });
          });
        }

        const refCopyBtn = container.querySelector(".card-ref-copy");
        if (refCopyBtn) {
          refCopyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(refCopyBtn.dataset.copy).then(() => {
              toast("URL copied");
            });
          });
        }

        const outsourceBtn = container.querySelector(".row-outsource-btn");
        if (outsourceBtn) {
          outsourceBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const cmd = outsourceBtn.dataset.cmd;
            navigator.clipboard.writeText(cmd).then(() => {
              toast("Copied: " + cmd);
            });
          });
        }

        const convertSketchBtn = container.querySelector(".row-convert-btn");
        if (convertSketchBtn) {
          convertSketchBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const cmd = convertSketchBtn.dataset.cmd;
            navigator.clipboard.writeText(cmd).then(() => {
              toast("Copied: " + cmd);
            });
          });
        }

        const reviewBtn = container.querySelector(".row-review-btn");
        if (reviewBtn) {
          reviewBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const basePath = location.pathname
              .replace(/\/backlog\/?$/, "")
              .replace(/\/+$/, "");
            location.href =
              basePath +
              "/review/" +
              encodeURIComponent(reviewBtn.dataset.name);
          });
        }

        const editBtn = container.querySelector(".row-edit-btn");
        if (editBtn)
          editBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openEditModal(f.name);
          });
        const deleteBtn = container.querySelector(".row-delete-btn");
        if (deleteBtn)
          deleteBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openDeleteModal(f.name);
          });
        const cancelBtn = container.querySelector(".row-cancel-btn");
        if (cancelBtn)
          cancelBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findItem(f.name);
            if (found) {
              found.item.status = "CANCELLED";
              syncJSON();
              render();
              toast(f.name + " archived");
            }
          });
        const restoreBtn = container.querySelector(".row-restore-btn");
        if (restoreBtn)
          restoreBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findItem(f.name);
            if (found) {
              found.item.status = "TODO";
              syncJSON();
              render();
              toast(f.name + " restored to TODO");
            }
          });

        const menuBtn = container.querySelector(".row-menu-btn");
        const menu = container.querySelector(".row-menu");
        if (menuBtn && menu) {
          menuBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            document
              .querySelectorAll(".row-menu:not([hidden])")
              .forEach((m) => m !== menu && (m.hidden = true));
            menu.hidden = !menu.hidden;
            menuBtn.setAttribute("aria-expanded", String(!menu.hidden));
          });
          menu.addEventListener("click", (e) => {
            e.stopPropagation();
            setTimeout(() => {
              menu.hidden = true;
              menuBtn.setAttribute("aria-expanded", "false");
            }, 0);
          });
        }

        return { copyBtn, menuBtn, menu };
      }

      // ─── Drag-to-reorder (To do section only) ──────────────────────────
      // Reorders within a phase group, or moves a card to a different phase
      // (P1–P4). Never crosses a status section — that stays skill-driven.
      let _draggedName = null;

      function wireRowDrag(row, f) {
        if (f.status !== "TODO") return;
        row.addEventListener("dragstart", (e) => {
          _draggedName = f.name;
          row.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", f.name);
        });
        row.addEventListener("dragend", () => {
          row.classList.remove("dragging");
          document
            .querySelectorAll(".phase-group.drag-over")
            .forEach((el) => el.classList.remove("drag-over"));
          document
            .querySelectorAll(".drop-indicator")
            .forEach((el) => el.remove());
          _draggedName = null;
        });
      }

      // Finds the row whose vertical midpoint sits just below `y` — the drop
      // lands right before it. Returns null when `y` is below every row
      // (drop lands at the end of this phase group).
      function getDragAfterElement(container, y) {
        const rows = [...container.querySelectorAll(".row:not(.dragging)")];
        return rows.reduce(
          (closest, row) => {
            const box = row.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return { offset, element: row };
            }
            return closest;
          },
          { offset: Number.NEGATIVE_INFINITY, element: null },
        ).element;
      }

      function showDropIndicator(container, afterEl) {
        let indicator = container.querySelector(".drop-indicator");
        if (!indicator) {
          indicator = document.createElement("div");
          indicator.className = "drop-indicator";
        }
        if (afterEl) container.insertBefore(indicator, afterEl);
        else container.appendChild(indicator);
      }

      function wirePhaseGroupDrop(phaseGroup) {
        phaseGroup.addEventListener("dragover", (e) => {
          if (!_draggedName) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          phaseGroup.classList.add("drag-over");
          showDropIndicator(
            phaseGroup,
            getDragAfterElement(phaseGroup, e.clientY),
          );
        });
        phaseGroup.addEventListener("dragleave", (e) => {
          if (e.target === phaseGroup) phaseGroup.classList.remove("drag-over");
        });
        phaseGroup.addEventListener("drop", (e) => {
          e.preventDefault();
          phaseGroup.classList.remove("drag-over");
          const name = _draggedName;
          if (!name) return;
          const afterEl = getDragAfterElement(phaseGroup, e.clientY);
          reorderFeature(
            name,
            phaseGroup.dataset.phase,
            afterEl ? afterEl.dataset.name : null,
          );
        });
      }

      // Moves `name` to `targetPhase`, positioned right before `afterName`
      // (or at the end of the array — still the end of its phase's filtered
      // slice — when `afterName` is null).
      function reorderFeature(name, targetPhase, afterName) {
        const idx = data.features.findIndex((f) => f.name === name);
        if (idx === -1) return;
        const [item] = data.features.splice(idx, 1);
        if (targetPhase === "—") delete item.phase;
        else item.phase = targetPhase;

        let insertIdx = data.features.length;
        if (afterName) {
          const afterIdx = data.features.findIndex((f) => f.name === afterName);
          if (afterIdx !== -1) insertIdx = afterIdx;
        }
        data.features.splice(insertIdx, 0, item);
        syncJSON();
        render();
      }

      function renderRow(f) {
        const subLabel = SUB_TYPE_LABELS[f.type] || null;

        let metaHtml = "";
        const deps = f.dependencies || [];
        const unresolvedDeps = deps.filter((dep) => !isDepResolved(dep));
        const isBlocked = unresolvedDeps.length > 0;
        if (isBlocked) {
          metaHtml += `<span class="dep-blocked-label">blocked by</span>`;
          unresolvedDeps.forEach((dep) => {
            metaHtml += `<span class="dep-icon" title="Waiting for ${esc(dep)}">${esc(dep)}</span>`;
          });
        }
        const pendingGaps = Array.isArray(f.gaps)
          ? f.gaps.filter((g) => g.status === "pending").length
          : 0;
        if (pendingGaps > 0) {
          metaHtml += `<span class="gap-badge" title="${pendingGaps} unlinked handler${pendingGaps > 1 ? "s" : ""} — run /design-convert ${f.name} to link">⚠ ${pendingGaps} gap${pendingGaps > 1 ? "s" : ""}</span>`;
        }
        if (f.status === "DONE" && f.refactor) {
          if (f.refactor === "ROLLED_BACK") {
            metaHtml += `<span class="refactor-badge refactor-rollback">⚠ rolled back</span>`;
          } else {
            metaHtml += `<span class="refactor-badge refactor-done">✓ refactored</span>`;
          }
        }
        if (Array.isArray(f.knownIssues) && f.knownIssues.length) {
          const n = f.knownIssues.length;
          metaHtml += `<span class="known-issue-badge" title="${n} known issue${n > 1 ? "s" : ""} — expand for details">⚠ ${n} known issue${n > 1 ? "s" : ""}</span>`;
        }
        if (
          DESIGN_PIPELINE_TYPES.includes(f.type) &&
          f.stage === "built" &&
          f.contentStatus !== "filled"
        ) {
          metaHtml += `<span class="copy-badge" title="Copy not yet filled — run /design-content ${esc(f.name)}">copy: placeholder</span>`;
        }
        if (f.externalRef?.url) {
          const refType = f.externalRef.type || "github";
          const refId = f.externalRef.id || "?";
          const refLabel = refType === "github" ? `#${refId}` : refId;
          metaHtml +=
            `<a class="card-ref-link card-ref-${esc(refType)}" href="${esc(f.externalRef.url)}" target="_blank" rel="noopener" title="${esc(f.externalRef.url)}">${esc(refLabel)}</a>` +
            `<button class="card-ref-copy" data-copy="${esc(f.externalRef.url)}" title="Copy issue URL">⎘</button>`;
        } else if (f.github_issue) {
          const ghNum = f.github_issue.match(/\/(\d+)$/);
          metaHtml += `<a class="card-gh-link" href="${esc(f.github_issue)}" target="_blank" rel="noopener" title="${esc(f.github_issue)}">#${ghNum ? ghNum[1] : "?"}</a>`;
        }

        const meta = computeCardMeta(f);
        const { live, isParked, isWaiting, isQueued } = meta;

        const row = document.createElement("div");
        row.className =
          "row" +
          (isBlocked ? " row--blocked" : "") +
          (isQueued ? " row--active row--queued" : "") +
          (live ? " row--live" : "") +
          (isWaiting ? " row--waiting" : "") +
          (isParked ? " row--waiting row--parked" : "");
        row.dataset.name = f.name;
        // Draggable only in the To do section — see wireRowDrag().
        row.draggable = f.status === "TODO";

        const editDeleteHtml = meta.menuItemsHtml
          ? `<div class="row-menu-wrap">
               <button class="row-menu-btn" title="Actions" aria-haspopup="menu" aria-expanded="false">⋯</button>
               <div class="row-menu" role="menu" hidden>${meta.menuItemsHtml}</div>
             </div>`
          : "";

        row.innerHTML = `<div class="row-summary">
          ${meta.actionBtnHtml}
          <span class="row-name">${esc(f.name)}</span>
          ${meta.progressLabelHtml}
          ${subLabel ? `<span class="row-sub-tag">${subLabel}</span>` : ""}
          ${f.description ? `<span class="row-desc">${esc(f.description)}</span>` : ""}
          <div class="row-actions-group">
            <div class="row-meta">${metaHtml}</div>
            ${editDeleteHtml}
          </div>
        </div>`;

        const summary = row.querySelector(".row-summary");
        const { copyBtn, menuBtn, menu } = wireCardActions(row, f, meta);

        summary.addEventListener("click", (e) => {
          if (copyBtn && (e.target === copyBtn || copyBtn.contains(e.target)))
            return;
          if (menuBtn && (e.target === menuBtn || menuBtn.contains(e.target)))
            return;
          if (menu && menu.contains(e.target)) return;
          openDetailDrawer(f.name);
        });

        wireRowDrag(row, f);

        return row;
      }

      // ─── Detail drawer ──────────────────────────────────────────────
      const featureDetailCache = {};

      // Builds the status-specific detail body (known issues, deps,
      // requirements, files). Pure — no DOM access — so it can feed the
      // drawer body. `detail` is the /feature/:name payload (or null).
      function buildDetailBody(f, detail) {
        const status = f.status || "TODO";
        let html = "";

        if (Array.isArray(f.knownIssues) && f.knownIssues.length) {
          html += `<div class="expand-section"><div class="expand-label">Known issues</div><div class="known-issue-list">${f.knownIssues
            .map(
              (ki) =>
                `<div class="known-issue-row"><span class="known-issue-pill known-issue-pill--${esc(ki.verdict)}">${esc(ki.verdict)}</span><span class="known-issue-title">${esc(ki.title || ki.id)}</span>${ki.reason ? `<span class="known-issue-reason">${esc(ki.reason)}</span>` : ""}</div>`,
            )
            .join("")}</div></div>`;
        }

        if (status === "TODO" || !detail) {
          if (f.dependencies && f.dependencies.length > 0) {
            html += `<div class="expand-section"><div class="expand-label">Dependencies</div><div class="expand-deps">${f.dependencies.map((d) => `<span class="expand-dep">${esc(d)}</span>`).join("")}</div></div>`;
          }
          if (f.source) {
            html += `<div class="expand-section"><div class="expand-label">Source</div><div class="expand-summary">${esc(f.source)}</div></div>`;
          }
          if (f.date) {
            html += `<div class="expand-section"><div class="expand-label">Date</div><div class="expand-summary">${esc(f.date)}</div></div>`;
          }
        } else if (status === "DEFINED") {
          if (f.dependencies && f.dependencies.length > 0) {
            html += `<div class="expand-section"><div class="expand-label">Dependencies</div><div class="expand-deps">${f.dependencies.map((d) => `<span class="expand-dep">${esc(d)}</span>`).join("")}</div></div>`;
          }
          const reqs = detail.requirements || [];
          if (reqs.length) {
            const hasStatus = reqs.some(
              (r) => r.status && r.status !== "pending",
            );
            html += `<div class="expand-section"><div class="bk-section-label">Requirements (${reqs.length})</div><div class="bk-reqs">`;
            reqs.forEach((r) => {
              const statusCls =
                r.status === "PASS"
                  ? " bk-req-status--pass"
                  : r.status === "FAIL"
                    ? " bk-req-status--fail"
                    : "";
              html += `<div class="bk-req-row">
                  <span class="bk-req-id">${esc(r.id)}</span>
                  <span class="bk-req-desc">${esc(r.description)}</span>
                  ${r.category ? `<span class="bk-req-cat">${esc(r.category)}</span>` : ""}
                  ${hasStatus && r.status && r.status !== "pending" ? `<span class="bk-req-status${statusCls}">${esc(r.status.toUpperCase())}</span>` : ""}
                </div>`;
            });
            html += `</div></div>`;
          }
        } else if (status === "DOING") {
          const files = detail.files || [];
          if (files.length) {
            const icons = { create: "+", modify: "~", delete: "−" };
            const colors = {
              create: "var(--done)",
              modify: "var(--accent)",
              delete: "var(--danger)",
            };
            const basePath = location.pathname.replace(
              /\/(backlog|dashboard)\/?$/,
              "",
            );
            html += `<div class="expand-section"><div class="bk-section-label">Files (${files.length})</div><div class="bk-files">`;
            files.forEach((fFile) => {
              const openUrl =
                basePath +
                "/open/" +
                encodeURIComponent(fFile.path).replace(/%2F/g, "/");
              html += `<div class="bk-file-row" data-path="${esc(fFile.path)}" role="button" tabindex="0" aria-expanded="false">
                  <span class="bk-file-action" style="color:${colors[fFile.action] || "var(--text-dim)"}">${icons[fFile.action] || "·"}</span>
                  <span class="bk-file-chevron">▸</span>
                  <span class="bk-file-path">${esc(fFile.path)}</span>
                  <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(fFile.path)} in VS Code">↗</button>
                </div>
                <div class="bk-file-diff" hidden></div>`;
            });
            html += `</div></div>`;
          }
        } else if (status === "DONE") {
          const doneFiles = detail.files || [];
          if (doneFiles.length) {
            const icons = { create: "+", modify: "~", delete: "−" };
            const colors = {
              create: "var(--done)",
              modify: "var(--accent)",
              delete: "var(--danger)",
            };
            const basePath = location.pathname.replace(/\/backlog\/?$/, "");
            html += `<div class="expand-section"><div class="bk-section-label">Files (${doneFiles.length})</div><div class="bk-files">`;
            doneFiles.forEach((fFile) => {
              const openUrl =
                basePath +
                "/open/" +
                encodeURIComponent(fFile.path).replace(/%2F/g, "/");
              html += `<div class="bk-file-row" data-path="${esc(fFile.path)}" role="button" tabindex="0" aria-expanded="false">
                  <span class="bk-file-action" style="color:${colors[fFile.action] || "var(--text-dim)"}">${icons[fFile.action] || "·"}</span>
                  <span class="bk-file-chevron">▸</span>
                  <span class="bk-file-path">${esc(fFile.path)}</span>
                  <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(fFile.path)} in VS Code">↗</button>
                </div>
                <div class="bk-file-diff" hidden></div>`;
            });
            html += `</div></div>`;
          }
        }

        if (!html) {
          html =
            '<div class="empty">No details available — use the actions above.</div>';
        }
        return html;
      }

      let _openDrawerName = null;

      // Opens (or refreshes, if already open) the right-hand detail drawer
      // for `name`. render() calls this again on every re-render while the
      // drawer is open so it never shows stale actions/status after a local
      // mutation or an SSE-driven backlog refresh (see render()'s tail).
      async function openDetailDrawer(name) {
        const found = findItem(name);
        if (!found) return;
        const f = found.item;

        const overlay = document.getElementById("drawer-overlay");
        const bodyEl = document.getElementById("drawer-body");
        const actionsEl = document.getElementById("drawer-actions");
        const wasOpen =
          _openDrawerName === name && overlay.classList.contains("open");
        const scrollTop = wasOpen ? bodyEl.scrollTop : 0;

        const primaryType = PRIMARY_TYPE[f.type] || "FEATURE";
        const typeInfo = TYPE_ICONS[primaryType] || TYPE_ICONS.FEATURE;
        const subLabel = SUB_TYPE_LABELS[f.type] || primaryType.toLowerCase();
        document.getElementById("drawer-type").textContent =
          `${typeInfo.icon} ${subLabel}`;
        document.getElementById("drawer-type").className =
          `drawer-type-pill ${typeInfo.cls}`;
        document.getElementById("drawer-status").textContent =
          STATUS_LABELS_DEV[f.status] || f.status || "";
        document.getElementById("drawer-status").style.color =
          STATUS_COLORS[f.status] || "var(--text-dim)";
        document.getElementById("drawer-title").textContent = f.name;
        document.getElementById("drawer-summary").textContent =
          f.summary || f.description || "";

        const meta = computeCardMeta(f);
        actionsEl.innerHTML = `${meta.actionBtnHtml}${meta.menuItemsHtml}`;
        wireCardActions(actionsEl, f, meta);

        _openDrawerName = name;
        overlay.classList.add("open");
        setSingle("expandedRow", name);

        let detail = featureDetailCache[name];
        if (!detail) {
          bodyEl.innerHTML = '<div class="bk-diff-loading">Loading…</div>';
          const basePath = location.pathname
            .replace(/\/backlog\/?$/, "")
            .replace(/\/+$/, "");
          try {
            const res = await fetch(
              basePath + "/feature/" + encodeURIComponent(name),
            );
            if (res.ok) {
              detail = await res.json();
              featureDetailCache[name] = detail;
            }
          } catch {}
          // Bail if the drawer was closed or switched to another feature
          // while the fetch was in flight.
          if (_openDrawerName !== name) return;
        }

        bodyEl.innerHTML = buildDetailBody(f, detail);
        bodyEl.scrollTop = scrollTop;
      }

      function closeDetailDrawer() {
        document.getElementById("drawer-overlay").classList.remove("open");
        _openDrawerName = null;
        setSingle("expandedRow", null);
      }

      // ─── Sidebar active state ───────────────────────────────────────
      function updateSidebarActive() {
        const sidebar = document.getElementById("section-chips");
        if (!sidebar) return;
        const links = sidebar.querySelectorAll("a[data-status]");
        const sections = document.querySelectorAll("section.group[id]");

        let activeStatus = null;
        sections.forEach((s) => {
          const rect = s.getBoundingClientRect();
          if (rect.top <= 140) {
            activeStatus =
              s.dataset.status || s.id.replace("-section", "").toUpperCase();
          }
        });

        if (!activeStatus && sections.length) {
          activeStatus =
            sections[0].dataset.status ||
            sections[0].id.replace("-section", "").toUpperCase();
        }

        links.forEach((link) => {
          link.classList.toggle("active", link.dataset.status === activeStatus);
        });
      }

      window.addEventListener("scroll", updateSidebarActive, { passive: true });

      // ─── Modal: Add / Edit ──────────────────────────────────────────
      let editingName = null;
      let addToStatus = null;

      function openAddModal(status) {
        editingName = null;
        addToStatus = status;
        document.getElementById("modal-title").textContent = "Add card";
        document.getElementById("field-name").value = "";
        document.getElementById("field-desc").value = "";
        document.getElementById("field-type").value = "FEATURE";
        document.getElementById("field-phase").value = "P1";
        document.getElementById("field-dep").value = "";
        document.getElementById("field-name").disabled = false;
        document.getElementById("modal-save").textContent = "Add";
        document.getElementById("modal").classList.add("active");
        document.getElementById("field-name").focus();
      }

      function openEditModal(name) {
        const found = findItem(name);
        if (!found) return;
        editingName = name;
        addToStatus = null;
        document.getElementById("modal-title").textContent = "Edit card";
        document.getElementById("field-name").value = found.item.name;
        document.getElementById("field-desc").value =
          found.item.description || "";
        document.getElementById("field-type").value = found.item.type;
        document.getElementById("field-phase").value = found.item.phase || "P1";
        document.getElementById("field-dep").value = (
          found.item.dependencies || []
        ).join(", ");
        document.getElementById("field-name").disabled = false;
        document.getElementById("modal-save").textContent = "Save";
        document.getElementById("modal").classList.add("active");
        document.getElementById("field-name").focus();
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        editingName = null;
        addToStatus = null;
      }

      document.getElementById("modal-save").addEventListener("click", () => {
        const name = document.getElementById("field-name").value.trim();
        const desc = document.getElementById("field-desc").value.trim();
        const type = document.getElementById("field-type").value;
        const phase = document.getElementById("field-phase").value;
        const deps = document
          .getElementById("field-dep")
          .value.trim()
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        if (!name) return;

        if (editingName) {
          const found = findItem(editingName);
          if (!found) return;
          found.item.name = name;
          found.item.description = desc;
          found.item.type = type;
          found.item.phase = phase;
          found.item.dependencies = deps;
          toast(name + " updated");
        } else {
          data.features.push({
            name,
            type,
            status: addToStatus || "TODO",
            phase,
            description: desc,
            dependencies: deps,
          });
          toast(name + " added");
        }

        syncJSON();
        closeModal();
        render();
      });

      document.getElementById("modal").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
          e.preventDefault();
          document.getElementById("modal-save").click();
        }
        if (e.key === "Escape") closeModal();
      });

      // ─── Modal: Delete ──────────────────────────────────────────────
      let deletingName = null;

      function openDeleteModal(name) {
        deletingName = name;
        document.getElementById("delete-name").textContent = name;
        document.getElementById("delete-modal").classList.add("active");
      }

  <body>
    <script id="dashboard-data" type="application/json">
      {
        "seed": {
          "name": "Example Project",
          "content": "# Example Project\n\nA sample project to demonstrate the dashboard.\n\n## Core Concept\n\nThis is a demo of the project dashboard with all sections.\n\n## Target audience\n\nDevelopers and designers.\n\n## Scope\n\nIn scope: dashboard UI. Out of scope: production deployment."
        },
        "theme": {
          "colors": {
            "main": [
              { "token": "dark", "value": "#1a1a2e", "usage": "Primary text" },
              { "token": "light", "value": "#f5f5f7", "usage": "Background" },
              {
                "token": "surface",
                "value": "#16213e",
                "usage": "Card backgrounds"
              }
            ],
            "accent": [
              {
                "token": "accent-primary",
                "value": "#3B82F6",
                "usage": "CTAs and links"
              },
              {
                "token": "accent-secondary",
                "value": "#8B5CF6",
                "usage": "Secondary actions"
              }
            ],
            "semantic": [
              {
                "token": "success",
                "value": "#10B981",
                "usage": "Positive feedback"
              },
              { "token": "warning", "value": "#F59E0B", "usage": "Warnings" },
              { "token": "error", "value": "#EF4444", "usage": "Error states" }
            ]
          },

            "families": {

            "sizes": [

                "size": "0.875rem",

                "token": "text-lg",

            "base": "4px",
            "scale": [

              "value": "640px",

            },
            { "token": "screen-md", "value": "768px", "target": "Tablets" },
            { "token": "screen-lg", "value": "1024px", "target": "Desktop" }
          ],
          "borderRadius": [

              "value": "0.125rem",

            {
              "token": "rounded-md",

              "usage": "Buttons, inputs"

              "token": "shadow-sm",

            "light": ":root {\n  --bg: #ffffff;\n  --text: #1a1a2e;\n}",

          "motion": {
            "durations": [

              {

              },
              {
                "token": "duration-normal",

          "auth": "NextAuth.js",

        "features": [

            "name": "user-auth",

            "depends": [],

    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h3 id="modal-title">Edit</h3>
        <div id="modal-body"></div>
        <div class="modal-buttons">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button
            class="btn-danger"
            id="modal-delete"
            style="display: none"
            onclick="handleModalDelete()"
          >
            Delete
          </button>
          <button class="btn-save" id="modal-save" onclick="handleModalSave()">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Feature detail modal -->
    <div
      class="modal-overlay"
      id="feature-modal"
      onclick="if (event.target === this) closeFeatureModal();"
    >
      <div class="modal feature-modal-inner">
        <div class="feature-modal-header">
          <h3 id="feature-modal-title"></h3>
          <button
            class="modal-close"
            onclick="closeFeatureModal()"
            title="Close"
          >
            ✕
          </button>
        </div>
        <div id="feature-modal-body" class="feature-modal-body"></div>

    </div>

    <script>
      // ─── Markdown ─────────────────────────────────────────
      function slugify(text) {
        return text
          .toLowerCase()
          .replace(/<[^>]*>/g, "")
          .replace(/[^\w\s-]/g, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .trim();
      }

      const renderer = new marked.Renderer();
      renderer.heading = function ({ text, depth }) {
        const id = slugify(text);
        return `<h${depth} id="${id}">${text}</h${depth}>`;
      };

      marked.setOptions({ breaks: true, gfm: true, renderer });

      function md(text) {
        if (!text) return "";
        // Strip YAML frontmatter (---...---) before rendering
        const stripped = text.replace(/^---\n[\s\S]*?\n---\n?/, "");
        return marked.parse(stripped);
      }

      // ─── State ──────────────────────────────────────────────
      const raw = document.getElementById("dashboard-data").textContent;
      let data = JSON.parse(raw);
      initCollapseStore("dashboard", data.seed?.name || data.name);
      let modalContext = null;

      // Wire up project settings modal + team-mode toggle (lives in the
      // gear/prefs menu's #pn-mode-slot, part of the shared nav chrome from
      // lib/templates.js — not in the board toolbar). That nav markup is
      // emitted after this script in the document, so #pn-mode-slot doesn't
      // exist yet here — mount on DOMContentLoaded, same pattern themes.js
      // uses for #pn-theme-slot.
      if (window.SettingsModal) {
        const _projectDir =
          location.pathname.split("/").filter(Boolean)[0] || "";
        window.SettingsModal.configure({
          projectDir: _projectDir,
          getMode: () => (data.team && data.team.mode) || "solo",
          onSaved: (mode) => {
            if (!data.team) data.team = {};
            data.team.mode = mode;
            if (typeof render === "function") render();
          },
        });
        document.addEventListener("DOMContentLoaded", () => {
          const _modeSlot = document.getElementById("pn-mode-slot");
          if (_modeSlot) window.SettingsModal.mountToggle(_modeSlot);
        });
      }

      function getDashSearch() {
        return (document.getElementById("dash-search")?.value || "")
          .toLowerCase()
          .trim();
      }

      const TABS = [
        { id: "seed", label: "Seed" },
        { id: "features", label: "Features" },
        { id: "theme", label: "Design System" },
        { id: "stack", label: "Stack" },
        { id: "config", label: "CLAUDE.md" },
      ];

      const EMPTY = {
        seed: {
          name: "",
          content: "",
        },
        theme: {
          colors: { main: [], accent: [], semantic: [] },
          typography: {
            families: { heading: "", body: "", mono: "" },
            sizes: [],
          },
          spacing: { base: "", scale: [] },
          breakpoints: [],
          borderRadius: [],
          shadows: [],
          modes: {},
          cssVars: "",
        },
        stack: {
          framework: "",
          language: "",
          styling: "",
          db: "",
          auth: "",
          hosting: "",
          packages: [],
        },
      };

      // Ensure all sections exist
      for (const key of Object.keys(EMPTY)) {
        if (!data[key]) data[key] = JSON.parse(JSON.stringify(EMPTY[key]));
      }

      // ─── Helpers ────────────────────────────────────────────
      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str || "";
        return d.innerHTML;
      }

      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("visible");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("visible"), 2000);
      }

      function openInVSCode(url, el) {
        const orig = el.style.color;
        el.style.color = "var(--text-dim)";
        fetch(url, { method: "POST" })
          .then((r) => r.json())
          .then((d) => {
            if (d.ok) {
              el.style.color = "var(--done)";
              setTimeout(() => (el.style.color = orig), 1000);
            } else {
              el.style.color = "var(--danger)";
              toast("Error: " + (d.error || "unknown"));
              setTimeout(() => (el.style.color = orig), 2000);
            }
          })
          .catch(() => {
            el.style.color = "var(--danger)";
            toast("Could not reach VS Code");
            setTimeout(() => (el.style.color = orig), 2000);
          });
      }

      const SAVE_URL = (() => {
        const p = location.pathname.replace(/\/+$/, "");
        return p ? p + "/save" : "/save";
      })();

      let saveTimer = null;
      function syncJSON() {
        const el = document.getElementById("dashboard-data");
        el.textContent = "\n" + JSON.stringify(data, null, 2) + "\n";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            const res = await fetch(SAVE_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            if (!res.ok) throw new Error("save failed");
            toast("Saved");
          } catch {
            toast("Server not reachable");
          }
        }, 300);
      }

      // ─── Modal ──────────────────────────────────────────────
      // Anchor link navigation within modals (e.g. research TOC)
      document.getElementById("modal-body").addEventListener("click", (e) => {
        const a = e.target.closest("a[href^='#']");
        if (!a) return;
        e.preventDefault();
        const id = decodeURIComponent(a.getAttribute("href").slice(1));
        const target = document.getElementById(id);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      function openModal(title, bodyHtml, ctx) {
        modalContext = ctx;
        document.getElementById("modal-title").textContent = title;
        document.getElementById("modal-body").innerHTML = bodyHtml;
        document.getElementById("modal-delete").style.display =
          ctx && ctx.deletable ? "" : "none";
        const isReadOnly = ctx && ctx.readOnly;
        document.getElementById("modal-save").style.display = isReadOnly
          ? "none"
          : "";
        document.querySelector("#modal .btn-cancel").textContent = isReadOnly
          ? "Close"
          : "Cancel";
        document.getElementById("modal").classList.add("active");
        if (isReadOnly) {
          document.querySelector("#modal .modal").style.maxWidth = ctx.wide
            ? "800px"
            : "";
        } else {
          document.querySelector("#modal .modal").style.maxWidth = "";
        }
        const first = document.querySelector(
          "#modal-body input, #modal-body textarea, #modal-body select",
        );
        if (first) first.focus();
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        modalContext = null;
      }

      function handleModalSave() {
        if (modalContext && modalContext.onSave) {
          modalContext.onSave();
        }
        closeModal();
        syncJSON();
        render();
      }

      function handleModalDelete() {
        if (modalContext && modalContext.onDelete) {
          modalContext.onDelete();
        }
        closeModal();
        syncJSON();
        render();
      }

      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("modal")) closeModal();
      });

      document.getElementById("modal").addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
        if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
          e.preventDefault();
          handleModalSave();
        }
      });

      // ─── Section Renderers ──────────────────────────────────

      function renderSeed() {
        const c = data.seed;
        if (!c.name && !c.content) {
          return `
            <div class="section-header">
              <h2>Seed</h2>
              <button class="edit-btn edit-btn--accent" onclick="editSeed()">+ Add</button>
            </div>
            <div class="empty-state"><p>No seed defined yet.</p>
            <p style="color:var(--text-dim)">Run <code>/project-seed</code> to define it</p></div>`;
        }
        return `
          <div class="section-header">
            <h2>Seed</h2>
            <button class="header-icon-btn" onclick="editSeed()" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          </div>
          <div class="seed-content">${md(c.content)}</div>`;
      }

      // ─── Styleguide helpers ────────────────────────────────
      function parseModeVars(modeInput, t) {
        const primitives = {};
        const primSrc = typeof (t || {}).cssVars === "string" ? t.cssVars : "";
        for (const m of primSrc.matchAll(/(-{2}[\w-]+)\s*:\s*([^;}\n]+)/g)) {
          primitives[m[1].trim()] = m[2].trim();
        }
        const result = [];
        const pushPair = (token, value) => {
          const varRef = String(value).match(/^var\((--[\w-]+)\)$/);
          if (varRef && primitives[varRef[1]]) value = primitives[varRef[1]];
          result.push({ token, value });
        };
        if (
          modeInput &&
          typeof modeInput === "object" &&
          !Array.isArray(modeInput)
        ) {
          for (const [k, v] of Object.entries(modeInput)) {
            const token = k.startsWith("--") ? k : `--${k}`;
            pushPair(token, v);
          }
        } else if (typeof modeInput === "string") {
          for (const m of modeInput.matchAll(
            /(-{2}[\w-]+)\s*:\s*([^;}\n]+)/g,
          )) {
            pushPair(m[1].trim(), m[2].trim());
          }
        }
        return result;
      }

      function renderModeSwatches(vars, compact) {
        if (!vars.length)
          return '<p style="color:var(--text-dim);font-size:13px">No CSS variables defined in this mode.</p>';
        const NON_COLOR = new Set([
          "--radius",
          "--font-sans",
          "--font-mono",
          "--font-serif",
          "--font-heading",
        ]);
        const GROUPS = [
          { label: "Base", keys: ["--background", "--foreground"] },
          {
            label: "Surfaces",
            keys: [
              "--card",
              "--card-foreground",
              "--popover",
              "--popover-foreground",
            ],
          },
          {
            label: "Actions",
            keys: [
              "--primary",
              "--primary-foreground",
              "--secondary",
              "--secondary-foreground",
              "--accent",
              "--accent-foreground",
            ],
          },
          {
            label: "States",
            keys: [
              "--muted",
              "--muted-foreground",
              "--destructive",
              "--destructive-foreground",
            ],
          },
          { label: "Form", keys: ["--border", "--input", "--ring"] },
        ];
        const groups = compact ? GROUPS.slice(0, 2) : GROUPS;
        const varMap = new Map(vars.map((v) => [v.token, v]));
        const assigned = new Set();
        function swatch(v) {
          return `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(v.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(v.token)}</div><div class="sg-color-value">${esc(v.value)}</div></div></div>`;
        }
        let html = "";
        for (const g of groups) {
          const gv = g.keys.map((k) => varMap.get(k)).filter(Boolean);
          if (!gv.length) continue;
          gv.forEach((v) => assigned.add(v.token));
          html += `<div class="sg-mode-group"><div class="sg-mode-group-label">${g.label}</div><div class="sg-palette">${gv.map(swatch).join("")}</div></div>`;
        }
        if (!compact) {
          const rest = vars.filter(
            (v) => !assigned.has(v.token) && !NON_COLOR.has(v.token),
          );
          if (rest.length)
            html += `<div class="sg-mode-group"><div class="sg-mode-group-label">Other</div><div class="sg-palette">${rest.map(swatch).join("")}</div></div>`;
        }
        return (
          html ||
          '<p style="color:var(--text-dim);font-size:13px">No color variables defined in this mode.</p>'
        );
      }

      function renderSpringCurveSvg(spring) {
        const stiffness = spring.stiffness || 300;
        const damping = spring.damping || 25;
        const mass = spring.mass || 1;
        const W = 200,
          H = 56,
          dt = 0.016;
        let x = 0,
          v = 0;
        const pts = [0];
        for (let i = 0; i < 120; i++) {
          const f = -stiffness * (x - 1) - damping * v;
          v += (f / mass) * dt;
          x += v * dt;
          pts.push(x);
          if (i > 10 && Math.abs(x - 1) < 0.002 && Math.abs(v) < 0.002) break;
        }
        const n = pts.length;
        const minY = Math.min(0, ...pts);
        const maxY = Math.max(1, ...pts);
        const range = maxY - minY || 1;
        const tx = (i) => ((i / (n - 1)) * (W - 8) + 4).toFixed(1);
        const ty = (y) => (H - 4 - ((y - minY) / range) * (H - 8)).toFixed(1);
        let path = `M ${tx(0)} ${ty(pts[0])}`;
        for (let i = 1; i < n; i++) path += ` L ${tx(i)} ${ty(pts[i])}`;
        const tLine = ty(1);
        return `<svg class="sg-spring-curve" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><line x1="4" y1="${tLine}" x2="${W - 4}" y2="${tLine}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
      }

      function renderStyleguideFull(t) {
        const colors = t.colors || {};
        const typo = t.typography || {};
        const families = typo.families || {};
        const sizes = typo.sizes || [];
        const motion = t.motion || {};
        const durations = motion.durations || [];
        const easings = motion.easings || [];
        const springs = motion.spring || [];
        const axes = motion.axes || {};
        const choreography =
          motion.choreography &&
          typeof motion.choreography === "object" &&
          !Array.isArray(motion.choreography)
            ? motion.choreography
            : null;
        const modes = t.modes || {};
        const modeKeys = Object.keys(modes);
        const surfaces = t.surfaces || {};
        const glass = surfaces.glass || null;
        const elevation = surfaces.elevation || [];
        const shadows = t.shadows || [];
        const spacingScale = (t.spacing || {}).scale || [];
        const radii = t.borderRadius || [];
        const ixn = t.interactions || {};
        let html = "";

        // Page header — title, pack badge, mode toggle (product-styled, not dashboard chrome)
        const pack = motion.pack || "";
        const packLabels = {
          apple: "Apple",
          standard: "Standard",
          subtle: "Subtle",
          playful: "Playful",
        };
        const packLabel =
          packLabels[pack] ||
          (pack ? pack.charAt(0).toUpperCase() + pack.slice(1) : "");
        const packBadgeHtml = packLabel
          ? `<span class="sg-pack-badge sg-pack-badge--${esc(pack)}">${esc(packLabel)}</span>`
          : "";
        const modeToggleHtml =
          modeKeys.length > 1
            ? `<button id="sg-overlay-mode-btn" class="sg-page-mode-btn" onclick="toggleStyleguideMode(this)">Dark</button>`
            : "";
        html += `<header class="sg-page-header"><div class="sg-page-meta">${packBadgeHtml}${modeToggleHtml}</div></header>`;

        // Colors
        const hasColors =
          Object.values(colors).some((a) => a && a.length) || modeKeys.length;
        if (hasColors) {
          const brandHtml =
            colors.accent && colors.accent.length
              ? `<div class="sg-mode-group"><div class="sg-mode-group-label">Brand</div><div class="sg-palette">${colors.accent.map((c) => `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(c.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(c.token)}</div><div class="sg-color-value">${esc(c.value)}</div>${c.usage ? `<div class="sg-color-usage">${esc(c.usage)}</div>` : ""}</div></div>`).join("")}</div></div>`
              : "";
          const statusHtml =
            colors.semantic && colors.semantic.length
              ? `<div class="sg-mode-group"><div class="sg-mode-group-label">Status</div><div class="sg-palette">${colors.semantic.map((c) => `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(c.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(c.token)}</div><div class="sg-color-value">${esc(c.value)}</div>${c.usage ? `<div class="sg-color-usage">${esc(c.usage)}</div>` : ""}</div></div>`).join("")}</div></div>`
              : "";
          const modesHtml = modeKeys.length
            ? `<div class="sg-mode-panels">${modeKeys.map((k, i) => `<div class="sg-mode-panel${i === 0 ? " active" : ""}" data-mode-panel="${esc(k)}">${renderModeSwatches(parseModeVars(modes[k], t), false)}</div>`).join("")}</div>`
            : "";
          html += `<div class="sg-section" data-collapse-key="sg:Colors"><div class="sg-section-title">Colors</div>${modesHtml}${brandHtml}${statusHtml}</div>`;
        }

        // Typography
        const specimenEntries = [
          { label: "Heading", family: families.heading },
          { label: "Body", family: families.body },
          { label: "Mono", family: families.mono },
        ].filter((e) => e.family);
        if (specimenEntries.length || sizes.length) {
          const specHtml = specimenEntries.length
            ? `<div class="sg-font-specimens">${specimenEntries.map((e) => `<div class="sg-font-card"><div class="sg-font-specimen" style="font-family:${esc(e.family)}">Aa</div><div class="sg-font-name">${esc(e.label)}</div><div class="sg-font-family">${esc(e.family)}</div></div>`).join("")}</div>`
            : "";
          const rampHtml = sizes.length
            ? `<div class="sg-type-ramp">${sizes.map((s) => `<div class="sg-type-ramp-row"><div class="sg-type-ramp-meta"><div class="sg-type-ramp-token">${esc(s.token)}</div><div class="sg-type-ramp-size">${esc(s.size)}${s.lineHeight ? ` / ${esc(s.lineHeight)}` : ""}</div></div><div class="sg-type-ramp-preview" style="font-size:${esc(s.size)}${families.body ? `;font-family:${esc(families.body)}` : ""}">The quick brown fox</div></div>`).join("")}</div>`
            : "";
          html += `<div class="sg-section" data-collapse-key="sg:Typography"><div class="sg-section-title">Typography</div>${specHtml}${rampHtml}</div>`;
        }

        // Spacing
        if (spacingScale.length) {
          const maxPx =
            spacingScale.reduce(
              (m, s) => Math.max(m, parseInt(s.value) || 0),
              64,
            ) || 64;
          html += `<div class="sg-section" data-collapse-key="sg:Spacing"><div class="sg-section-title">Spacing</div><div class="sg-spacing-strip">${spacingScale
            .map((s) => {
              const px = parseInt(s.value) || 4;
              const h = Math.max(4, Math.round((px / maxPx) * 64));
              return `<div class="sg-spacing-block"><div class="sg-spacing-rect" style="height:${h}px"></div><div class="sg-spacing-tick">${esc(s.value)}</div></div>`;
            })
            .join("")}</div></div>`;
        }

        // Border Radius
        if (radii.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Border Radius"><div class="sg-section-title">Border Radius</div><div class="sg-radius-grid">${radii.map((r) => `<div class="sg-radius-item"><div class="sg-radius-box" style="border-radius:${esc(r.value)}"></div><div class="sg-radius-label">${esc(r.token)}<br>${esc(r.value)}</div></div>`).join("")}</div></div>`;
        }

        // Shadows
        if (shadows.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Shadows"><div class="sg-section-title">Shadows</div><div class="sg-shadow-list">${shadows.map((s) => `<div class="sg-shadow-row"><span class="sg-shadow-token">${esc(s.token)}</span><div class="sg-shadow-preview" style="box-shadow:${esc(s.value)}"></div><span class="sg-shadow-meta">${esc(s.value)}</span></div>`).join("")}</div></div>`;
        }

        // Elevation
        if (elevation.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Elevation"><div class="sg-section-title">Elevation</div><div class="sg-elevation-grid">${elevation.map((e) => `<div class="sg-elevation-card" style="box-shadow:${esc(e.shadow || e.value || "")}"><div class="sg-elevation-label">${esc(e.token || e.level || "")}</div>${e.usage ? `<div class="sg-elevation-usage">${esc(e.usage)}</div>` : ""}</div>`).join("")}</div></div>`;
        }

        // Glass Surface
        if (glass && glass.enabled) {
          const blurVal = glass.blur || "16px";
          const satVal = glass.saturation || "180%";
          const tintVal = glass.tint || "rgba(255,255,255,0.08)";
          const borderVal = glass.border || "rgba(255,255,255,0.15)";
          html += `<div class="sg-section" data-collapse-key="sg:Glass Surface"><div class="sg-section-title">Glass Surface</div><div class="sg-glass-card"><div class="sg-glass-bg"></div><div class="sg-glass-layer" style="background:${esc(tintVal)};backdrop-filter:blur(${esc(blurVal)}) saturate(${esc(satVal)});-webkit-backdrop-filter:blur(${esc(blurVal)}) saturate(${esc(satVal)});border-color:${esc(borderVal)}"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Glass surface</div><div class="sg-glass-meta"><span>blur: ${esc(blurVal)}</span><span>saturation: ${esc(satVal)}</span><span>tint: ${esc(tintVal)}</span>${glass.vibrancy ? `<span>vibrancy: ${esc(glass.vibrancy)}</span>` : ""}</div></div></div></div>`;
        }

        // Motion
        const hasMotion =
          durations.length ||
          easings.length ||
          springs.length ||
          choreography ||
          Object.keys(axes).length;
        if (hasMotion) {
          const pack = motion.pack || "";
          const packLabels = {
            apple: "Apple",
            standard: "Standard",
            subtle: "Subtle",
            playful: "Playful",
          };
          const packLabel =
            packLabels[pack] ||
            (pack ? pack.charAt(0).toUpperCase() + pack.slice(1) : "");
          const packBadge = packLabel
            ? ` <span class="sg-pack-badge sg-pack-badge--${esc(pack)}" style="margin-left:6px">${esc(packLabel)}</span>`
            : "";

          const axesHtml = Object.keys(axes).length
            ? `<div class="sg-axes-row">${Object.entries(axes)
                .map(([k, v]) => {
                  const pct =
                    typeof v === "number"
                      ? Math.round(v * 100)
                      : parseInt(v) || 50;
                  return `<div class="sg-axis-item"><div class="sg-axis-label">${esc(k)}</div><div class="sg-axis-track"><div class="sg-axis-fill" style="width:${pct}%"></div></div><div class="sg-axis-value">${pct}%</div></div>`;
                })
                .join("")}</div>`
            : "";

          const maxMs =
            durations.reduce(
              (m, d) => Math.max(m, parseInt(d.value) || 0),
              500,
            ) || 500;
          const durHtml = durations.length
            ? `<div class="sg-motion-sub">Durations</div><div class="sg-spacing-scale" style="margin-bottom:16px">${durations.map((d) => `<div class="sg-spacing-row"><div class="sg-spacing-label">${esc(d.token)}</div><div class="sg-duration-bar" style="width:${Math.round(((parseInt(d.value) || 0) / maxMs) * 100)}%"></div><div class="sg-spacing-value">${esc(d.value)}${d.usage ? ` — ${esc(d.usage)}` : ""}</div></div>`).join("")}</div><div class="sg-motion-sub">Live demos — click to play</div><div class="sg-anim-demo-grid">${durations.map((d) => `<div class="sg-anim-demo-card" data-dur="${esc(d.value)}" data-ease=""><div class="sg-anim-demo-box"></div><div class="sg-anim-demo-label">${esc(d.token)}<br>${esc(d.value)}</div></div>`).join("")}</div>`
            : "";

          const easHtml = easings.length
            ? `<div class="sg-motion-sub" style="margin-top:16px">Easings</div><div class="sg-easing-list" style="margin-bottom:14px">${easings.map((e) => `<div class="sg-easing-row"><span class="sg-easing-token">${esc(e.token)}</span><span class="sg-easing-value">${esc(e.value)}${e.usage ? ` <span class="sg-easing-usage">— ${esc(e.usage)}</span>` : ""}</span></div>`).join("")}</div><div class="sg-motion-sub">Easing demos — click to play</div><div class="sg-anim-demo-grid">${easings.map((e) => `<div class="sg-anim-demo-card" data-dur="" data-ease="${esc(e.value)}"><div class="sg-anim-demo-box"></div><div class="sg-anim-demo-label">${esc(e.token)}</div></div>`).join("")}</div>`
            : "";

          const springHtml = springs.length
            ? `<div class="sg-motion-sub" style="margin-top:16px">Springs</div><div class="sg-spring-grid">${springs.map((s) => `<div class="sg-spring-card"><div class="sg-spring-label">${esc(s.token)}</div><div class="sg-spring-meta">stiffness: ${esc(String(s.stiffness || ""))} · damping: ${esc(String(s.damping || ""))} · mass: ${esc(String(s.mass || ""))}</div>${renderSpringCurveSvg(s)}</div>`).join("")}</div>`
            : "";

          const choreoHtml =
            choreography && Object.keys(choreography).length
              ? `<div class="sg-motion-sub" style="margin-top:16px">Choreography</div><div class="sg-choreo-grid">${Object.entries(
                  choreography,
                )
                  .map(
                    ([k, v]) =>
                      `<div class="sg-choreo-row"><span class="sg-choreo-key">${esc(k)}</span><span class="sg-choreo-value">${esc(typeof v === "string" ? v : JSON.stringify(v))}</span></div>`,
                  )
                  .join("")}</div>`
              : "";

          html += `<div class="sg-section" data-collapse-key="sg:Motion"><div class="sg-section-title">Motion${packBadge}</div>${axesHtml}${durHtml}${easHtml}${springHtml}${choreoHtml}</div>`;
        }

        // Interactions
        const ixnEntries = [
          ixn.focusRing && {
            label: "Focus Ring",
            parts: [
              ixn.focusRing.width && `width: ${ixn.focusRing.width}`,
              ixn.focusRing.style && `style: ${ixn.focusRing.style}`,
              ixn.focusRing.offset && `offset: ${ixn.focusRing.offset}`,
              ixn.focusRing.color && `color: ${ixn.focusRing.color}`,
            ].filter(Boolean),
          },
          ixn.hover && {
            label: "Hover",
            parts: [
              ixn.hover.transition && `transition: ${ixn.hover.transition}`,
              ixn.hover.transform &&
                ixn.hover.transform !== "none" &&
                `transform: ${ixn.hover.transform}`,
            ].filter(Boolean),
          },
          ixn.active && {
            label: "Active",
            parts: [
              ixn.active.transform && `transform: ${ixn.active.transform}`,
            ].filter(Boolean),
          },
        ].filter((e) => e && e.parts && e.parts.length);
        if (ixnEntries.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Interactions"><div class="sg-section-title">Interactions</div><div class="sg-interaction-list">${ixnEntries.map((e) => `<div class="sg-interaction-row"><span class="sg-interaction-label">${esc(e.label)}</span><span class="sg-interaction-value">${e.parts.map((p) => `<code>${esc(p)}</code>`).join("")}</span></div>`).join("")}</div></div>`;
        }

        return (
          html ||
          '<p style="color:var(--text-dim)">No design system data available.</p>'
        );
      }

      function buildAliasCss(t) {
        const typo = (t.typography || {}).families || {};
        const radii = t.borderRadius || [];
        const baseRadius =
          radii.find((r) => /md|base|default/i.test(r.token))?.value ||
          radii[1]?.value ||
          radii[0]?.value;
        return `#sg-inline {
  --bg: var(--background, #0d1117);
  --surface: var(--card, #161b22);
  --surface-hover: var(--secondary, #1c2333);
  --text: var(--foreground, #e6edf3);
  --text-muted: var(--muted-foreground, #8b949e);
  --text-dim: var(--muted-foreground, #6e7681);
  --border: var(--border, #30363d);
  --accent: var(--primary, #58a6ff);
  --danger: var(--destructive, #f85149);
  ${typo.heading ? `--font-heading: ${typo.heading};` : ""}
  ${typo.body ? `--font-body: ${typo.body};` : ""}
  ${typo.mono ? `--font-mono: ${typo.mono};` : ""}
  ${baseRadius ? `--radius-product: ${baseRadius};` : ""}
  font-family: ${typo.body ? `${typo.body}, ` : ""}inherit;
  color: var(--text);
  background: var(--bg);
}`;
      }

      let sgMode = getSingle("sgMode") === "dark" ? "dark" : null; // null = default (base tokens + light-override), "dark" = dark mode

      function applyStyleguideTokens() {
        const t = data.theme;
        const scopeEl = document.getElementById("sg-tokens-scope");
        const inner = document.getElementById("sg-inline");
        if (!scopeEl) return;
        if (!inner) {
          scopeEl.textContent = "";
          return;
        }

        const mode = sgMode === "dark" ? "dark" : "light";
        const scoped = (s) =>
          (typeof s === "string" ? s : "")
            .replace(/:root\s*\{/g, "#sg-inline {")
            .replace(/\.dark\s*\{/g, '#sg-inline[data-mode="dark"] {');

        scopeEl.textContent =
          scoped(t.cssVars) +
          "\n" +
          scoped((t.modes || {})[mode] || "") +
          "\n" +
          buildAliasCss(t);

        if (sgMode === "dark") inner.dataset.mode = "dark";
        else inner.removeAttribute("data-mode");

        const modeBtn = document.getElementById("sg-overlay-mode-btn");
        if (modeBtn) {
          modeBtn.textContent = sgMode === "dark" ? "Light" : "Dark";
          modeBtn.classList.toggle("active-mode", sgMode === "dark");
        }
        inner.querySelectorAll(".sg-mode-panel").forEach((p) => {
          p.classList.toggle("active", p.dataset.modePanel === mode);
        });
      }

      function toggleStyleguideMode() {
        sgMode = sgMode === "dark" ? null : "dark";
        setSingle("sgMode", sgMode);
        applyStyleguideTokens();
      }

      function runAnimDemo(card, duration, easing) {
        const box = card.querySelector(".sg-anim-demo-box");
        if (!box) return;
        const dur = duration || "300ms";
        const ease = easing || "ease";
        box.style.transition = "none";
        box.style.transform = "translateX(0) scale(1)";
        box.style.opacity = "0.6";
        void box.offsetHeight;
        box.style.transition = `transform ${dur} ${ease}, opacity ${dur} ${ease}`;
        box.style.transform = "translateX(28px) scale(0.85)";
        box.style.opacity = "1";
        const ms = parseInt(dur) || 300;
        setTimeout(() => {
          box.style.transform = "translateX(0) scale(1)";
          box.style.opacity = "0.6";
        }, ms + 60);
      }

      function renderTheme() {
        const t = data.theme;
        const colors = t.colors || {};
        const families = (t.typography || {}).families || {};
        const hasColors = Object.values(colors).some(
          (arr) => arr && arr.length,
        );
        const hasModes = Object.keys(t.modes || {}).length > 0;
        const hasData =
          hasColors || hasModes || families.heading || families.body;
        if (!hasData) {
          return `
            <div class="section-header"><h2>Design System</h2></div>
            <div class="empty-state"><p>No design tokens defined yet.</p>
            <p style="color:var(--text-dim)">Design tokens, modes, CSS variables — managed via <code>/design-tokens</code></p></div>`;
        }
        return `<div class="section-header"><h2>Design System</h2></div><div class="sg-inline" id="sg-inline">${renderStyleguideFull(t)}</div>`;
      }

      function renderStack() {
        const s = data.stack;
        const hasData = s.framework || s.language;
        if (!hasData) {
          return `
            <div class="section-header">
              <h2>Stack</h2>
            </div>
            <div class="empty-state"><p>No stack defined yet.</p>
            <p style="color:var(--text-dim)">Automatically filled by <code>/project-plan</code></p></div>`;
        }
        const fields = [
          ["Framework", s.framework],
          ["Language", s.language],
          ["Styling", s.styling],
          ["Database", s.db],
          ["Auth", s.auth],
          ["Hosting", s.hosting],
        ].filter(([, v]) => v);

        const cards = fields
          .map(
            ([label, value]) => `
            <div class="stat-card">
              <div class="stat-label">${esc(label)}</div>
              <div class="stat-value">${esc(value)}</div>
            </div>`,
          )
          .join("");

        const pkgs = (s.packages || [])
          .map((p) => {
            if (typeof p === "string") {
              const lastAt = p.lastIndexOf("@");
              const name = lastAt > 0 ? p.slice(0, lastAt) : p;
              const version = lastAt > 0 ? p.slice(lastAt + 1) : "";
              p = { name, version, purpose: "" };
            }
            return `
            <tr>
              <td style="font-weight:500;color:var(--text)">${esc(p.name)}</td>
              <td style="font-family:monospace">${esc(p.version)}</td>
              <td>${esc(p.purpose)}</td>
            </tr>`;
          })
          .join("");

        return `
          <div class="section-header">
            <h2>Stack</h2>
            <button class="header-icon-btn" onclick="showResearch()" title="Research"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
          </div>
          <div class="grid-3">${cards}</div>
          ${
            s.packages && s.packages.length
              ? `
            <div class="sub-heading">Packages</div>
            <table class="data-table">
              <thead><tr><th>Name</th><th>Version</th><th>Purpose</th></tr></thead>
              <tbody>${pkgs}</tbody>
            </table>`
              : ""
          }`;
      }

      // ─── Edit Modals ───────────────────────────────────────

      function editSeed() {
        const c = data.seed;
        openModal(
          "Edit seed",
          `
          <label>Name</label>
          <input type="text" id="f-name" value="${esc(c.name)}" />
          <label>Seed (Markdown)</label>
          <textarea id="f-content" rows="20" style="font-family:var(--font-mono);font-size:12px;line-height:1.5">${esc(c.content)}</textarea>
        `,
          {
            onSave() {
              data.seed.name = document.getElementById("f-name").value.trim();
              data.seed.content = document.getElementById("f-content").value;
            },
          },
        );
      }

      async function showResearch() {
        try {
          const basePath = location.pathname.replace(/\/+$/, "");
          const resp = await fetch(`${basePath}/research`);
          const research = await resp.json();

          if (!research.stack && !research.architecture) {
            openModal(
              "Stack Research",
              `
              <div class="empty-state" style="margin:0">
                <p>No research available.</p>
                <p style="color:var(--text-dim)">Generated by <code>/core-setup</code> Phase 7</p>
              </div>
            `,
              { readOnly: true },
            );
            return;
          }

          let content = "";
          if (research.stack) {
            content += `<div class="research-content">${md(research.stack)}</div>`;
          }
          if (research.architecture) {
            content += `<h3 style="margin-top:24px;color:var(--text)">Architecture Baseline</h3>
              <div class="research-content">${md(research.architecture)}</div>`;
          }

          openModal("Stack Research", content, { readOnly: true, wide: true });
        } catch (e) {
          openModal(
            "Error",
            `<p>Could not load research: ${esc(e.message)}</p>`,
            { readOnly: true },
          );
        }
      }

      // ─── Config (CLAUDE.md) ────────────────────────────────

      let configCache = null;
      let configEditing = false;

      function renderConfig() {
        const base = location.pathname.replace(/\/+$/, "");

        if (configCache === null) {
          fetch(base + "/claude-md")
            .then((r) => r.json())
            .then((d) => {
              configCache = d.content || "";
              const el = document.getElementById("config");
              if (el) el.innerHTML = renderConfig();
            })
            .catch(() => {
              configCache = "";
            });
          return '<div style="padding:40px;color:var(--text-dim)">Loading...</div>';
        }

        if (configEditing) {
          return `
            <div class="section-header">
              <h2>CLAUDE.md</h2>
              <div style="display:flex;gap:8px">
                <button id="config-save" class="edit-btn edit-btn--accent">Save</button>
                <button id="config-cancel" class="edit-btn">Cancel</button>
              </div>
            </div>
            <textarea id="config-editor" style="width:100%;min-height:500px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:monospace;font-size:13px;line-height:1.6;resize:vertical;tab-size:2">${esc(configCache)}</textarea>`;
        }

        if (!configCache) {
          return `
            <div class="section-header">
              <h2>CLAUDE.md</h2>
              <button id="config-create" class="edit-btn edit-btn--accent">+ Create</button>
            </div>
            <div class="empty-state">
              <p>No CLAUDE.md found</p>
            </div>`;
        }

        return `
          <div class="section-header">
            <h2>CLAUDE.md</h2>
            <button id="config-edit" class="header-icon-btn" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          </div>
          <div class="research-content">${md(configCache)}</div>`;
      }

      document.addEventListener("click", (e) => {
        const base = location.pathname.replace(/\/+$/, "");

        if (e.target.id === "config-edit") {
          configEditing = true;
          render();
          return;
        }

        if (e.target.id === "config-cancel") {
          configEditing = false;
          render();
          return;
        }

        if (e.target.id === "config-create") {
          configCache = "# " + (data.seed.name || "Project") + "\n\n";
          configEditing = true;
          render();
          return;
        }

        if (e.target.id === "config-save") {
          const textarea = document.getElementById("config-editor");
          if (!textarea) return;
          const content = textarea.value;
          fetch(base + "/claude-md", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content }),
          })
            .then((r) => r.json())
            .then((d) => {
              if (d.ok) {
                configCache = content;
                configEditing = false;
                render();
              }
            })
            .catch((err) => alert("Save failed: " + err.message));
          return;
        }
      });

      // ─── Render ─────────────────────────────────────────────

      const TYPE_ICONS = {
        FEATURE: "◆",
        API: "⬡",
        INTEGRATION: "⟳",
        UI: "▣",
        REFACTOR: "↺",
        PAGE: "▤",
        COMPONENT: "⬡",
        THEME: "◐",
        A11Y: "♿",
        PERF: "⚡",
        CHANGE: "~",
        BUG: "✕",
      };

      const featureDetailCache = {};

      function buildFeatureDetailHtml(detail) {
        const isDesign = detail.type === "PAGE" || detail.type === "COMPONENT";
        return isDesign
          ? buildDesignDetailHtml(detail)
          : buildDevDetailHtml(detail);
      }

      function buildDesignDetailHtml(detail) {
        let html = "";
        const base = location.pathname.replace(/\/(backlog|dashboard)\/?$/, "");

        // Screenshot + smoke status
        if (detail.audit && detail.audit.buildScreenshot) {
          const cacheBuster = encodeURIComponent(
            detail.audit.lastRun || detail.shippedAt || "",
          );
          const src =
            base +
            "/asset?path=" +
            encodeURIComponent(detail.audit.buildScreenshot) +
            (cacheBuster ? "&v=" + cacheBuster : "");
          const s = detail.audit.buildSmokeStatus;
          const smokeBadge =
            s === "PASS"
              ? `<span class="fm-smoke-badge fm-smoke--pass">Smoke PASS</span>`
              : s === "FAIL"
                ? `<span class="fm-smoke-badge fm-smoke--fail">Smoke FAIL</span>`
                : "";
          html += `<div class="fm-section fm-screenshot-section">
            ${smokeBadge}
            <img src="${src}" alt="Smoke render — ${esc(detail.name || "")}" loading="lazy" class="fm-screenshot-img" onclick="this.classList.toggle('fm-screenshot-zoom')" onerror="this.outerHTML='<div class=\\'fm-screenshot-missing\\'>Screenshot not found</div>'">
          </div>`;
        }

        // Audit block (one-liner format)
        if (detail.audit && detail.audit.lastRun) {
          const a = detail.audit;
          const f = a.findings || {};
          const scopes = Array.isArray(a.scopes) ? a.scopes.join(" · ") : "";
          const c = f.critical != null ? parseInt(f.critical, 10) : null;
          const w = f.warnings != null ? parseInt(f.warnings, 10) : null;
          const p = f.passed != null ? parseInt(f.passed, 10) : null;
          const findingsHtml = [
            p != null ? `<span class="fm-finding--passed">✓${p}</span>` : "",
            w != null ? `<span class="fm-finding--warning">⚠${w}</span>` : "",
            c != null ? `<span class="fm-finding--critical">✗${c}</span>` : "",
          ]
            .filter(Boolean)
            .join("");
          html += `<div class="fm-section fm-audit-block">
            <div class="fm-audit-line">
              <span class="fm-audit-tag">AUDIT</span>
              <span class="fm-audit-sep">·</span>
              <span class="fm-audit-date">${esc(a.lastRun)}</span>
              ${scopes ? `<span class="fm-audit-sep">·</span><span class="fm-audit-scopes">${esc(scopes)}</span>` : ""}
              ${findingsHtml ? `<span class="fm-audit-sep">·</span><span class="fm-findings-inline">${findingsHtml}</span>` : ""}
            </div>
          </div>`;
        }

        // Design spec
        const spec = detail.design;
        if (spec) {
          const isComp = detail.type === "COMPONENT";
          let specHtml = `<h4>${esc(spec.name || detail.name || "")}`;
          if (isComp && spec.scope)
            specHtml += ` <span class="fm-scope-badge">${esc(spec.scope)}</span>`;
          specHtml += `</h4>`;
          if (spec.purpose)
            specHtml += `<p class="fm-spec-purpose">${esc(spec.purpose)}</p>`;
          if (isComp) {
            const matrix = [
              spec.variants && spec.variants.length
                ? ["Variants", spec.variants]
                : null,
              spec.sizes && spec.sizes.length ? ["Sizes", spec.sizes] : null,
              spec.states && spec.states.length
                ? ["States", spec.states]
                : null,
            ].filter(Boolean);
            matrix.forEach(([label, vals]) => {
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">${label}</span><span class="fm-spec-vals">${vals.map(esc).join(" · ")}</span></div>`;
            });
            if (spec.props && spec.props.length)
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Props</span><span class="fm-spec-vals">${spec.props.map(esc).join(", ")}</span></div>`;
            if (spec.usedIn && spec.usedIn.length)
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Used in</span><span class="fm-spec-vals">${spec.usedIn.map((p) => `<span class="fm-spec-link" onclick="navigateToFeature('${esc(p)}')">${esc(p)}</span>`).join(", ")}</span></div>`;
          } else {
            if (spec.uses && spec.uses.length)
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Uses</span><span class="fm-spec-vals">${spec.uses.map((c) => `<span class="fm-spec-link" onclick="navigateToFeature('${esc(c)}')">${esc(c)}</span>`).join(", ")}</span></div>`;
          }
          if (detail.type === "COMPONENT" && detail.demoPath) {
            specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Demo</span><span class="fm-spec-vals"><span class="fm-spec-link" onclick="window.open('${base}/file?path=${encodeURIComponent(detail.demoPath)}','_blank')">${esc(detail.demoPath)}</span></span></div>`;
          }
          html += `<div class="fm-section fm-spec-block">${specHtml}</div>`;
        }

        // Files (reused)
        const files = detail.files || [];
        if (files.length) {
          const icons = { create: "+", modify: "~", delete: "−" };
          const colors = {
            create: "var(--done)",
            modify: "var(--accent)",
            delete: "var(--danger)",
          };
          html += `<div class="fm-section"><h4>Files (${files.length})</h4><div class="fm-files">`;
          files.forEach((f) => {
            const openUrl =
              base + "/open/" + encodeURIComponent(f.path).replace(/%2F/g, "/");
            html += `<div class="fm-file" data-path="${esc(f.path)}">
              <div class="fm-file-row" role="button" tabindex="0" aria-expanded="false" data-path="${esc(f.path)}">
                <span class="fm-file-action" style="color:${colors[f.action] || "var(--text-dim)"}">${icons[f.action] || "·"}</span>
                <span class="bk-file-chevron">▸</span>
                <span class="fm-file-path">${esc(f.path)}</span>
                <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(f.path)} in VS Code">↗</button>
              </div>
              <div class="fm-file-diff" hidden></div>
            </div>`;
          });
          html += `</div></div>`;
        }

        // Gaps (pending handler gaps from gap-discovery)
        const gaps = (spec && spec.gaps) || [];
        const pendingGaps = gaps.filter((g) => g.status === "pending");
        if (pendingGaps.length) {
          const rows = pendingGaps
            .map(
              (g) => `<div class="fm-gap-row">
            <span class="fm-gap-prop">${esc(g.prop || "")}</span>
            <span class="fm-gap-ctx">${esc(g.context || "")}</span>
            <span class="fm-gap-status">pending</span>
          </div>`,
            )
            .join("");
          html += `<div class="fm-section fm-gaps-block"><h4>Handler Gaps (${pendingGaps.length})</h4>${rows}</div>`;
        }

        return html;
      }

      function buildDevDetailHtml(detail) {
        let html = "";

        // Summary — the short, human-readable headline for this feature
        if (detail.summary) {
          html += `<p class="fm-summary">${esc(detail.summary)}</p>`;
        }

        const reqs = detail.requirements || [];
        if (reqs.length) {
          const rows = reqs
            .map((r) => {

                <div class="fm-req-body">
                  <span class="fm-req-desc">${esc(r.description)}</span>
                </div>
                ${r.category ? `<span class="fm-req-cat">${esc(r.category)}</span>` : ""}
              </div>`;
            })
            .join("");
          html += `<div class="fm-section"><h4>Requirements (${reqs.length})</h4><div class="fm-reqs">${rows}</div></div>`;
        }

        const files = detail.files || [];
        if (files.length) {
          const icons = { create: "+", modify: "~", delete: "−" };
          const colors = {
            create: "var(--done)",
            modify: "var(--accent)",
            delete: "var(--danger)",
          };
          const basePath = location.pathname.replace(
            /\/(backlog|dashboard)\/?$/,
            "",
          );
          html += `<div class="fm-section"><h4>Files (${files.length})</h4><div class="fm-files">`;
          files.forEach((f) => {
            const openUrl =
              basePath +
              "/open/" +
              encodeURIComponent(f.path).replace(/%2F/g, "/");
            html += `<div class="fm-file" data-path="${esc(f.path)}">
              <div class="fm-file-row" role="button" tabindex="0" aria-expanded="false" data-path="${esc(f.path)}">
                <span class="fm-file-action" style="color:${colors[f.action] || "var(--text-dim)"}">${icons[f.action] || "·"}</span>
                <span class="bk-file-chevron">▸</span>
                <span class="fm-file-path">${esc(f.path)}</span>
                <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(f.path)} in VS Code">↗</button>
              </div>
              <div class="fm-file-diff" hidden></div>
            </div>`;
          });
          html += `</div></div>`;
        }

        // Ship metadata — date, commit
        if (detail.shippedAt || detail.shippedSha) {
          const shaShort = detail.shippedSha

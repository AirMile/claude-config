          html += `<div class="fm-section fm-ship-meta" style="display:flex;gap:14px;flex-wrap:wrap;color:var(--text-dim);font-size:12px">
            ${detail.shippedAt ? `<span>${esc(detail.shippedAt)}</span>` : ""}
            ${shaShort ? `<span title="${esc(detail.shippedSha)}">${shaShort}</span>` : ""}
          </div>`;
        }

        return html;
      }

      async function openFeatureModal(name) {
        const modal = document.getElementById("feature-modal");
        const title = document.getElementById("feature-modal-title");
        const body = document.getElementById("feature-modal-body");
        if (!modal) return;

        title.textContent = name;
        body.innerHTML = '<div class="fm-loading">Loading…</div>';
        modal.classList.add("active");

        let detail = featureDetailCache[name];
        if (!detail) {
          try {
            const base = location.pathname
              .replace(/\/dashboard\/?$/, "")
              .replace(/\/+$/, "");
            const res = await fetch(
              base + "/feature/" + encodeURIComponent(name),
            );
            if (res.ok) {
              detail = await res.json();
              featureDetailCache[name] = detail;
            }
          } catch {}
        }

        body.innerHTML = detail
          ? buildFeatureDetailHtml(detail)
          : '<p style="color:var(--text-dim)">No feature.json found.</p>';
      }

      async function toggleFileDiffRow(row) {
        const panel = row.nextElementSibling?.classList.contains("bk-file-diff")
          ? row.nextElementSibling
          : row.closest(".fm-file")?.querySelector(".fm-file-diff");
        if (!panel) return;
        const open = row.getAttribute("aria-expanded") === "true";
        if (open) {
          panel.hidden = true;
          row.setAttribute("aria-expanded", "false");
          return;
        }
        row.setAttribute("aria-expanded", "true");
        panel.hidden = false;
        if (!panel.dataset.loaded) {
          panel.innerHTML = '<div class="bk-diff-loading">Loading…</div>';
          const basePath = location.pathname.replace(
            /\/(backlog|dashboard)\/?$/,
            "",
          );
          const url =
            basePath +
            "/diff/" +
            encodeURIComponent(row.dataset.path).replace(/%2F/g, "/");
          try {
            const r = await fetch(url);
            const d = await r.json();
            panel.innerHTML = renderDiff(d, row.dataset.path);
            panel.dataset.loaded = "1";
          } catch (e) {
            panel.innerHTML = `<div class="bk-diff-error">Could not load diff: ${esc(String(e))}</div>`;
          }
        }
      }

      function renderDiff(d, filePath = "") {
        if (!d.git)
          return '<div class="bk-diff-empty">No git repo — diff not available.</div>';
        if (!d.tracked && !d.working)
          return '<div class="bk-diff-empty">File not yet tracked by git.</div>';
        const hasWorking = !!d.working;
        const hasRecent = !!d.recent;
        const showLabels = hasWorking && hasRecent;
        const sections = [];
        if (hasWorking) {
          const label = showLabels
            ? '<div class="bk-diff-label">Uncommitted</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatDiff(d.working, filePath)}</div>`,
          );
        }
        if (hasRecent) {
          const label = showLabels
            ? '<div class="bk-diff-label">Recent commits</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatGitLog(d.recent, filePath)}</div>`,
          );
        }
        if (!sections.length)
          return '<div class="bk-diff-empty">No changes found.</div>';
        return sections.join("");
      }

      function formatDiff(text, filePath = "") {
        const ext = (filePath.split(".").pop() || "").toLowerCase();
        const langMap = {
          ts: "typescript",
          tsx: "typescript",
          js: "javascript",
          jsx: "javascript",
          css: "css",
          json: "json",
          html: "xml",
          md: "markdown",
          py: "python",
          rs: "rust",
          go: "go",
          sh: "bash",
        };
        const lang = langMap[ext] || null;
        function hl(s) {
          if (lang && typeof hljs !== "undefined") {
            try {
              return hljs.highlight(s, { language: lang }).value;
            } catch {}
          }
          return esc(s);
        }
        const SKIP = [
          "diff --git ",
          "index ",
          "new file mode",
          "deleted file mode",
          "similarity index",
          "rename from",
          "rename to",
          "Binary files",
          "--- ",
          "+++ ",
          "\\ No newline",
        ];
        const lines = text.split("\n");
        let oldLn = 0,
          newLn = 0;
        const rows = [];
        for (const line of lines) {
          if (SKIP.some((p) => line.startsWith(p))) continue;
          if (line.startsWith("@@")) {
            const m = line.match(
              /@@\s+-(\d+)(?:,\d+)?\s+\+(\d+)(?:,\d+)?\s+@@/,
            );
            if (m) {
              oldLn = parseInt(m[1], 10);
              newLn = parseInt(m[2], 10);
            }
            const ctx = line.replace(/^@@.*?@@\s*/, "").trim();
            rows.push(
              `<div class="bk-diff-hunk"><span class="bk-diff-gutter"></span><span class="bk-diff-text">${ctx ? "… " + esc(ctx) : "…"}</span></div>`,
            );
            continue;
          }
          let cls = "",
            l = "",
            r = "";
          if (line.startsWith("+")) {
            cls = "bk-diff-add";
            r = newLn++;
          } else if (line.startsWith("-")) {
            cls = "bk-diff-del";
            l = oldLn++;
          } else {
            l = oldLn++;
            r = newLn++;
          }
          const content = line.length ? line.slice(1) : "";
          rows.push(
            `<div class="bk-diff-row ${cls}"><span class="bk-diff-gutter">${l || ""}<span class="sep">·</span>${r || ""}</span><span class="bk-diff-text">${hl(content)}</span></div>`,
          );
        }
        return `<div class="bk-diff">${rows.join("")}</div>`;
      }

      function formatGitLog(text, filePath = "") {
        const lines = text.split("\n");
        const out = [];
        let buf = [];
        let currentHead = null;
        const flush = () => {
          if (!currentHead && !buf.length) return;
          const diffHtml = buf.length
            ? formatDiff(buf.join("\n"), filePath)
            : "";
          let headHtml = "";
          if (currentHead) {
            const [, subject, age] = currentHead;
            const m = subject.match(/^(\w+)[\s(]/);
            const phase = m ? m[1].toLowerCase() : "other";
            const p = ["build", "verify", "refactor"].includes(phase)
              ? phase
              : "other";
            headHtml = `<div class="bk-commit-head"><span class="bk-phase-badge bk-phase-badge--${p}">${esc(p)}</span><span class="bk-commit-subject">${esc(subject)}</span><span class="bk-commit-age">${esc(age || "")}</span></div>`;
          }
          out.push(`<div class="bk-commit-block">${headHtml}${diffHtml}</div>`);
          buf = [];
          currentHead = null;
        };
        for (const line of lines) {
          if (
            line.includes("\t") &&
            !line.startsWith(" ") &&
            !line.match(/^[+\-@]/)
          ) {
            flush();
            const parts = line.split("\t");
            currentHead = [parts[0] || "", parts[1] || "", parts[2] || ""];
          } else {
            buf.push(line);
          }
        }
        flush();
        return out.join("");
      }

      function closeFeatureModal() {
        const modal = document.getElementById("feature-modal");
        if (modal) modal.classList.remove("active");
      }

      function renderFeatures() {
        let shipped = (data.features || []).filter((f) => f.shipped);

        if (!shipped.length) {
          return `
            <div class="section-header"><h2>Features</h2></div>
            <div class="empty-state">
              <p>No shipped features yet.</p>
              <p style="color:var(--text-dim)">Run <code>/dev-ship</code> to promote features to the dashboard.</p>
            </div>`;
        }

        const DESIGN_TYPES = ["PAGE", "COMPONENT"];
        const project = window.location.pathname.split("/").filter(Boolean)[0];
        const rowsHtml = shipped
          .map((f) => {
            const dateStr = f.shippedAt || f.date || "";
            const isDesign = DESIGN_TYPES.includes(f.type);
            const screenshotPath = f.audit && f.audit.buildScreenshot;
            const thumbCb = encodeURIComponent(
              (f.audit && f.audit.lastRun) || f.shippedAt || "",
            );
            const thumbHtml = isDesign
              ? screenshotPath
                ? `<img class="feat-thumb" src="/${project}/asset?path=${encodeURIComponent(screenshotPath)}${thumbCb ? "&v=" + thumbCb : ""}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'feat-thumb feat-thumb--placeholder\\' title=\\'No smoke render available\\'>⊟</div>'">`
                : `<div class="feat-thumb feat-thumb--placeholder" title="No smoke render available">⊟</div>`
              : "";
            const rowClass = isDesign
              ? "feat-row feat-row--design"
              : "feat-row";
            return `
            <div class="${rowClass}" onclick="openFeatureModal('${esc(f.name)}')">
              ${thumbHtml}
              <div class="feat-card-body">
                <span class="feat-name">${esc(f.name)}</span>
                ${f.summary || f.description ? `<span class="feat-desc">${esc(f.summary || f.description)}</span>` : ""}
                <div class="feat-card-footer">
                  <span class="feat-type">${esc(f.type || "FEATURE")}</span>
                  ${dateStr ? `<span class="feat-date">${esc(dateStr)}</span>` : ""}
                </div>
              </div>
            </div>`;
          })
          .join("");

        const counts = shipped.reduce((acc, f) => {
          const t = f.type || "FEATURE";
          acc[t] = (acc[t] || 0) + 1;
          return acc;
        }, {});
        const findingsOpen = shipped.reduce((sum, f) => {
          const c = parseInt(
            (f.audit && f.audit.findings && f.audit.findings.critical) || 0,
            10,
          );
          const w = parseInt(
            (f.audit && f.audit.findings && f.audit.findings.warnings) || 0,
            10,
          );
          return sum + c + w;
        }, 0);
        const typeOrder = [
          "PAGE",
          "COMPONENT",
          "FEATURE",
          "API",
          "INTEGRATION",
          "BUG",
          "CHANGE",
          "REFACTOR",
        ];
        const countsHtml = typeOrder
          .filter((t) => counts[t])
          .map((t) => `<span class="feat-count">${counts[t]} ${t}</span>`)
          .join('<span class="feat-count-sep">·</span>');
        const findingsHtml = findingsOpen
          ? `<span class="feat-count-sep">·</span><span class="feat-count feat-count--findings">${findingsOpen} findings open</span>`
          : "";

        return `
          <div class="section-header">
            <h2>Features</h2>
            ${countsHtml ? `<div class="feat-metrics">${countsHtml}${findingsHtml}</div>` : ""}
          </div>
          <div class="feat-list">${rowsHtml}</div>`;
      }

      function navigateToFeature(name) {
        if (!name) return;
        openFeatureModal(name);
      }

      const renderers = {
        features: renderFeatures,
        seed: renderSeed,
        stack: renderStack,
        theme: renderTheme,
        config: renderConfig,
      };

      function renderSearchResults(q) {
        const results = [];

        const hit = (text) => (text || "").toLowerCase().includes(q);

        (data.features || [])
          .filter((f) => f.shipped)
          .forEach((f) => {
            if (hit(f.name) || hit(f.description))
              results.push({
                section: "Features",
                anchor: "#features",
                type: f.type || "FEATURE",
                name: f.name,
                desc: f.description || "",
              });
          });

        const stack = data.stack || {};
        ["framework", "language", "styling", "db", "auth", "hosting"].forEach(
          (k) => {
            if (stack[k] && hit(stack[k]))
              results.push({
                section: "Stack",
                anchor: "#stack",
                type: k,
                name: stack[k],
                desc: "",
              });
          },
        );
        (stack.packages || []).forEach((p) => {
          const name = p.name || (typeof p === "string" ? p : "");
          if (hit(name) || hit(p.description))
            results.push({
              section: "Stack",
              anchor: "#stack",
              type: "package",
              name,
              desc: p.description || "",
            });
        });

        const theme = data.theme || {};
        const themeColors = theme.colors || {};
        ["main", "accent", "semantic"].forEach((group) => {
          (themeColors[group] || []).forEach((c) => {
            if (hit(c.token) || hit(c.value) || hit(c.usage))
              results.push({
                section: "Design System",
                anchor: "#theme",
                type: "color",
                name: c.token,
                desc: c.value + (c.usage ? " — " + c.usage : ""),
              });
          });
        });
        const families = (theme.typography || {}).families || {};
        ["heading", "body", "mono"].forEach((role) => {
          if (families[role] && hit(families[role]))
            results.push({
              section: "Design System",
              anchor: "#theme",
              type: "font",
              name: families[role],
              desc: role,
            });
        });
        ((theme.typography || {}).sizes || []).forEach((s) => {
          if (hit(s.token) || hit(s.size))
            results.push({
              section: "Design System",
              anchor: "#theme",
              type: "type",
              name: s.token,
              desc: s.size,
            });
        });
        [
          { key: "spacing", items: (theme.spacing || {}).scale || [] },
          { key: "breakpoint", items: theme.breakpoints || [] },
          { key: "radius", items: theme.borderRadius || [] },
          { key: "shadow", items: theme.shadows || [] },
        ].forEach(({ key, items }) => {
          items.forEach((item) => {
            if (
              hit(item.token) ||
              hit(item.value) ||
              hit(item.usage) ||
              hit(item.target)
            )
              results.push({
                section: "Design System",
                anchor: "#theme",
                type: key,
                name: item.token,
                desc:
                  item.value +
                  (item.usage || item.target
                    ? " — " + (item.usage || item.target)
                    : ""),
              });
          });
        });

        if (!results.length) {
          return `<div class="sr-empty">No results for <strong>${esc(q)}</strong></div>`;
        }

        const groups = {};
        results.forEach((r) => {
          if (!groups[r.section]) groups[r.section] = [];
          groups[r.section].push(r);
        });

        return `<div class="sr-results">${Object.entries(groups)
          .map(
            ([section, items]) => `
          <div class="sr-section">
            <div class="sr-section-label">${esc(section)}</div>
            ${items
              .map(
                (item) => `
              <a href="${item.anchor}" class="sr-item" onclick="setTimeout(()=>{document.getElementById('dash-search').value='';render();},80)">
                <span class="sr-badge">${esc(item.type)}</span>
                <span class="sr-name">${esc(item.name)}</span>
                ${item.desc ? `<span class="sr-desc">${esc(item.desc)}</span>` : ""}
              </a>`,
              )
              .join("")}
          </div>`,
          )
          .join("")}</div>`;
      }

      function render() {
        const projectName = data.seed.name || data.name || "Dashboard";
        document.title = projectName + " — Dashboard";

        // Layout
        let layoutEl = document.querySelector(".layout");
        if (!layoutEl) {
          layoutEl = document.createElement("div");
          layoutEl.className = "layout";
          document.body.appendChild(layoutEl);
        }

        // Content: all sections simultaneously
        let contentEl = layoutEl.querySelector(".content");
        if (!contentEl) {
          contentEl = document.createElement("main");
          contentEl.className = "content";
          layoutEl.appendChild(contentEl);
        }

        // Determine which sections to show (skip empty optional ones)
        const th = data.theme || {};
        const tc = th.colors && !Array.isArray(th.colors) ? th.colors : {};
        const hasTheme =
          (tc.main && tc.main.length) ||
          (tc.accent && tc.accent.length) ||
          (tc.semantic && tc.semantic.length) ||
          (th.typography &&
            th.typography.sizes &&
            th.typography.sizes.length) ||
          th.cssVars;
        const hasStack = !!(
          data.stack &&
          (data.stack.framework || data.stack.language)
        );
        const hasSeed = !!(data.seed && (data.seed.name || data.seed.content));
        const hasFeatures = (data.features || []).some((f) => f.shipped);
        const hiddenSections = {};
        if (!hasTheme) hiddenSections.theme = true;
        if (!hasStack) hiddenSections.stack = true;
        if (!hasSeed) hiddenSections.seed = true;
        if (!hasFeatures) hiddenSections.features = true;

        const visibleTabs = TABS.filter((t) => !hiddenSections[t.id]);

        // Toolbar — created once at top of content (preserves search focus +
        // scroll position). Row 1 is the search bar, row 2 the jump-tag rail
        // (replaces the old left sidebar — same anchor-link model as the
        // Backlog board's status chips). Both rows share one sticky wrapper
        // so JS can measure its real height into --toolbar-h (see
        // .section-header in dashboard.css) instead of assuming a fixed size.
        let toolbarWrapEl = contentEl.querySelector(".board-toolbar");
        if (!toolbarWrapEl) {
          toolbarWrapEl = document.createElement("div");
          toolbarWrapEl.className = "board-toolbar";
          toolbarWrapEl.id = "board-toolbar";
          contentEl.prepend(toolbarWrapEl);

          const toolbar = document.createElement("div");
          toolbar.className = "content-toolbar";
          toolbar.innerHTML = `<div class="content-toolbar-side"></div><div class="content-toolbar-center"><input id="dash-search" class="content-toolbar-search" placeholder="Search..." oninput="render()" /><button type="button" class="search-clear" aria-label="Clear search" onclick="const i=document.getElementById('dash-search');i.value='';i.focus();render()"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>`;
          toolbarWrapEl.appendChild(toolbar);

          const sectionNav = document.createElement("div");
          sectionNav.className = "section-nav";
          sectionNav.innerHTML = `<div class="section-chips" id="dash-section-chips"></div>`;
          toolbarWrapEl.appendChild(sectionNav);
        }

        // Jump-tag rail: anchor links, refilled every render (tab visibility
        // can change as data loads).
        const chipsEl = document.getElementById("dash-section-chips");
        chipsEl.innerHTML = visibleTabs
          .map(
            (t) =>
              `<a href="#${t.id}" data-section="${t.id}">${esc(t.label)}</a>`,
          )
          .join("");
        chipsEl.hidden = visibleTabs.length <= 1;

        // Sections: replace on each render
        let sectionsEl = contentEl.querySelector(".dash-sections");
        if (!sectionsEl) {
          sectionsEl = document.createElement("div");
          sectionsEl.className = "dash-sections";
          contentEl.appendChild(sectionsEl);
        }
        const q = getDashSearch();
        if (q) {
          sectionsEl.innerHTML = renderSearchResults(q);
        } else {
          sectionsEl.innerHTML = visibleTabs
            .map(
              (t) =>
                `<section id="${t.id}" class="dash-section">${renderers[t.id] ? renderers[t.id]() : ""}</section>`,
            )
            .join("");
        }
        applyCollapseState();
        applyStyleguideTokens();

        sectionsEl.onclick = (e) => {
          const modeTab = e.target.closest(".sg-mode-tab");
          if (modeTab) {
            const tabsEl = modeTab.closest(".sg-mode-tabs");
            const panelsEl = tabsEl.nextElementSibling;
            tabsEl
              .querySelectorAll(".sg-mode-tab")
              .forEach((t) => t.classList.toggle("active", t === modeTab));
            panelsEl
              .querySelectorAll(".sg-mode-panel")
              .forEach((p) =>
                p.classList.toggle(
                  "active",
                  p.dataset.modePanel === modeTab.dataset.mode,
                ),
              );
            return;
          }
          if (e.target.closest("button, a, input, select, textarea")) return;
          const sgTitle = e.target.closest(".sg-section > .sg-section-title");
          if (sgTitle) {
            const el = sgTitle.parentElement;
            el.classList.toggle("collapsed");
            setCollapsed(
              el.dataset.collapseKey || "sg:" + sgTitle.textContent.trim(),
              el.classList.contains("collapsed"),
            );
            return;
          }
          const sectionHeader = e.target.closest(
            ".dash-section > .section-header",
          );
          if (sectionHeader) {
            const el = sectionHeader.parentElement;
            el.classList.toggle("collapsed");
            setCollapsed(
              "section:" + el.id,
              el.classList.contains("collapsed"),
            );
            return;
          }
        };

        // Jump-tag active state: pick section closest to top of viewport
        let _dashClickFrozen = false;
        let _dashClickTimer = null;
        function setDashActive(id) {
          chipsEl.querySelectorAll("a[data-section]").forEach((a) => {
            a.classList.toggle("active", a.dataset.section === id);
          });
        }
        function updateDashSidebarActive() {
          if (_dashClickFrozen) return;
          const sections = Array.from(
            contentEl.querySelectorAll(".dash-section[id]"),
          );
          if (!sections.length) return;
          // Find section whose top is closest to 60px (just below sticky header)
          let best = sections[0];
          let bestDist = Infinity;
          sections.forEach((s) => {
            const top = s.getBoundingClientRect().top;
            const dist = Math.abs(top - 60);
            if (dist < bestDist) {
              bestDist = dist;
              best = s;
            }
          });
          setDashActive(best.id);
        }
        // On click: freeze scroll-based updates for 800ms so click wins
        chipsEl.querySelectorAll("a[data-section]").forEach((a) => {
          a.addEventListener("click", () => {
            const sec = document.getElementById(a.dataset.section);
            if (sec && sec.classList.contains("collapsed")) {
              sec.classList.remove("collapsed");
              setCollapsed("section:" + a.dataset.section, false);
            }
            _dashClickFrozen = true;
            setDashActive(a.dataset.section);
            clearTimeout(_dashClickTimer);
            _dashClickTimer = setTimeout(() => {
              _dashClickFrozen = false;
            }, 800);
          });
        });
        window.removeEventListener("scroll", window._dashSidebarScroll);
        window._dashSidebarScroll = updateDashSidebarActive;
        window.addEventListener("scroll", updateDashSidebarActive, {
          passive: true,
        });
        updateDashSidebarActive();
      }

      function applyCollapseState() {
        // Top-level dash sections (default open)
        document.querySelectorAll(".dash-section[id]").forEach((sec) => {
          sec.classList.toggle(
            "collapsed",
            isCollapsed("section:" + sec.id, false),
          );
        });

        // Styleguide sections (default open)
        document
          .querySelectorAll("[data-collapse-key^='sg:']")
          .forEach((el) => {
            el.classList.toggle(
              "collapsed",
              isCollapsed(el.dataset.collapseKey, false),
            );
          });
      }

      // ─── Init ───────────────────────────────────────────────
      document.addEventListener("click", (e) => {
        const openBtn = e.target.closest(".bk-file-open-btn");
        if (openBtn) {
          e.preventDefault();
          e.stopPropagation();
          openInVSCode(openBtn.dataset.openUrl, openBtn);
          return;
        }
        const row = e.target.closest(".fm-file-row[data-path]");
        if (row) {
          e.preventDefault();
          e.stopPropagation();
          toggleFileDiffRow(row);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          const row = document.activeElement?.closest?.(
            ".fm-file-row[data-path]",
          );
          if (row && document.activeElement === row) {
            e.preventDefault();
            toggleFileDiffRow(row);
          }
        }
      });
      // Delegated clicks for the inline styleguide's animation demo cards
      document.addEventListener("click", (e) => {
        const card = e.target.closest("#sg-inline .sg-anim-demo-card");
        if (card) {
          runAnimDemo(
            card,
            card.dataset.dur || null,
            card.dataset.ease || null,
          );
        }
      });
      render();

      // Sticky section-headers and jump-anchor scroll-offsets read --toolbar-h
      // (see dashboard.css) instead of a hardcoded px value, so they stay
      // correct at any screen width.
      const _toolbarEl = document.getElementById("board-toolbar");
      if (_toolbarEl) {
        const _syncToolbarHeight = () =>
          document.documentElement.style.setProperty(
            "--toolbar-h",
            _toolbarEl.offsetHeight + "px",
          );
        new ResizeObserver(_syncToolbarHeight).observe(_toolbarEl);
        _syncToolbarHeight();
      }

      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        const sec = id ? document.getElementById(id) : null;
        if (sec && sec.classList.contains("collapsed")) {
          sec.classList.remove("collapsed");
          setCollapsed("section:" + id, false);
        }
      });
    </script>
    <button
      id="back-to-top"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
      title="Back to top"
    >
      ↑
    </button>
    <script>
      (function () {
        const btn = document.getElementById("back-to-top");
        window.addEventListener(
          "scroll",
          () => {
            btn.classList.toggle("visible", window.scrollY > 300);
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>

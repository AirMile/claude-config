    <script>
      // ─── Markdown ─────────────────────────────────────────
      function slugify(text) {
        return text
          .toLowerCase()
          .replace(/<[^>]*>/g, "")
          .replace(/[^\w\s-]/g, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .trim();
      }

      const renderer = new marked.Renderer();
      renderer.heading = function ({ text, depth }) {
        const id = slugify(text);
        return `<h${depth} id="${id}">${text}</h${depth}>`;
      };

      marked.setOptions({ breaks: true, gfm: true, renderer });

      function md(text) {
        if (!text) return "";
        // Strip YAML frontmatter (---...---) before rendering
        const stripped = text.replace(/^---\n[\s\S]*?\n---\n?/, "");
        return marked.parse(stripped);
      }

      // ─── State ──────────────────────────────────────────────
      const raw = document.getElementById("dashboard-data").textContent;
      let data = JSON.parse(raw);
      initCollapseStore("dashboard", data.seed?.name || data.name);
      let modalContext = null;

      // Wire up project settings modal (⚙ button auto-mounted by /lib/settings-modal.js)
      if (window.SettingsModal) {
        const _projectDir =
          location.pathname.split("/").filter(Boolean)[0] || "";
        window.SettingsModal.configure({
          projectDir: _projectDir,
          getMode: () => (data.team && data.team.mode) || "solo",
          onSaved: (mode) => {
            if (!data.team) data.team = {};
            data.team.mode = mode;
            if (typeof render === "function") render();
          },
        });
      }

      function getDashSearch() {
        return (document.getElementById("dash-search")?.value || "")
          .toLowerCase()
          .trim();
      }

      const TABS = [
        { id: "features", label: "Features" },
        { id: "architecture", label: "Architecture" },
        { id: "learnings", label: "Knowledge" },
        { id: "theme", label: "Design System" },
        { id: "stack", label: "Stack" },
        { id: "seed", label: "Seed" },
        { id: "config", label: "Config" },
      ];

      const EMPTY = {
        seed: {
          name: "",
          content: "",
        },
        architecture: {
          diagram: "",
          description: "",
        },
        design: {
          pages: [],
          flows: [],
          principles: [],
        },
        theme: {
          colors: { main: [], accent: [], semantic: [] },
          typography: {
            families: { heading: "", body: "", mono: "" },
            sizes: [],
          },
          spacing: { base: "", scale: [] },
          breakpoints: [],
          borderRadius: [],
          shadows: [],
          modes: {},
          cssVars: "",
        },
        stack: {
          framework: "",
          language: "",
          styling: "",
          db: "",
          auth: "",
          hosting: "",
          packages: [],
        },
        data: { entities: [] },
        endpoints: [],
      };

      // Ensure all sections exist
      for (const key of Object.keys(EMPTY)) {
        if (!data[key]) data[key] = JSON.parse(JSON.stringify(EMPTY[key]));
      }

      // ─── Helpers ────────────────────────────────────────────
      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str || "";
        return d.innerHTML;
      }

      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("visible");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("visible"), 2000);
      }

      function openInVSCode(url, el) {
        const orig = el.style.color;
        el.style.color = "var(--text-dim)";
        fetch(url, { method: "POST" })
          .then((r) => r.json())
          .then((d) => {
            if (d.ok) {
              el.style.color = "var(--done)";
              setTimeout(() => (el.style.color = orig), 1000);
            } else {
              el.style.color = "var(--danger)";
              toast("Error: " + (d.error || "unknown"));
              setTimeout(() => (el.style.color = orig), 2000);
            }
          })
          .catch(() => {
            el.style.color = "var(--danger)";
            toast("Could not reach VS Code");
            setTimeout(() => (el.style.color = orig), 2000);
          });
      }

      const SAVE_URL = (() => {
        const p = location.pathname.replace(/\/+$/, "");
        return p ? p + "/save" : "/save";
      })();

      let saveTimer = null;
      function syncJSON() {
        const el = document.getElementById("dashboard-data");
        el.textContent = "\n" + JSON.stringify(data, null, 2) + "\n";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            const res = await fetch(SAVE_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            if (!res.ok) throw new Error("save failed");
            toast("Saved");
          } catch {
            toast("Server not reachable");
          }
        }, 300);
      }

      // ─── Modal ──────────────────────────────────────────────
      // Anchor link navigation within modals (e.g. research TOC)
      document.getElementById("modal-body").addEventListener("click", (e) => {
        const a = e.target.closest("a[href^='#']");
        if (!a) return;
        e.preventDefault();
        const id = decodeURIComponent(a.getAttribute("href").slice(1));
        const target = document.getElementById(id);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      function openModal(title, bodyHtml, ctx) {
        modalContext = ctx;
        document.getElementById("modal-title").textContent = title;
        document.getElementById("modal-body").innerHTML = bodyHtml;
        document.getElementById("modal-delete").style.display =
          ctx && ctx.deletable ? "" : "none";
        const isReadOnly = ctx && ctx.readOnly;
        document.getElementById("modal-save").style.display = isReadOnly
          ? "none"
          : "";
        document.querySelector("#modal .btn-cancel").textContent = isReadOnly
          ? "Close"
          : "Cancel";
        document.getElementById("modal").classList.add("active");
        if (isReadOnly) {
          document.querySelector("#modal .modal").style.maxWidth = ctx.wide
            ? "800px"
            : "";
        } else {
          document.querySelector("#modal .modal").style.maxWidth = "";
        }
        const first = document.querySelector(
          "#modal-body input, #modal-body textarea, #modal-body select",
        );
        if (first) first.focus();
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        modalContext = null;
      }

      function handleModalSave() {
        if (modalContext && modalContext.onSave) {
          modalContext.onSave();
        }
        closeModal();
        syncJSON();
        render();
      }

      function handleModalDelete() {
        if (modalContext && modalContext.onDelete) {
          modalContext.onDelete();
        }
        closeModal();
        syncJSON();
        render();
      }

      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("modal")) closeModal();
      });

      document.getElementById("modal").addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
        if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
          e.preventDefault();
          handleModalSave();
        }
      });

      // ─── Diagram Lightbox (pan & zoom) ─────────────────────
      (function () {
        const lb = document.getElementById("diagram-lightbox");
        const vp = document.getElementById("diagram-lightbox-viewport");
        const ct = document.getElementById("diagram-lightbox-content");
        let scale = 1,
          tx = 0,
          ty = 0,
          dragging = false,
          startX,
          startY;

        function apply() {
          ct.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
        }

        window.openDiagramLightbox = function () {
          const src = document.querySelector("#arch-diagram svg");
          if (!src) return;
          ct.innerHTML = "";
          const clone = src.cloneNode(true);
          const origId = src.getAttribute("id") || "arch-mermaid";
          const newId = origId + "-lb";
          clone.setAttribute("id", newId);
          clone.querySelectorAll("style").forEach((s) => {
            s.textContent = s.textContent.replaceAll("#" + origId, "#" + newId);
          });
          const vb = clone.getAttribute("viewBox");
          if (vb) {
            const [, , w, h] = vb.split(/\s+/).map(Number);
            clone.setAttribute("width", w);
            clone.setAttribute("height", h);
          }
          clone.style.maxWidth = "none";
          ct.appendChild(clone);
          lb.classList.add("active");
          document.body.style.overflow = "hidden";
          // fit diagram to viewport with padding
          const vpRect = vp.getBoundingClientRect();
          const pad = 40;
          const svgW =
            clone.getBoundingClientRect().width ||
            parseFloat(clone.getAttribute("width"));
          const svgH =
            clone.getBoundingClientRect().height ||
            parseFloat(clone.getAttribute("height"));
          scale = Math.min(
            (vpRect.width - pad * 2) / svgW,
            (vpRect.height - pad * 2) / svgH,
            1,
          );
          tx = (vpRect.width - svgW * scale) / 2;
          ty = (vpRect.height - svgH * scale) / 2;
          apply();
        };

        window.closeDiagramLightbox = function () {
          lb.classList.remove("active");
          document.body.style.overflow = "";
        };

        lb.addEventListener("click", (e) => {
          if (e.target === lb || e.target === vp) closeDiagramLightbox();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && lb.classList.contains("active"))
            closeDiagramLightbox();
        });

        vp.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            const rect = vp.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            tx = mx - factor * (mx - tx);
            ty = my - factor * (my - ty);
            scale *= factor;
            apply();
          },
          { passive: false },
        );

        vp.addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          dragging = true;
          startX = e.clientX - tx;
          startY = e.clientY - ty;
          vp.style.cursor = "grabbing";
        });

        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          tx = e.clientX - startX;
          ty = e.clientY - startY;
          apply();
        });

        window.addEventListener("mouseup", () => {
          dragging = false;
          vp.style.cursor = "grab";
        });
      })();

      // ─── Section Renderers ──────────────────────────────────

      function renderSeed() {
        const c = data.seed;
        if (!c.name && !c.content) {
          return `
            <div class="section-header">
              <h2>Seed</h2>
              <button class="edit-btn edit-btn--accent" onclick="editSeed()">+ Add</button>
            </div>
            <div class="empty-state"><p>No seed defined yet.</p>
            <p style="color:var(--text-dim)">Run <code>/project-seed</code> to define it</p></div>`;
        }
        return `
          <div class="section-header">
            <h2>Seed</h2>
            <button class="header-icon-btn" onclick="editSeed()" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          </div>
          <div class="seed-content">${md(c.content)}</div>`;
      }

      let _diagramRenderId = 0;
      let _diagramShowAll = localStorage.getItem("diagram-scope") !== "built";

      function filterDiagram(src, showAll) {
        if (showAll) return src;
        const lines = src.split("\n");
        const planned = new Set();
        for (const l of lines) {
          const m = l.match(/^\s*(\w+)[\[({].*:::planned/);
          if (m) planned.add(m[1]);
        }
        if (!planned.size) return src;
        // pass 1: remove planned nodes and their connections
        const filtered = lines.filter((l) => {
          if (/^\s*(classDef|graph|flowchart)\s/.test(l)) return true;
          if (/^\s*subgraph\s/.test(l) || /^\s*end\s*$/.test(l)) return true;
          for (const id of planned) {
            if (new RegExp("^\\s*" + id + "[\\[({]").test(l)) return false;
          }
          if (/-->|---|\.-|==>/.test(l)) {
            for (const id of planned) {
              if (new RegExp("(^|\\s)" + id + "(\\s|$|[\\[(-])").test(l))
                return false;
            }
          }
          return true;
        });
        // pass 2: remove empty subgraphs
        const result = [];
        let i = 0;
        while (i < filtered.length) {
          if (/^\s*subgraph\s/.test(filtered[i])) {
            let j = i + 1;
            while (j < filtered.length && !/^\s*end\s*$/.test(filtered[j])) j++;
            let hasContent = false;
            for (let k = i + 1; k < j; k++) {
              if (filtered[k].trim()) {
                hasContent = true;
                break;
              }
            }
            if (hasContent) {
              for (let k = i; k <= j; k++) result.push(filtered[k]);
            }
            i = j + 1;
          } else {
            result.push(filtered[i]);
            i++;
          }
        }
        return result.join("\n");
      }

      // ─── Code Cards ────────────────────────────────────

      function buildCodeCards() {
        const a = data.architecture || {};
        const components = a.components;
        if (!components || !components.length) return null;

        const reverseMap = {};
        components.forEach((c) => {
          (c.connects_to || []).forEach((edge) => {
            if (!reverseMap[edge.to]) reverseMap[edge.to] = [];
            reverseMap[edge.to].push({ name: c.name, type: edge.type });
          });
        });

        return components.map((c) => ({
          name: c.name,
          description: c.description || "",
          feature: c.feature || "",
          src: c.src || [],
          test: c.test || [],
          status: c.status || "done",
          group: c.layer || "Other",
          endpoints: (c.endpoints || []).map((p) => {
            const parts = p.trim().split(/\s+/);
            const hasMethod =
              /^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$/i.test(parts[0]);
            return {
              method: hasMethod ? parts[0].toUpperCase() : "GET",
              path: hasMethod ? parts.slice(1).join(" ") : p,
            };
          }),
          entities: (c.entities || []).map((e) => ({ name: e })),
          connections: {
            to: (c.connects_to || []).map((e) => ({
              name: e.to,
              type: e.type,
            })),
            from: reverseMap[c.name] || [],
          },
        }));
      }

      function toggleCard(card) {
        const wasExpanded = card.classList.contains("expanded");

        // Single pass: collapse others + clear highlights
        document.querySelectorAll(".code-card").forEach((c) => {
          if (c !== card) c.classList.remove("expanded");
          c.classList.remove(
            "code-card-dimmed",
            "code-card-connected",
            "code-card-connected--to",
            "code-card-connected--from",
          );
        });

        card.classList.toggle("expanded");
        setSingle(
          "expandedCard",
          card.classList.contains("expanded") ? card.dataset.component : null,
        );

        if (!wasExpanded) {
          const connTo = new Set(
            (card.dataset.connTo || "").split(",").filter(Boolean),
          );
          const connFrom = new Set(
            (card.dataset.connFrom || "").split(",").filter(Boolean),
          );

          if (connTo.size || connFrom.size) {
            document.querySelectorAll(".code-card").forEach((c) => {
              if (c === card) return;
              const name = c.dataset.component;
              if (connTo.has(name)) {
                c.classList.add(
                  "code-card-connected",
                  "code-card-connected--to",
                );
              } else if (connFrom.has(name)) {
                c.classList.add(
                  "code-card-connected",
                  "code-card-connected--from",
                );
              } else {
                c.classList.add("code-card-dimmed");
              }
            });
          }
        }
      }

      let _archDiagramRendered = false;
      function toggleArchDiagram() {
        const el = document.getElementById("arch-diagram");
        const btn = document.querySelector(".arch-diagram-toggle");
        if (!el) return;
        const hidden = el.classList.toggle("architecture-diagram--hidden");
        if (btn) btn.classList.toggle("active", !hidden);
        setCollapsed("arch-diagram", hidden);
        if (!hidden && !_archDiagramRendered) {
          const a = data.architecture || {};
          if (a.diagram) {
            renderMermaidDiagram(a.diagram);
            _archDiagramRendered = true;
          }
        }
      }

      function highlightCard(chip) {
        const target = chip.dataset.target;
        if (!target) return;
        const card = document.querySelector(
          `.code-card[data-component="${target}"]`,
        );
        if (!card) {
          chip.classList.add("code-card-conn--dead");
          chip.title = "No card found for this component";
          return;
        }
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        if (!card.classList.contains("expanded")) {
          toggleCard(card);
        }
      }

      function openFileInVSCode(filePath, el) {
        const url =
          location.pathname.replace(/\/$/, "") +
          "/open/" +
          encodeURIComponent(filePath).replace(/%2F/g, "/");
        openInVSCode(url, el);
      }

      function applyCodeCardFilter(showAll) {
        document.querySelectorAll(".code-card").forEach((card) => {
          card.classList.toggle(
            "code-card-hidden",
            !showAll && card.dataset.status === "planned",
          );
        });
        document.querySelectorAll(".code-cards-group").forEach((group) => {
          const visible = group.querySelectorAll(
            ".code-card:not(.code-card-hidden)",
          );
          group.style.display = visible.length ? "" : "none";
        });
      }

      const MAX_CONN_PER_DIR = 4;

      function renderConnChip(item, dir) {
        const typeBadge = item.type
          ? `<span class="code-card-conn-type">${esc(item.type)}</span>`
          : "";
        return `<span class="code-card-conn code-card-conn--${dir}" data-target="${esc(item.name.toLowerCase())}" onclick="highlightCard(this)">${esc(item.name)}${typeBadge}</span>`;
      }

      function renderConnGroup(items, dir, label) {
        if (!items.length) return "";
        const visible = items.slice(0, MAX_CONN_PER_DIR);
        const hidden = items.length - visible.length;
        return `<div class="code-card-conn-group">
          <span class="code-card-conn-label">${label}</span>
          <div class="code-card-conn-chips">
            ${visible.map((n) => renderConnChip(n, dir)).join("")}
            ${
              hidden > 0
                ? `<span class="code-card-conn code-card-conn--more" onclick="this.nextElementSibling.style.display='contents';this.remove()">+${hidden}</span><span style="display:none">${items
                    .slice(MAX_CONN_PER_DIR)
                    .map((n) => renderConnChip(n, dir))
                    .join("")}</span>`
                : ""
            }
          </div>
        </div>`;
      }

      function renderFileChip(path, isTest) {
        return `<span class="code-card-file${isTest ? " code-card-file--test" : ""}" data-path="${esc(path)}" onclick="openFileInVSCode(this.dataset.path, this)">${esc(path.split("/").pop())}</span>`;
      }

      function renderCodeCardsGrid(cards) {
        const grouped = {};
        cards.forEach((c) => {
          if (!grouped[c.group]) grouped[c.group] = [];
          grouped[c.group].push(c);
        });

        const layers = (data.architecture || {}).layers || [];
        const layerOrder = {};
        layers.forEach((l) => (layerOrder[l.name] = l.order || 99));

        const sortedGroups = Object.keys(grouped).sort((a, b) => {
          if (a === "Other") return 1;
          if (b === "Other") return -1;
          const oa = layerOrder[a];
          const ob = layerOrder[b];
          if (oa !== undefined && ob !== undefined) return oa - ob;
          if (oa !== undefined) return -1;
          if (ob !== undefined) return 1;
          return a.localeCompare(b);
        });

        return `<div class="code-cards" id="code-cards">${sortedGroups
          .map(
            (groupName) => `
          <div class="code-cards-group">
            ${groupName === "Overig" ? "" : `<h3 class="code-cards-group-title">${esc(groupName)}</h3>`}
            <div class="code-cards-grid">
              ${grouped[groupName].map((c) => renderCodeCard(c)).join("")}
            </div>
          </div>`,
          )
          .join("")}</div>`;
      }

      function renderCodeCard(c) {
        const counts = [];
        if (c.src.length)
          counts.push(
            `<span title="${c.src.length} source file${c.src.length > 1 ? "s" : ""}">${c.src.length} src</span>`,
          );
        if (c.test.length)
          counts.push(
            `<span title="${c.test.length} test${c.test.length > 1 ? "s" : ""}">${c.test.length} tst</span>`,
          );
        if (c.endpoints.length)
          counts.push(
            `<span title="${c.endpoints.length} endpoint${c.endpoints.length > 1 ? "s" : ""}">${c.endpoints.length} ep</span>`,
          );

        const conn = c.connections || { to: [], from: [] };
        const hasConn = conn.to.length || conn.from.length;

        const hasDetail =
          c.src.length ||
          c.test.length ||
          c.endpoints.length ||
          c.entities.length ||
          hasConn;

        const connectionsHtml = hasConn
          ? `<div class="code-card-section"><h4>Connections</h4><div class="code-card-connections">
              ${renderConnGroup(conn.from, "from", "Receives from")}
              ${renderConnGroup(conn.to, "to", "Sends to")}
            </div></div>`
          : "";

        const filesHtml =
          c.src.length || c.test.length
            ? `<div class="code-card-section"><h4>Files</h4><div class="code-card-files">
              ${c.src.map((f) => renderFileChip(f, false)).join("")}
              ${c.test.map((f) => renderFileChip(f, true)).join("")}
            </div></div>`
            : "";

        const endpointsHtml = c.endpoints.length
          ? `<div class="code-card-section"><h4>Endpoints</h4><div class="code-card-endpoints">
              ${c.endpoints.map((ep) => `<div class="code-card-endpoint"><span class="badge badge-${(ep.method || "get").toLowerCase()}">${esc(ep.method || "GET")}</span> ${esc(ep.path)}</div>`).join("")}
            </div></div>`
          : "";

        const entitiesHtml = c.entities.length
          ? `<div class="code-card-section"><h4>Entities</h4><div class="code-card-entities">
              ${c.entities.map((e) => `<span class="code-card-entity">${esc(e.name)}</span>`).join("")}
            </div></div>`
          : "";

        const connToLower = conn.to.map((e) => e.name.toLowerCase()).join(",");
        const connFromLower = conn.from
          .map((e) => e.name.toLowerCase())
          .join(",");

        return `
          <div class="code-card" data-status="${esc(c.status)}" data-component="${esc(c.name.toLowerCase())}" data-conn-to="${esc(connToLower)}" data-conn-from="${esc(connFromLower)}">
            <div class="code-card-header" onclick="toggleCard(this.closest('.code-card'))">
              <span class="code-card-status" data-status="${esc(c.status)}"></span>
              <span class="code-card-name">${esc(c.name)}</span>
              ${c.feature ? `<span class="code-card-feature">${esc(c.feature)}</span>` : ""}
              <span class="code-card-counts">${counts.join("")}</span>
              ${hasDetail ? `<span class="code-card-chevron">&#x203A;</span>` : ""}
            </div>
            ${c.description ? `<div class="code-card-desc">${esc(c.description)}</div>` : ""}
            ${hasDetail ? `<div class="code-card-detail">${connectionsHtml}${filesHtml}${endpointsHtml}${entitiesHtml}</div>` : ""}
          </div>`;
      }

      function renderMermaidDiagram(diagramSrc) {
        const el = document.getElementById("arch-diagram");
        if (!el || !diagramSrc) return;
        const filtered = filterDiagram(diagramSrc, _diagramShowAll);
        el.innerHTML = "";
        const id = "arch-mermaid-" + ++_diagramRenderId;
        mermaid
          .render(id, filtered)
          .then(({ svg }) => {
            el.innerHTML = svg;
            el.style.cursor = "pointer";
            el.title = "Click to open fullscreen";
            el.onclick = () => openDiagramLightbox();
          })
          .catch((err) => {
            el.innerHTML = `<div class="architecture-error">Diagram error: ${esc(err.message || String(err))}</div>`;
          });
      }

      function toggleDiagramScope(showAll) {
        _diagramShowAll = showAll;
        localStorage.setItem("diagram-scope", showAll ? "all" : "built");
        document
          .querySelectorAll(".arch-toggle button")
          .forEach((b) => b.classList.remove("active"));
        document
          .querySelector(
            `.arch-toggle button[data-scope="${showAll ? "all" : "built"}"]`,
          )
          ?.classList.add("active");
        const a = data.architecture || {};
        if (a.diagram) renderMermaidDiagram(a.diagram);
        applyCodeCardFilter(showAll);
      }

      function renderArchitecture() {
        const a = data.architecture || {};
        const hasDiagram = a.diagram && a.diagram.trim();
        const cards = buildCodeCards();
        const hasCards = !!cards;
        const hasPlanned =
          hasCards && cards.some((c) => c.status === "planned");

        if (!hasCards && !hasDiagram) {
          return `
            <div class="section-header"><h2>Architecture</h2></div>
            <div class="empty-state"><p>No components defined yet.</p>
            <p style="color:var(--text-dim)">Filled by <code>/dev-ship</code></p></div>`;
        }

        // Toolbar: filter toggle + optional diagram toggle
        const filterToggle = hasPlanned
          ? `<div class="arch-toggle">
              <button data-scope="all" class="${_diagramShowAll ? "active" : ""}" onclick="toggleDiagramScope(true)">All</button>
              <button data-scope="built" class="${!_diagramShowAll ? "active" : ""}" onclick="toggleDiagramScope(false)">Built</button>
            </div>`
          : "";

        const diagramToggle =
          hasDiagram && hasCards
            ? `<button class="arch-diagram-toggle" onclick="toggleArchDiagram()">Diagram</button>`
            : "";

        const splitClass =
          filterToggle && diagramToggle ? " arch-toolbar--split" : "";
        const toolbarHtml =
          filterToggle || diagramToggle
            ? `<div class="arch-toolbar${splitClass}">${filterToggle}${diagramToggle}</div>`
            : "";

        // Diagram: hidden by default when cards exist
        const diagramHidden = hasCards;
        const diagramHtml = hasDiagram
          ? `<div class="architecture-diagram${diagramHidden ? " architecture-diagram--hidden" : ""}" id="arch-diagram"></div>`
          : "";

        const dataFlowHtml =
          a.dataFlow && hasCards
            ? `<div class="code-cards-dataflow">
                <div class="code-cards-dataflow-label">Data flow</div>
                ${a.dataFlow
                  .split(/\.\s+(?=[A-Z])/)
                  .map((s) => s.replace(/\.\s*$/, "").trim())
                  .filter(Boolean)
                  .map((s) => {
                    const m = s.match(/^([^:]{1,24}):\s*(.*)$/);
                    return `<div class="code-cards-dataflow-line">${
                      m ? `<strong>${esc(m[1])}:</strong> ${esc(m[2])}` : esc(s)
                    }</div>`;
                  })
                  .join("")}
              </div>`
            : "";

        let descHtml = "";

        if (hasDiagram) {
          setTimeout(() => renderMermaidDiagram(a.diagram), 0);
        }

        // Sub-sections: Routes, Components flat, API, Entities
        function archSubSection(label, count, bodyHtml) {
          if (!count) return "";
          const id = "arch-sub-" + label.toLowerCase().replace(/\s+/g, "-");
          return `
            <div class="arch-subsection">
              <div class="arch-subsection-header" data-collapse-key="${id}" onclick="(function(el){
                var body=el.nextElementSibling;
                var open=el.classList.toggle('collapsed');
                body.style.display=open?'none':'';
                setCollapsed(el.dataset.collapseKey,open);
              })(this)">
                <span class="arch-subsection-label">${esc(label)}</span>
              </div>
              <div class="arch-subsection-body">${bodyHtml}</div>
            </div>`;
        }

        const routes = a.routes || [];
        const localUrl = data.localUrl || "";
        const normalizeAuth = (v) => {
          if (v === true) return "user";
          if (v === false || v == null) return "public";
          return v;
        };
        const routesHtml = routes.length
          ? routes
              .map((r) => {
                const auth = normalizeAuth(r.auth);
                const badge =
                  auth !== "public"
                    ? `<span class="route-auth-badge route-auth-badge--${auth}">${auth}</span>`
                    : "";
                const path = r.path || r.name || "";
                const protectedCls =
                  auth === "admin"
                    ? " arch-row--admin"
                    : auth !== "public"
                      ? " arch-row--protected"
                      : "";
                const pathHtml = localUrl
                  ? `<a class="arch-row-path" href="${esc(localUrl)}${esc(path)}" target="_blank" rel="noopener">${esc(path)}</a>`
                  : `<span class="arch-row-path arch-row-path--static">${esc(path)}</span>`;
                return `
            <div class="arch-row arch-row--route${protectedCls}">
              ${pathHtml}
              <span class="arch-row-meta">${esc(r.purpose || r.description || "")}</span>
              <span class="arch-row-badge-slot">${badge}</span>
            </div>`;
              })
              .join("")
          : "";

        const components = a.components || [];
        const componentsHtml = components.length
          ? components
              .map(
                (c) => `
            <div class="arch-row">
              <span class="arch-row-name">${esc(c.name)}</span>
              ${c.layer ? `<span class="arch-badge-layer">${esc(c.layer)}</span>` : ""}
              <span class="arch-row-meta">${esc(c.description || "")}</span>
            </div>`,
              )
              .join("")
          : "";

        const endpoints = (data.endpoints || []).filter(
          (e) => e.path && e.path !== "NONE" && e.method && e.method !== "NONE",
        );
        const methodColor = {
          GET: "var(--done)",
          POST: "var(--accent)",
          PUT: "var(--defined)",
          PATCH: "var(--defined)",
          DELETE: "var(--danger)",
        };
        const apiHtml = endpoints.length
          ? endpoints
              .map((e) => {
                const auth = normalizeAuth(e.auth);
                const badge =
                  auth !== "public"
                    ? `<span class="route-auth-badge route-auth-badge--${auth}">${auth}</span>`
                    : "";
                const protectedCls =
                  auth !== "public" ? " arch-row--protected" : "";
                return `
            <div class="arch-row${protectedCls}">
              <span style="font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:10px;font-weight:700;width:46px;flex-shrink:0;color:${methodColor[e.method] || "var(--text-dim)"}">${esc(e.method || "")}</span>
              <span class="arch-row-path">${esc(e.path || "")}</span>
              <span class="arch-row-meta">${esc(e.description || "")}</span>
              ${badge}
            </div>`;
              })
              .join("")
          : "";

        const entities =
          data.data && data.data.entities ? data.data.entities : [];
        const entitiesHtml = entities.length
          ? entities
              .map(
                (e) => `
            <div class="arch-row">
              <span class="arch-row-name">${esc(e.name)}</span>
              <span class="arch-row-meta" style="font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:10px">${(
                e.fields || []
              )
                .map((f) => {
                  const fn = typeof f === "string" ? f : f.name;
                  const ft = typeof f === "string" ? null : f.type;
                  return esc(fn + (ft ? ":" + ft : ""));
                })
                .join(", ")}</span>
            </div>`,
              )
              .join("")
          : "";

        const designFlows = (data.design || {}).flows || [];
        const flowsArchHtml = designFlows.length
          ? designFlows
              .map(
                (f, i) => `
            <div class="flow-card" id="arch-flow-${i}">
              <div class="flow-header" onclick="document.getElementById('arch-flow-${i}').classList.toggle('flow-open')">
                <svg class="flow-chevron" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="flow-name">${esc(f.name)}</span>
                ${f.description || f.notes ? `<span class="flow-desc-inline">${esc(f.description || f.notes || "")}</span>` : ""}
              </div>
              <div class="flow-body">
                ${f.steps && f.steps.length ? `<ol class="flow-steps">${f.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
              </div>
            </div>`,
              )
              .join("")
          : "";

        const subSectionsHtml = [
          archSubSection("Routes", routes.length, routesHtml),
          archSubSection("Components", components.length, componentsHtml),
          archSubSection("API", endpoints.length, apiHtml),
          archSubSection("Entities", entities.length, entitiesHtml),
          archSubSection("Flows", designFlows.length, flowsArchHtml),
        ].join("");

        return `
          <div class="section-header">
            <h2>Architecture</h2>
          </div>
          ${toolbarHtml}
          ${subSectionsHtml}
          ${dataFlowHtml}
          ${diagramHtml}
          ${descHtml}`;
      }

      function editArchitecture() {
        const a = data.architecture || {};
        const compJson = a.components
          ? JSON.stringify(a.components, null, 2)
          : "";
        const layersJson = a.layers ? JSON.stringify(a.layers, null, 2) : "";
        openModal(
          "Edit components",
          `
          <label>Data Flow</label>
          <input id="f-arch-dataflow" type="text" value="${esc(a.dataFlow || "")}" placeholder="Request → API → Service → Database" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-size:13px" />
          <label>Layers (JSON)</label>
          <textarea id="f-arch-layers" rows="4" style="font-family:var(--font-mono,'JetBrains Mono','Fira Code',monospace);font-size:12px;line-height:1.5" placeholder='[{"name":"API Laag","order":1}]'>${esc(layersJson)}</textarea>
          <label>Components (JSON)</label>
          <textarea id="f-arch-components" rows="16" style="font-family:var(--font-mono,'JetBrains Mono','Fira Code',monospace);font-size:12px;line-height:1.5" placeholder='[{"name":"...","layer":"...","status":"done","connects_to":[{"to":"OtherComponent","type":"calls"}]}]'>${esc(compJson)}</textarea>
          <label>Mermaid Diagram (optional)</label>
          <textarea id="f-arch-diagram" rows="6" style="font-family:var(--font-mono,'JetBrains Mono','Fira Code',monospace);font-size:12px;line-height:1.5">${esc(a.diagram || "")}</textarea>
        `,
          {
            wide: true,
            onSave() {
              data.architecture = data.architecture || {};
              data.architecture.dataFlow = document
                .getElementById("f-arch-dataflow")
                .value.trim();
              const lv = document.getElementById("f-arch-layers").value.trim();
              if (lv) {
                try {
                  data.architecture.layers = JSON.parse(lv);
                } catch (e) {
                  /* keep existing */
                }
              }
              const cv = document
                .getElementById("f-arch-components")
                .value.trim();
              if (cv) {
                try {
                  data.architecture.components = JSON.parse(cv);
                } catch (e) {
                  /* keep existing */
                }
              }
              data.architecture.diagram =
                document.getElementById("f-arch-diagram").value.trim() || "";
            },
          },
        );
      }

      // ─── Styleguide helpers ────────────────────────────────
      function parseModeVars(modeInput, t) {
        const primitives = {};
        const primSrc = typeof (t || {}).cssVars === "string" ? t.cssVars : "";
        for (const m of primSrc.matchAll(/(-{2}[\w-]+)\s*:\s*([^;}\n]+)/g)) {
          primitives[m[1].trim()] = m[2].trim();
        }
        const result = [];
        const pushPair = (token, value) => {
          const varRef = String(value).match(/^var\((--[\w-]+)\)$/);
          if (varRef && primitives[varRef[1]]) value = primitives[varRef[1]];
          result.push({ token, value });
        };
        if (
          modeInput &&
          typeof modeInput === "object" &&
          !Array.isArray(modeInput)
        ) {
          for (const [k, v] of Object.entries(modeInput)) {
            const token = k.startsWith("--") ? k : `--${k}`;
            pushPair(token, v);
          }
        } else if (typeof modeInput === "string") {
          for (const m of modeInput.matchAll(
            /(-{2}[\w-]+)\s*:\s*([^;}\n]+)/g,
          )) {
            pushPair(m[1].trim(), m[2].trim());
          }
        }
        return result;
      }

      function renderModeSwatches(vars, compact) {
        if (!vars.length)
          return '<p style="color:var(--text-dim);font-size:13px">No CSS variables defined in this mode.</p>';
        const NON_COLOR = new Set([
          "--radius",
          "--font-sans",
          "--font-mono",
          "--font-serif",
          "--font-heading",
        ]);
        const GROUPS = [
          { label: "Base", keys: ["--background", "--foreground"] },
          {
            label: "Surfaces",
            keys: [
              "--card",
              "--card-foreground",
              "--popover",
              "--popover-foreground",
            ],
          },
          {
            label: "Actions",
            keys: [
              "--primary",
              "--primary-foreground",
              "--secondary",
              "--secondary-foreground",
              "--accent",
              "--accent-foreground",
            ],
          },
          {
            label: "States",
            keys: [
              "--muted",
              "--muted-foreground",
              "--destructive",
              "--destructive-foreground",
            ],
          },
          { label: "Form", keys: ["--border", "--input", "--ring"] },
        ];
        const groups = compact ? GROUPS.slice(0, 2) : GROUPS;
        const varMap = new Map(vars.map((v) => [v.token, v]));
        const assigned = new Set();
        function swatch(v) {
          return `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(v.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(v.token)}</div><div class="sg-color-value">${esc(v.value)}</div></div></div>`;
        }
        let html = "";
        for (const g of groups) {
          const gv = g.keys.map((k) => varMap.get(k)).filter(Boolean);
          if (!gv.length) continue;
          gv.forEach((v) => assigned.add(v.token));
          html += `<div class="sg-mode-group"><div class="sg-mode-group-label">${g.label}</div><div class="sg-palette">${gv.map(swatch).join("")}</div></div>`;
        }
        if (!compact) {
          const rest = vars.filter(
            (v) => !assigned.has(v.token) && !NON_COLOR.has(v.token),
          );
          if (rest.length)
            html += `<div class="sg-mode-group"><div class="sg-mode-group-label">Other</div><div class="sg-palette">${rest.map(swatch).join("")}</div></div>`;
        }
        return (
          html ||
          '<p style="color:var(--text-dim);font-size:13px">No color variables defined in this mode.</p>'
        );
      }

      function renderSpringCurveSvg(spring) {
        const stiffness = spring.stiffness || 300;
        const damping = spring.damping || 25;
        const mass = spring.mass || 1;
        const W = 200,
          H = 56,
          dt = 0.016;
        let x = 0,
          v = 0;
        const pts = [0];
        for (let i = 0; i < 120; i++) {
          const f = -stiffness * (x - 1) - damping * v;
          v += (f / mass) * dt;
          x += v * dt;
          pts.push(x);
          if (i > 10 && Math.abs(x - 1) < 0.002 && Math.abs(v) < 0.002) break;
        }
        const n = pts.length;
        const minY = Math.min(0, ...pts);
        const maxY = Math.max(1, ...pts);
        const range = maxY - minY || 1;
        const tx = (i) => ((i / (n - 1)) * (W - 8) + 4).toFixed(1);
        const ty = (y) => (H - 4 - ((y - minY) / range) * (H - 8)).toFixed(1);
        let path = `M ${tx(0)} ${ty(pts[0])}`;
        for (let i = 1; i < n; i++) path += ` L ${tx(i)} ${ty(pts[i])}`;
        const tLine = ty(1);
        return `<svg class="sg-spring-curve" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><line x1="4" y1="${tLine}" x2="${W - 4}" y2="${tLine}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
      }

      function renderStyleguideFull(t) {
        const colors = t.colors || {};
        const typo = t.typography || {};
        const families = typo.families || {};
        const sizes = typo.sizes || [];
        const motion = t.motion || {};
        const durations = motion.durations || [];
        const easings = motion.easings || [];
        const springs = motion.spring || [];
        const axes = motion.axes || {};
        const choreography =
          motion.choreography &&
          typeof motion.choreography === "object" &&
          !Array.isArray(motion.choreography)
            ? motion.choreography
            : null;
        const modes = t.modes || {};
        const modeKeys = Object.keys(modes);
        const surfaces = t.surfaces || {};
        const glass = surfaces.glass || null;
        const elevation = surfaces.elevation || [];
        const shadows = t.shadows || [];
        const spacingScale = (t.spacing || {}).scale || [];
        const radii = t.borderRadius || [];
        const ixn = t.interactions || {};
        let html = "";

        // Page header — title, pack badge, mode toggle (product-styled, not dashboard chrome)
        const pack = motion.pack || "";
        const packLabels = {
          apple: "Apple",
          standard: "Standard",
          subtle: "Subtle",
          playful: "Playful",
        };
        const packLabel =
          packLabels[pack] ||
          (pack ? pack.charAt(0).toUpperCase() + pack.slice(1) : "");
        const packBadgeHtml = packLabel
          ? `<span class="sg-pack-badge sg-pack-badge--${esc(pack)}">${esc(packLabel)}</span>`
          : "";
        const modeToggleHtml =
          modeKeys.length > 1
            ? `<button id="sg-overlay-mode-btn" class="sg-page-mode-btn" onclick="toggleStyleguideMode(this)">Dark</button>`
            : "";
        html += `<header class="sg-page-header"><h1 class="sg-page-title">Design System</h1><div class="sg-page-meta">${packBadgeHtml}${modeToggleHtml}</div></header>`;

        // Colors
        const hasColors =
          Object.values(colors).some((a) => a && a.length) || modeKeys.length;
        if (hasColors) {
          const brandHtml =
            colors.accent && colors.accent.length
              ? `<div class="sg-mode-group"><div class="sg-mode-group-label">Brand</div><div class="sg-palette">${colors.accent.map((c) => `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(c.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(c.token)}</div><div class="sg-color-value">${esc(c.value)}</div>${c.usage ? `<div class="sg-color-usage">${esc(c.usage)}</div>` : ""}</div></div>`).join("")}</div></div>`
              : "";
          const statusHtml =
            colors.semantic && colors.semantic.length
              ? `<div class="sg-mode-group"><div class="sg-mode-group-label">Status</div><div class="sg-palette">${colors.semantic.map((c) => `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(c.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(c.token)}</div><div class="sg-color-value">${esc(c.value)}</div>${c.usage ? `<div class="sg-color-usage">${esc(c.usage)}</div>` : ""}</div></div>`).join("")}</div></div>`
              : "";
          const modesHtml = modeKeys.length
            ? `<div class="sg-mode-panels">${modeKeys.map((k, i) => `<div class="sg-mode-panel${i === 0 ? " active" : ""}" data-mode-panel="${esc(k)}">${renderModeSwatches(parseModeVars(modes[k], t), false)}</div>`).join("")}</div>`
            : "";
          html += `<div class="sg-section" data-collapse-key="sg:Colors"><div class="sg-section-title">Colors</div>${modesHtml}${brandHtml}${statusHtml}</div>`;
        }

        // Typography
        const specimenEntries = [
          { label: "Heading", family: families.heading },
          { label: "Body", family: families.body },
          { label: "Mono", family: families.mono },
        ].filter((e) => e.family);
        if (specimenEntries.length || sizes.length) {
          const specHtml = specimenEntries.length
            ? `<div class="sg-font-specimens">${specimenEntries.map((e) => `<div class="sg-font-card"><div class="sg-font-specimen" style="font-family:${esc(e.family)}">Aa</div><div class="sg-font-name">${esc(e.label)}</div><div class="sg-font-family">${esc(e.family)}</div></div>`).join("")}</div>`
            : "";
          const rampHtml = sizes.length
            ? `<div class="sg-type-ramp">${sizes.map((s) => `<div class="sg-type-ramp-row"><div class="sg-type-ramp-meta"><div class="sg-type-ramp-token">${esc(s.token)}</div><div class="sg-type-ramp-size">${esc(s.size)}${s.lineHeight ? ` / ${esc(s.lineHeight)}` : ""}</div></div><div class="sg-type-ramp-preview" style="font-size:${esc(s.size)}${families.body ? `;font-family:${esc(families.body)}` : ""}">The quick brown fox</div></div>`).join("")}</div>`
            : "";
          html += `<div class="sg-section" data-collapse-key="sg:Typography"><div class="sg-section-title">Typography</div>${specHtml}${rampHtml}</div>`;
        }

        // Spacing
        if (spacingScale.length) {
          const maxPx =
            spacingScale.reduce(
              (m, s) => Math.max(m, parseInt(s.value) || 0),
              64,
            ) || 64;
          html += `<div class="sg-section" data-collapse-key="sg:Spacing"><div class="sg-section-title">Spacing</div><div class="sg-spacing-strip">${spacingScale
            .map((s) => {
              const px = parseInt(s.value) || 4;
              const h = Math.max(4, Math.round((px / maxPx) * 64));
              return `<div class="sg-spacing-block"><div class="sg-spacing-rect" style="height:${h}px"></div><div class="sg-spacing-tick">${esc(s.value)}</div></div>`;
            })
            .join("")}</div></div>`;
        }

        // Border Radius
        if (radii.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Border Radius"><div class="sg-section-title">Border Radius</div><div class="sg-radius-grid">${radii.map((r) => `<div class="sg-radius-item"><div class="sg-radius-box" style="border-radius:${esc(r.value)}"></div><div class="sg-radius-label">${esc(r.token)}<br>${esc(r.value)}</div></div>`).join("")}</div></div>`;
        }

        // Shadows
        if (shadows.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Shadows"><div class="sg-section-title">Shadows</div><div class="sg-shadow-list">${shadows.map((s) => `<div class="sg-shadow-row"><span class="sg-shadow-token">${esc(s.token)}</span><div class="sg-shadow-preview" style="box-shadow:${esc(s.value)}"></div><span class="sg-shadow-meta">${esc(s.value)}</span></div>`).join("")}</div></div>`;
        }

        // Elevation
        if (elevation.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Elevation"><div class="sg-section-title">Elevation</div><div class="sg-elevation-grid">${elevation.map((e) => `<div class="sg-elevation-card" style="box-shadow:${esc(e.shadow || e.value || "")}"><div class="sg-elevation-label">${esc(e.token || e.level || "")}</div>${e.usage ? `<div class="sg-elevation-usage">${esc(e.usage)}</div>` : ""}</div>`).join("")}</div></div>`;
        }

        // Glass Surface
        if (glass && glass.enabled) {
          const blurVal = glass.blur || "16px";
          const satVal = glass.saturation || "180%";
          const tintVal = glass.tint || "rgba(255,255,255,0.08)";
          const borderVal = glass.border || "rgba(255,255,255,0.15)";
          html += `<div class="sg-section" data-collapse-key="sg:Glass Surface"><div class="sg-section-title">Glass Surface</div><div class="sg-glass-card"><div class="sg-glass-bg"></div><div class="sg-glass-layer" style="background:${esc(tintVal)};backdrop-filter:blur(${esc(blurVal)}) saturate(${esc(satVal)});-webkit-backdrop-filter:blur(${esc(blurVal)}) saturate(${esc(satVal)});border-color:${esc(borderVal)}"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Glass surface</div><div class="sg-glass-meta"><span>blur: ${esc(blurVal)}</span><span>saturation: ${esc(satVal)}</span><span>tint: ${esc(tintVal)}</span>${glass.vibrancy ? `<span>vibrancy: ${esc(glass.vibrancy)}</span>` : ""}</div></div></div></div>`;
        }

        // Motion
        const hasMotion =
          durations.length ||
          easings.length ||
          springs.length ||
          choreography ||
          Object.keys(axes).length;
        if (hasMotion) {
          const pack = motion.pack || "";
          const packLabels = {
            apple: "Apple",
            standard: "Standard",
            subtle: "Subtle",
            playful: "Playful",
          };
          const packLabel =
            packLabels[pack] ||
            (pack ? pack.charAt(0).toUpperCase() + pack.slice(1) : "");
          const packBadge = packLabel
            ? ` <span class="sg-pack-badge sg-pack-badge--${esc(pack)}" style="margin-left:6px">${esc(packLabel)}</span>`
            : "";

          const axesHtml = Object.keys(axes).length
            ? `<div class="sg-axes-row">${Object.entries(axes)
                .map(([k, v]) => {
                  const pct =
                    typeof v === "number"
                      ? Math.round(v * 100)
                      : parseInt(v) || 50;
                  return `<div class="sg-axis-item"><div class="sg-axis-label">${esc(k)}</div><div class="sg-axis-track"><div class="sg-axis-fill" style="width:${pct}%"></div></div><div class="sg-axis-value">${pct}%</div></div>`;
                })
                .join("")}</div>`
            : "";

          const maxMs =
            durations.reduce(
              (m, d) => Math.max(m, parseInt(d.value) || 0),
              500,
            ) || 500;
          const durHtml = durations.length
            ? `<div class="sg-motion-sub">Durations</div><div class="sg-spacing-scale" style="margin-bottom:16px">${durations.map((d) => `<div class="sg-spacing-row"><div class="sg-spacing-label">${esc(d.token)}</div><div class="sg-duration-bar" style="width:${Math.round(((parseInt(d.value) || 0) / maxMs) * 100)}%"></div><div class="sg-spacing-value">${esc(d.value)}${d.usage ? ` — ${esc(d.usage)}` : ""}</div></div>`).join("")}</div><div class="sg-motion-sub">Live demos — click to play</div><div class="sg-anim-demo-grid">${durations.map((d) => `<div class="sg-anim-demo-card" data-dur="${esc(d.value)}" data-ease=""><div class="sg-anim-demo-box"></div><div class="sg-anim-demo-label">${esc(d.token)}<br>${esc(d.value)}</div></div>`).join("")}</div>`
            : "";

          const easHtml = easings.length
            ? `<div class="sg-motion-sub" style="margin-top:16px">Easings</div><div class="sg-easing-list" style="margin-bottom:14px">${easings.map((e) => `<div class="sg-easing-row"><span class="sg-easing-token">${esc(e.token)}</span><span class="sg-easing-value">${esc(e.value)}${e.usage ? ` <span class="sg-easing-usage">— ${esc(e.usage)}</span>` : ""}</span></div>`).join("")}</div><div class="sg-motion-sub">Easing demos — click to play</div><div class="sg-anim-demo-grid">${easings.map((e) => `<div class="sg-anim-demo-card" data-dur="" data-ease="${esc(e.value)}"><div class="sg-anim-demo-box"></div><div class="sg-anim-demo-label">${esc(e.token)}</div></div>`).join("")}</div>`
            : "";

          const springHtml = springs.length
            ? `<div class="sg-motion-sub" style="margin-top:16px">Springs</div><div class="sg-spring-grid">${springs.map((s) => `<div class="sg-spring-card"><div class="sg-spring-label">${esc(s.token)}</div><div class="sg-spring-meta">stiffness: ${esc(String(s.stiffness || ""))} · damping: ${esc(String(s.damping || ""))} · mass: ${esc(String(s.mass || ""))}</div>${renderSpringCurveSvg(s)}</div>`).join("")}</div>`
            : "";

          const choreoHtml =
            choreography && Object.keys(choreography).length
              ? `<div class="sg-motion-sub" style="margin-top:16px">Choreography</div><div class="sg-choreo-grid">${Object.entries(
                  choreography,
                )
                  .map(
                    ([k, v]) =>
                      `<div class="sg-choreo-row"><span class="sg-choreo-key">${esc(k)}</span><span class="sg-choreo-value">${esc(typeof v === "string" ? v : JSON.stringify(v))}</span></div>`,
                  )
                  .join("")}</div>`
              : "";

          html += `<div class="sg-section" data-collapse-key="sg:Motion"><div class="sg-section-title">Motion${packBadge}</div>${axesHtml}${durHtml}${easHtml}${springHtml}${choreoHtml}</div>`;
        }

        // Interactions
        const ixnEntries = [
          ixn.focusRing && {
            label: "Focus Ring",
            parts: [
              ixn.focusRing.width && `width: ${ixn.focusRing.width}`,
              ixn.focusRing.style && `style: ${ixn.focusRing.style}`,
              ixn.focusRing.offset && `offset: ${ixn.focusRing.offset}`,
              ixn.focusRing.color && `color: ${ixn.focusRing.color}`,
            ].filter(Boolean),
          },
          ixn.hover && {
            label: "Hover",
            parts: [
              ixn.hover.transition && `transition: ${ixn.hover.transition}`,
              ixn.hover.transform &&
                ixn.hover.transform !== "none" &&
                `transform: ${ixn.hover.transform}`,
            ].filter(Boolean),
          },
          ixn.active && {
            label: "Active",
            parts: [
              ixn.active.transform && `transform: ${ixn.active.transform}`,
            ].filter(Boolean),
          },
        ].filter((e) => e && e.parts && e.parts.length);
        if (ixnEntries.length) {
          html += `<div class="sg-section" data-collapse-key="sg:Interactions"><div class="sg-section-title">Interactions</div><div class="sg-interaction-list">${ixnEntries.map((e) => `<div class="sg-interaction-row"><span class="sg-interaction-label">${esc(e.label)}</span><span class="sg-interaction-value">${e.parts.map((p) => `<code>${esc(p)}</code>`).join("")}</span></div>`).join("")}</div></div>`;
        }

        return (
          html ||
          '<p style="color:var(--text-dim)">No design system data available.</p>'
        );
      }

      function buildAliasCss(t) {
        const typo = (t.typography || {}).families || {};
        const radii = t.borderRadius || [];
        const baseRadius =
          radii.find((r) => /md|base|default/i.test(r.token))?.value ||
          radii[1]?.value ||
          radii[0]?.value;
        return `#sg-overlay-inner {
  --bg: var(--background, #0d1117);
  --surface: var(--card, #161b22);
  --surface-hover: var(--secondary, #1c2333);
  --text: var(--foreground, #e6edf3);
  --text-muted: var(--muted-foreground, #8b949e);
  --text-dim: var(--muted-foreground, #6e7681);
  --border: var(--border, #30363d);
  --accent: var(--primary, #58a6ff);
  --danger: var(--destructive, #f85149);
  ${typo.heading ? `--font-heading: ${typo.heading};` : ""}
  ${typo.body ? `--font-body: ${typo.body};` : ""}
  ${typo.mono ? `--font-mono: ${typo.mono};` : ""}
  ${baseRadius ? `--radius-product: ${baseRadius};` : ""}
  font-family: ${typo.body ? `${typo.body}, ` : ""}inherit;
  color: var(--text);
  background: var(--bg);
}`;
      }

      function openStyleguide() {
        const t = data.theme;
        const overlay = document.getElementById("styleguide-overlay");
        if (!overlay) return;

        // Scope and inject product CSS vars + dashboard-token alias bridge
        const scopeEl = document.getElementById("sg-tokens-scope");
        if (scopeEl) {
          const scoped = (s) =>
            (s || "")
              .replace(/:root\s*\{/g, "#sg-overlay-inner {")
              .replace(/\.dark\s*\{/g, '#sg-overlay-inner[data-mode="dark"] {');

          scopeEl.textContent =
            scoped(t.cssVars) +
            "\n" +
            scoped((t.modes || {}).light || "") +
            "\n" +
            buildAliasCss(t);
        }

        // Render full content (page-header with title/pack/mode-toggle is part of the render)
        const contentEl = document.getElementById("sg-overlay-content");
        try {
          if (contentEl) contentEl.innerHTML = renderStyleguideFull(t);
        } catch (err) {
          console.error("renderStyleguideFull error:", err);
          if (contentEl)
            contentEl.innerHTML = `<p style="color:var(--danger,#e53);padding:24px">Render error: ${err.message}</p>`;
        }

        // Reset mode state on inner wrapper
        const innerEl = document.getElementById("sg-overlay-inner");
        if (innerEl) innerEl.removeAttribute("data-mode");

        // Show with fade (void offsetHeight forces reflow so the transition fires)
        overlay.hidden = false;
        void overlay.offsetHeight;
        overlay.classList.add("sg-overlay--open");
        document.body.classList.add("sg-overlay-open");
      }

      function closeStyleguide() {
        const overlay = document.getElementById("styleguide-overlay");
        if (!overlay || overlay.hidden) return;
        overlay.classList.remove("sg-overlay--open");
        setTimeout(() => {
          overlay.hidden = true;
        }, 200);
        document.body.classList.remove("sg-overlay-open");
      }

      function toggleStyleguideMode(btn) {
        const t = data.theme;
        const innerEl = document.getElementById("sg-overlay-inner");
        const scopeEl = document.getElementById("sg-tokens-scope");
        if (!innerEl || !scopeEl) return;

        const isDark = innerEl.dataset.mode === "dark";
        const nextMode = isDark ? "light" : "dark";
        if (isDark) {
          innerEl.removeAttribute("data-mode");
        } else {
          innerEl.dataset.mode = "dark";
        }

        // Update button label (btn may be the inline-onclick arg or fetched from DOM)
        const modeBtn = btn || document.getElementById("sg-overlay-mode-btn");
        if (modeBtn) {
          modeBtn.textContent = isDark ? "Dark" : "Light";
          modeBtn.classList.toggle("active-mode", !isDark);
        }

        // Re-inject tokens: base + mode override + alias bridge (same order as openStyleguide)
        const scoped = (s) =>
          (s || "")
            .replace(/:root\s*\{/g, "#sg-overlay-inner {")
            .replace(/\.dark\s*\{/g, '#sg-overlay-inner[data-mode="dark"] {');

        scopeEl.textContent =
          scoped(t.cssVars) +
          "\n" +
          scoped((t.modes || {})[nextMode] || "") +
          "\n" +
          buildAliasCss(t);

        // Sync colors-panels with the new mode
        innerEl.querySelectorAll(".sg-mode-panel").forEach((p) => {
          p.classList.toggle("active", p.dataset.modePanel === nextMode);
        });
      }

      function runAnimDemo(card, duration, easing) {
        const box = card.querySelector(".sg-anim-demo-box");
        if (!box) return;
        const dur = duration || "300ms";
        const ease = easing || "ease";
        box.style.transition = "none";
        box.style.transform = "translateX(0) scale(1)";
        box.style.opacity = "0.6";
        void box.offsetHeight;
        box.style.transition = `transform ${dur} ${ease}, opacity ${dur} ${ease}`;
        box.style.transform = "translateX(28px) scale(0.85)";
        box.style.opacity = "1";
        const ms = parseInt(dur) || 300;
        setTimeout(() => {
          box.style.transform = "translateX(0) scale(1)";
          box.style.opacity = "0.6";
        }, ms + 60);
      }

      function renderTheme() {
        const t = data.theme;
        const colors = t.colors || {};
        const typo = t.typography || {};
        const families = typo.families || {};
        const motion = t.motion || {};
        const modes = t.modes || {};
        const hasColors = Object.values(colors).some(
          (arr) => arr && arr.length,
        );
        const hasModes = Object.keys(modes).length > 0;
        const hasData =
          hasColors || hasModes || families.heading || families.body;
        if (!hasData) {
          return `
            <div class="section-header"><h2>Design System</h2></div>
            <div class="empty-state"><p>No design tokens defined yet.</p>
            <p style="color:var(--text-dim)">Design tokens, modes, CSS variables — managed via <code>/design-tokens</code></p></div>`;
        }

        // Pack badge
        const pack = motion.pack || "";
        const packLabels = {
          apple: "Apple",
          standard: "Standard",
          subtle: "Subtle",
          playful: "Playful",
        };
        const packLabel =
          packLabels[pack] ||
          (pack ? pack.charAt(0).toUpperCase() + pack.slice(1) : "");
        const packBadge = packLabel
          ? `<span class="sg-pack-badge sg-pack-badge--${esc(pack)}">${esc(packLabel)}</span>`
          : "";

        // Compact colors: 8 key swatches from first mode
        const modeKeys = Object.keys(modes);
        let compactColorsHtml = "";
        if (modeKeys.length) {
          const vars = parseModeVars(modes[modeKeys[0]], t);
          const COMPACT_KEYS = [
            "--background",
            "--foreground",
            "--primary",
            "--primary-foreground",
            "--secondary",
            "--accent",
            "--muted",
            "--destructive",
          ];
          const vm = new Map(vars.map((v) => [v.token, v]));
          const cv = COMPACT_KEYS.map((k) => vm.get(k))
            .filter(Boolean)
            .slice(0, 8);
          if (cv.length) {
            compactColorsHtml = `<div class="sg-section" data-collapse-key="sg:Colors"><div class="sg-section-title">Colors</div><div class="sg-palette">${cv.map((v) => `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(v.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(v.token)}</div><div class="sg-color-value">${esc(v.value)}</div></div></div>`).join("")}</div></div>`;
          }
        } else if (hasColors) {
          const swatches = [
            ...(colors.accent || []).slice(0, 4),
            ...(colors.semantic || []).slice(0, 4),
          ];
          if (swatches.length) {
            compactColorsHtml = `<div class="sg-section" data-collapse-key="sg:Colors"><div class="sg-section-title">Colors</div><div class="sg-palette">${swatches.map((c) => `<div class="sg-color"><div class="sg-color-swatch" style="background:${esc(c.value)}"></div><div class="sg-color-info"><div class="sg-color-token">${esc(c.token)}</div><div class="sg-color-value">${esc(c.value)}</div></div></div>`).join("")}</div></div>`;
          }
        }

        // Type specimens
        const specimenEntries = [
          { label: "Heading", family: families.heading },
          { label: "Body", family: families.body },
          { label: "Mono", family: families.mono },
        ].filter((e) => e.family);
        const specimensHtml = specimenEntries.length
          ? `<div class="sg-section" data-collapse-key="sg:Typography"><div class="sg-section-title">Typography</div><div class="sg-font-specimens">${specimenEntries.map((e) => `<div class="sg-font-card"><div class="sg-font-specimen" style="font-family:${esc(e.family)}">Aa</div><div class="sg-font-name">${esc(e.label)}</div><div class="sg-font-family">${esc(e.family)}</div></div>`).join("")}</div></div>`
          : "";

        // Compact radius (max 4)
        const radii = (t.borderRadius || []).slice(0, 4);
        const compactRadiusHtml = radii.length
          ? `<div><div class="sg-section-title" style="margin-bottom:10px">Radius</div><div class="sg-radius-grid">${radii.map((r) => `<div class="sg-radius-item"><div class="sg-radius-box" style="border-radius:${esc(r.value)}"></div><div class="sg-radius-label">${esc(r.token)}<br>${esc(r.value)}</div></div>`).join("")}</div></div>`
          : "";

        // Compact durations
        const durations = motion.durations || [];
        const maxMs =
          durations.reduce(
            (m, d) => Math.max(m, parseInt(d.value) || 0),
            500,
          ) || 500;
        const compactDurHtml = durations.length
          ? `<div><div class="sg-section-title" style="margin-bottom:10px">Motion</div><div class="sg-spacing-scale">${durations.map((d) => `<div class="sg-spacing-row"><div class="sg-spacing-label">${esc(d.token)}</div><div class="sg-duration-bar" style="width:${Math.round(((parseInt(d.value) || 0) / maxMs) * 100)}%"></div><div class="sg-spacing-value">${esc(d.value)}</div></div>`).join("")}</div></div>`
          : "";

        const compactRowHtml =
          compactRadiusHtml || compactDurHtml
            ? `<div class="sg-compact-row">${compactRadiusHtml}${compactDurHtml}</div>`
            : "";

        return `
          <div class="section-header">
            <h2 style="display:inline">Design System</h2>
            <span style="display:inline-flex;align-items:center;gap:8px;margin-left:10px;vertical-align:middle">
              ${packBadge}
              <button class="sg-open-btn" onclick="openStyleguide()">Open full styleguide ↗</button>
            </span>
          </div>
          ${compactColorsHtml}
          ${specimensHtml}
          ${compactRowHtml}`;
      }

      function renderStack() {
        const s = data.stack;
        const hasData = s.framework || s.language;
        if (!hasData) {
          return `
            <div class="section-header">
              <h2>Stack</h2>
            </div>
            <div class="empty-state"><p>No stack defined yet.</p>
            <p style="color:var(--text-dim)">Automatically filled by <code>/project-plan</code></p></div>`;
        }
        const fields = [
          ["Framework", s.framework],
          ["Language", s.language],
          ["Styling", s.styling],
          ["Database", s.db],
          ["Auth", s.auth],
          ["Hosting", s.hosting],
        ].filter(([, v]) => v);

        const cards = fields
          .map(
            ([label, value]) => `
            <div class="stat-card">
              <div class="stat-label">${esc(label)}</div>
              <div class="stat-value">${esc(value)}</div>
            </div>`,
          )
          .join("");

        const pkgs = (s.packages || [])
          .map((p) => {
            if (typeof p === "string") {
              const lastAt = p.lastIndexOf("@");
              const name = lastAt > 0 ? p.slice(0, lastAt) : p;
              const version = lastAt > 0 ? p.slice(lastAt + 1) : "";
              p = { name, version, purpose: "" };
            }
            return `
            <tr>
              <td style="font-weight:500;color:var(--text)">${esc(p.name)}</td>
              <td style="font-family:monospace">${esc(p.version)}</td>
              <td>${esc(p.purpose)}</td>
            </tr>`;
          })
          .join("");

        return `
          <div class="section-header">
            <h2>Stack</h2>
            <button class="header-icon-btn" onclick="showResearch()" title="Research"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
          </div>
          <div class="grid-3">${cards}</div>
          ${
            s.packages && s.packages.length
              ? `
            <div class="sub-heading">Packages</div>
            <table class="data-table">
              <thead><tr><th>Name</th><th>Version</th><th>Purpose</th></tr></thead>
              <tbody>${pkgs}</tbody>
            </table>`
              : ""
          }`;
      }

      // ─── Edit Modals ───────────────────────────────────────

      function editSeed() {
        const c = data.seed;
        openModal(
          "Edit seed",
          `
          <label>Name</label>
          <input type="text" id="f-name" value="${esc(c.name)}" />
          <label>Seed (Markdown)</label>
          <textarea id="f-content" rows="20" style="font-family:var(--font-mono);font-size:12px;line-height:1.5">${esc(c.content)}</textarea>
        `,
          {
            onSave() {
              data.seed.name = document.getElementById("f-name").value.trim();
              data.seed.content = document.getElementById("f-content").value;
            },
          },
        );
      }

      async function showResearch() {
        try {
          const basePath = location.pathname.replace(/\/+$/, "");
          const resp = await fetch(`${basePath}/research`);
          const research = await resp.json();

          if (!research.stack && !research.architecture) {
            openModal(
              "Stack Research",
              `
              <div class="empty-state" style="margin:0">
                <p>No research available.</p>
                <p style="color:var(--text-dim)">Generated by <code>/core-setup</code> Phase 7</p>
              </div>
            `,
              { readOnly: true },
            );
            return;
          }

          let content = "";
          if (research.stack) {
            content += `<div class="research-content">${md(research.stack)}</div>`;
          }
          if (research.architecture) {
            content += `<h3 style="margin-top:24px;color:var(--text)">Architecture Baseline</h3>
              <div class="research-content">${md(research.architecture)}</div>`;
          }

          openModal("Stack Research", content, { readOnly: true, wide: true });
        } catch (e) {
          openModal(
            "Error",
            `<p>Could not load research: ${esc(e.message)}</p>`,
            { readOnly: true },
          );
        }
      }

      // ─── Config (CLAUDE.md) ────────────────────────────────

      let configCache = null;
      let configEditing = false;

      function renderConfig() {
        const base = location.pathname.replace(/\/+$/, "");

        if (configCache === null) {
          fetch(base + "/claude-md")
            .then((r) => r.json())
            .then((d) => {
              configCache = d.content || "";
              const el = document.getElementById("config");
              if (el) el.innerHTML = renderConfig();
            })
            .catch(() => {
              configCache = "";
            });
          return '<div style="padding:40px;color:var(--text-dim)">Loading...</div>';
        }

        if (configEditing) {
          return `
            <div class="section-header">
              <h2>CLAUDE.md</h2>
              <div style="display:flex;gap:8px">
                <button id="config-save" class="edit-btn edit-btn--accent">Save</button>
                <button id="config-cancel" class="edit-btn">Cancel</button>
              </div>
            </div>
            <textarea id="config-editor" style="width:100%;min-height:500px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:monospace;font-size:13px;line-height:1.6;resize:vertical;tab-size:2">${esc(configCache)}</textarea>`;
        }

        if (!configCache) {
          return `
            <div class="section-header">
              <h2>CLAUDE.md</h2>
              <button id="config-create" class="edit-btn edit-btn--accent">+ Create</button>
            </div>
            <div class="empty-state">
              <p>No CLAUDE.md found</p>
            </div>`;
        }

        return `
          <div class="section-header">
            <h2>CLAUDE.md</h2>
            <button id="config-edit" class="header-icon-btn" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          </div>
          <div class="research-content">${md(configCache)}</div>`;
      }

      document.addEventListener("click", (e) => {
        const base = location.pathname.replace(/\/+$/, "");

        if (e.target.id === "config-edit") {
          configEditing = true;
          render();
          return;
        }

        if (e.target.id === "config-cancel") {
          configEditing = false;
          render();
          return;
        }

        if (e.target.id === "config-create") {
          configCache = "# " + (data.seed.name || "Project") + "\n\n";
          configEditing = true;
          render();
          return;
        }

        if (e.target.id === "config-save") {
          const textarea = document.getElementById("config-editor");
          if (!textarea) return;
          const content = textarea.value;
          fetch(base + "/claude-md", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content }),
          })
            .then((r) => r.json())
            .then((d) => {
              if (d.ok) {
                configCache = content;
                configEditing = false;
                render();
              }
            })
            .catch((err) => alert("Save failed: " + err.message));
          return;
        }
      });

      // ─── Render ─────────────────────────────────────────────

      const TYPE_ICONS = {
        FEATURE: "◆",
        API: "⬡",
        INTEGRATION: "⟳",
        UI: "▣",
        REFACTOR: "↺",
        PAGE: "▤",
        COMPONENT: "⬡",
        THEME: "◐",
        A11Y: "♿",
        PERF: "⚡",
        CHANGE: "~",
        BUG: "✕",
      };

      const featureDetailCache = {};

      function buildFeatureDetailHtml(detail) {
        const isDesign = detail.type === "PAGE" || detail.type === "COMPONENT";
        return isDesign
          ? buildDesignDetailHtml(detail)
          : buildDevDetailHtml(detail);
      }

      function buildDesignDetailHtml(detail) {
        let html = "";
        const base = location.pathname.replace(/\/(backlog|dashboard)\/?$/, "");

        // Screenshot + smoke status
        if (detail.audit && detail.audit.buildScreenshot) {
          const cacheBuster = encodeURIComponent(
            detail.audit.lastRun || detail.shippedAt || "",
          );
          const src =
            base +
            "/asset?path=" +
            encodeURIComponent(detail.audit.buildScreenshot) +
            (cacheBuster ? "&v=" + cacheBuster : "");
          const s = detail.audit.buildSmokeStatus;
          const smokeBadge =
            s === "PASS"
              ? `<span class="fm-smoke-badge fm-smoke--pass">Smoke PASS</span>`
              : s === "FAIL"
                ? `<span class="fm-smoke-badge fm-smoke--fail">Smoke FAIL</span>`
                : "";
          html += `<div class="fm-section fm-screenshot-section">
            ${smokeBadge}
            <img src="${src}" alt="Smoke render — ${esc(detail.name || "")}" loading="lazy" class="fm-screenshot-img" onclick="this.classList.toggle('fm-screenshot-zoom')" onerror="this.outerHTML='<div class=\\'fm-screenshot-missing\\'>Screenshot not found</div>'">
          </div>`;
        }

        // Audit block (one-liner format)
        if (detail.audit && detail.audit.lastRun) {
          const a = detail.audit;
          const f = a.findings || {};
          const scopes = Array.isArray(a.scopes) ? a.scopes.join(" · ") : "";
          const c = f.critical != null ? parseInt(f.critical, 10) : null;
          const w = f.warnings != null ? parseInt(f.warnings, 10) : null;
          const p = f.passed != null ? parseInt(f.passed, 10) : null;
          const findingsHtml = [
            p != null ? `<span class="fm-finding--passed">✓${p}</span>` : "",
            w != null ? `<span class="fm-finding--warning">⚠${w}</span>` : "",
            c != null ? `<span class="fm-finding--critical">✗${c}</span>` : "",
          ]
            .filter(Boolean)
            .join("");
          html += `<div class="fm-section fm-audit-block">
            <div class="fm-audit-line">

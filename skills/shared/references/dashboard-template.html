              <span class="fm-audit-tag">AUDIT</span>
              <span class="fm-audit-sep">·</span>
              <span class="fm-audit-date">${esc(a.lastRun)}</span>
              ${scopes ? `<span class="fm-audit-sep">·</span><span class="fm-audit-scopes">${esc(scopes)}</span>` : ""}
              ${findingsHtml ? `<span class="fm-audit-sep">·</span><span class="fm-findings-inline">${findingsHtml}</span>` : ""}
            </div>
          </div>`;
        }

        // Design spec
        const spec = detail.design;
        if (spec) {
          const isComp = detail.type === "COMPONENT";
          let specHtml = `<h4>${esc(spec.name || detail.name || "")}`;
          if (isComp && spec.scope)
            specHtml += ` <span class="fm-scope-badge">${esc(spec.scope)}</span>`;
          specHtml += `</h4>`;
          if (spec.purpose)
            specHtml += `<p class="fm-spec-purpose">${esc(spec.purpose)}</p>`;
          if (isComp) {
            const matrix = [
              spec.variants && spec.variants.length
                ? ["Variants", spec.variants]
                : null,
              spec.sizes && spec.sizes.length ? ["Sizes", spec.sizes] : null,
              spec.states && spec.states.length
                ? ["States", spec.states]
                : null,
            ].filter(Boolean);
            matrix.forEach(([label, vals]) => {
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">${label}</span><span class="fm-spec-vals">${vals.map(esc).join(" · ")}</span></div>`;
            });
            if (spec.props && spec.props.length)
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Props</span><span class="fm-spec-vals">${spec.props.map(esc).join(", ")}</span></div>`;
            if (spec.usedIn && spec.usedIn.length)
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Used in</span><span class="fm-spec-vals">${spec.usedIn.map((p) => `<span class="fm-spec-link" onclick="navigateToFeature('${esc(p)}')">${esc(p)}</span>`).join(", ")}</span></div>`;
          } else {
            if (spec.uses && spec.uses.length)
              specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Uses</span><span class="fm-spec-vals">${spec.uses.map((c) => `<span class="fm-spec-link" onclick="navigateToFeature('${esc(c)}')">${esc(c)}</span>`).join(", ")}</span></div>`;
          }
          if (detail.type === "COMPONENT" && detail.demoPath) {
            specHtml += `<div class="fm-spec-row"><span class="fm-spec-label">Demo</span><span class="fm-spec-vals"><span class="fm-spec-link" onclick="window.open('${base}/file?path=${encodeURIComponent(detail.demoPath)}','_blank')">${esc(detail.demoPath)}</span></span></div>`;
          }
          html += `<div class="fm-section fm-spec-block">${specHtml}</div>`;
        }

        // Files (reused)
        const files = detail.files || [];
        if (files.length) {
          const icons = { create: "+", modify: "~", delete: "−" };
          const colors = {
            create: "var(--done)",
            modify: "var(--accent)",
            delete: "var(--danger)",
          };
          html += `<div class="fm-section"><h4>Files (${files.length})</h4><div class="fm-files">`;
          files.forEach((f) => {
            const openUrl =
              base + "/open/" + encodeURIComponent(f.path).replace(/%2F/g, "/");
            html += `<div class="fm-file" data-path="${esc(f.path)}">
              <div class="fm-file-row" role="button" tabindex="0" aria-expanded="false" data-path="${esc(f.path)}">
                <span class="fm-file-action" style="color:${colors[f.action] || "var(--text-dim)"}">${icons[f.action] || "·"}</span>
                <span class="bk-file-chevron">▸</span>
                <span class="fm-file-path">${esc(f.path)}</span>
                <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(f.path)} in VS Code">↗</button>
              </div>
              <div class="fm-file-diff" hidden></div>
            </div>`;
          });
          html += `</div></div>`;
        }

        // Gaps (pending handler gaps from gap-discovery)
        const gaps = (spec && spec.gaps) || [];
        const pendingGaps = gaps.filter((g) => g.status === "pending");
        if (pendingGaps.length) {
          const rows = pendingGaps
            .map(
              (g) => `<div class="fm-gap-row">
            <span class="fm-gap-prop">${esc(g.prop || "")}</span>
            <span class="fm-gap-ctx">${esc(g.context || "")}</span>
            <span class="fm-gap-status">pending</span>
          </div>`,
            )
            .join("");
          html += `<div class="fm-section fm-gaps-block"><h4>Handler Gaps (${pendingGaps.length})</h4>${rows}</div>`;
        }

        return html;
      }

      function buildDevDetailHtml(detail) {
        let html = "";

        const files = detail.files || [];
        if (files.length) {
          const icons = { create: "+", modify: "~", delete: "−" };
          const colors = {
            create: "var(--done)",
            modify: "var(--accent)",
            delete: "var(--danger)",
          };
          const basePath = location.pathname.replace(
            /\/(backlog|dashboard)\/?$/,
            "",
          );
          html += `<div class="fm-section"><h4>Files (${files.length})</h4><div class="fm-files">`;
          files.forEach((f) => {
            const openUrl =
              basePath +
              "/open/" +
              encodeURIComponent(f.path).replace(/%2F/g, "/");
            html += `<div class="fm-file" data-path="${esc(f.path)}">
              <div class="fm-file-row" role="button" tabindex="0" aria-expanded="false" data-path="${esc(f.path)}">
                <span class="fm-file-action" style="color:${colors[f.action] || "var(--text-dim)"}">${icons[f.action] || "·"}</span>
                <span class="bk-file-chevron">▸</span>
                <span class="fm-file-path">${esc(f.path)}</span>
                <button class="bk-file-open-btn" data-open-url="${openUrl}" title="Open in VS Code" aria-label="Open ${esc(f.path)} in VS Code">↗</button>
              </div>
              <div class="fm-file-diff" hidden></div>
            </div>`;
          });
          html += `</div></div>`;
        }

        const reqs = detail.requirements || [];
        if (reqs.length) {
          const hasStatus = reqs.some(
            (r) => r.status && r.status !== "pending",
          );
          const rows = reqs
            .map((r) => {
              const statusCls =
                r.status === "PASS"
                  ? " fm-req-status--pass"
                  : r.status === "FAIL"
                    ? " fm-req-status--fail"
                    : "";
              return `<div class="fm-req-row">
                <span class="fm-req-id">${esc(r.id)}</span>
                <div class="fm-req-body">
                  <span class="fm-req-desc">${esc(r.description)}</span>
                  ${r.technique ? `<span class="fm-req-tech">${esc(r.technique)}</span>` : ""}
                </div>
                ${r.category ? `<span class="fm-req-cat">${esc(r.category)}</span>` : ""}
                ${hasStatus && r.status && r.status !== "pending" ? `<span class="fm-req-status${statusCls}">${esc(r.status.toUpperCase())}</span>` : ""}
              </div>`;
            })
            .join("");
          html += `<div class="fm-section"><h4>Requirements (${reqs.length})</h4><div class="fm-reqs">${rows}</div></div>`;
        }

        return html;
      }

      async function openFeatureModal(name) {
        const modal = document.getElementById("feature-modal");
        const title = document.getElementById("feature-modal-title");
        const body = document.getElementById("feature-modal-body");
        if (!modal) return;

        title.textContent = name;
        body.innerHTML = '<div class="fm-loading">Loading…</div>';
        modal.classList.add("active");

        let detail = featureDetailCache[name];
        if (!detail) {
          try {
            const base = location.pathname
              .replace(/\/dashboard\/?$/, "")
              .replace(/\/+$/, "");
            const res = await fetch(
              base + "/feature/" + encodeURIComponent(name),
            );
            if (res.ok) {
              detail = await res.json();
              featureDetailCache[name] = detail;
            }
          } catch {}
        }

        body.innerHTML = detail
          ? buildFeatureDetailHtml(detail)
          : '<p style="color:var(--text-dim)">No feature.json found.</p>';
      }

      async function toggleDashFeature(summaryEl, name) {
        const rowEl = summaryEl.closest(".feat-row");
        if (!rowEl) return;
        const expandEl = rowEl.querySelector(".feat-expand");
        const isOpen = rowEl.classList.contains("expanded");
        if (isOpen) {
          rowEl.classList.remove("expanded");
          expandEl.style.display = "none";
          return;
        }
        rowEl.classList.add("expanded");
        expandEl.style.display = "block";
        if (expandEl.dataset.loaded) return;

        expandEl.innerHTML =
          '<div style="padding:12px 0 4px;color:var(--text-dim);font-size:12px">Loading…</div>';
        let detail = featureDetailCache[name];
        if (!detail) {
          try {
            const base = location.pathname
              .replace(/\/dashboard\/?$/, "")
              .replace(/\/+$/, "");
            const res = await fetch(
              base + "/feature/" + encodeURIComponent(name),
            );
            if (res.ok) {
              detail = await res.json();
              featureDetailCache[name] = detail;
            }
          } catch {}
        }
        if (
          detail &&
          (detail.summary ||
            detail.files ||
            detail.requirements ||
            detail.build)
        ) {
          expandEl.innerHTML = buildFeatureDetailHtml(detail);
          expandEl.dataset.loaded = "1";
        } else {
          expandEl.innerHTML =

      async function toggleFileDiffRow(row) {
        const panel = row.nextElementSibling?.classList.contains("bk-file-diff")
          ? row.nextElementSibling
          : row.closest(".fm-file")?.querySelector(".fm-file-diff");
        if (!panel) return;
        const open = row.getAttribute("aria-expanded") === "true";
        if (open) {
          panel.hidden = true;
          row.setAttribute("aria-expanded", "false");
          return;
        }
        row.setAttribute("aria-expanded", "true");
        panel.hidden = false;
        if (!panel.dataset.loaded) {
          panel.innerHTML = '<div class="bk-diff-loading">Loading…</div>';
          const basePath = location.pathname.replace(
            /\/(backlog|dashboard)\/?$/,
            "",
          );
          const url =
            basePath +
            "/diff/" +
            encodeURIComponent(row.dataset.path).replace(/%2F/g, "/");
          try {
            const r = await fetch(url);
            const d = await r.json();
            panel.innerHTML = renderDiff(d, row.dataset.path);
            panel.dataset.loaded = "1";
          } catch (e) {
            panel.innerHTML = `<div class="bk-diff-error">Could not load diff: ${esc(String(e))}</div>`;
          }
        }
      }

      function renderDiff(d, filePath = "") {
        if (!d.git)
          return '<div class="bk-diff-empty">No git repo — diff not available.</div>';
        if (!d.tracked && !d.working)
          return '<div class="bk-diff-empty">File not yet tracked by git.</div>';
        const hasWorking = !!d.working;
        const hasRecent = !!d.recent;
        const showLabels = hasWorking && hasRecent;
        const sections = [];
        if (hasWorking) {
          const label = showLabels
            ? '<div class="bk-diff-label">Uncommitted</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatDiff(d.working, filePath)}</div>`,
          );
        }
        if (hasRecent) {
          const label = showLabels
            ? '<div class="bk-diff-label">Recent commits</div>'
            : "";
          sections.push(
            `<div class="bk-diff-section">${label}${formatGitLog(d.recent, filePath)}</div>`,
          );
        }
        if (!sections.length)
          return '<div class="bk-diff-empty">No changes found.</div>';
        return sections.join("");
      }

      function formatDiff(text, filePath = "") {
        const ext = (filePath.split(".").pop() || "").toLowerCase();
        const langMap = {
          ts: "typescript",
          tsx: "typescript",
          js: "javascript",
          jsx: "javascript",
          css: "css",
          json: "json",
          html: "xml",
          md: "markdown",
          py: "python",
          rs: "rust",
          go: "go",
          sh: "bash",
        };
        const lang = langMap[ext] || null;
        function hl(s) {
          if (lang && typeof hljs !== "undefined") {
            try {
              return hljs.highlight(s, { language: lang }).value;
            } catch {}
          }
          return esc(s);
        }
        const SKIP = [
          "diff --git ",
          "index ",
          "new file mode",
          "deleted file mode",
          "similarity index",
          "rename from",
          "rename to",
          "Binary files",
          "--- ",
          "+++ ",
          "\\ No newline",
        ];
        const lines = text.split("\n");
        let oldLn = 0,
          newLn = 0;
        const rows = [];
        for (const line of lines) {
          if (SKIP.some((p) => line.startsWith(p))) continue;
          if (line.startsWith("@@")) {
            const m = line.match(
              /@@\s+-(\d+)(?:,\d+)?\s+\+(\d+)(?:,\d+)?\s+@@/,
            );
            if (m) {
              oldLn = parseInt(m[1], 10);
              newLn = parseInt(m[2], 10);
            }
            const ctx = line.replace(/^@@.*?@@\s*/, "").trim();
            rows.push(
              `<div class="bk-diff-hunk"><span class="bk-diff-gutter"></span><span class="bk-diff-text">${ctx ? "… " + esc(ctx) : "…"}</span></div>`,
            );
            continue;
          }
          let cls = "",
            l = "",
            r = "";
          if (line.startsWith("+")) {
            cls = "bk-diff-add";
            r = newLn++;
          } else if (line.startsWith("-")) {
            cls = "bk-diff-del";
            l = oldLn++;
          } else {
            l = oldLn++;
            r = newLn++;
          }
          const content = line.length ? line.slice(1) : "";
          rows.push(
            `<div class="bk-diff-row ${cls}"><span class="bk-diff-gutter">${l || ""}<span class="sep">·</span>${r || ""}</span><span class="bk-diff-text">${hl(content)}</span></div>`,
          );
        }
        return `<div class="bk-diff">${rows.join("")}</div>`;
      }

      function formatGitLog(text, filePath = "") {
        const lines = text.split("\n");
        const out = [];
        let buf = [];
        let currentHead = null;
        const flush = () => {
          if (!currentHead && !buf.length) return;
          const diffHtml = buf.length
            ? formatDiff(buf.join("\n"), filePath)
            : "";
          let headHtml = "";
          if (currentHead) {
            const [, subject, age] = currentHead;
            const m = subject.match(/^(\w+)[\s(]/);
            const phase = m ? m[1].toLowerCase() : "other";
            const p = ["build", "verify", "refactor"].includes(phase)
              ? phase
              : "other";
            headHtml = `<div class="bk-commit-head"><span class="bk-phase-badge bk-phase-badge--${p}">${esc(p)}</span><span class="bk-commit-subject">${esc(subject)}</span><span class="bk-commit-age">${esc(age || "")}</span></div>`;
          }
          out.push(`<div class="bk-commit-block">${headHtml}${diffHtml}</div>`);
          buf = [];
          currentHead = null;
        };
        for (const line of lines) {
          if (
            line.includes("\t") &&
            !line.startsWith(" ") &&
            !line.match(/^[+\-@]/)
          ) {
            flush();
            const parts = line.split("\t");
            currentHead = [parts[0] || "", parts[1] || "", parts[2] || ""];
          } else {
            buf.push(line);
          }
        }
        flush();
        return out.join("");
      }

      function renderSearchResults(q) {
        const results = [];

        const hit = (text) => (text || "").toLowerCase().includes(q);

        (data.features || [])
          .filter((f) => f.shipped)
          .forEach((f) => {
            if (hit(f.name) || hit(f.description))
              results.push({
                section: "Features",
                anchor: "#features",
                type: f.type || "FEATURE",
                name: f.name,
                desc: f.description || "",
              });
          });

        const arch = data.architecture || {};
        (arch.components || []).forEach((c) => {
          if (hit(c.name) || hit(c.description))
            results.push({
              section: "Architecture",
              anchor: "#architecture",
              type: "component",
              name: c.name,
              desc: c.description || "",
            });
        });
        (arch.routes || []).forEach((r) => {
          const label = r.path || r.name || "";
          if (hit(label) || hit(r.description))
            results.push({
              section: "Architecture",
              anchor: "#architecture",
              type: "route",
              name: label,
              desc: r.description || "",
            });
        });
        (arch.endpoints || []).forEach((e) => {
          const label = e.method ? `${e.method} ${e.path}` : e.path || "";
          if (hit(label) || hit(e.description))
            results.push({
              section: "Architecture",
              anchor: "#architecture",
              type: "endpoint",
              name: label,
              desc: e.description || "",
            });
        });
        (arch.entities || []).forEach((e) => {
          if (hit(e.name) || hit(e.description))
            results.push({
              section: "Architecture",
              anchor: "#architecture",
              type: "entity",
              name: e.name,
              desc: e.description || "",
            });
        });

        const stack = data.stack || {};
        ["framework", "language", "styling", "db", "auth", "hosting"].forEach(
          (k) => {
            if (stack[k] && hit(stack[k]))
              results.push({
                section: "Stack",
                anchor: "#stack",
                type: k,
                name: stack[k],
                desc: "",
              });
          },
        );
        (stack.packages || []).forEach((p) => {
          const name = p.name || (typeof p === "string" ? p : "");
          if (hit(name) || hit(p.description))
            results.push({
              section: "Stack",
              anchor: "#stack",
              type: "package",
              name,
              desc: p.description || "",
            });
        });

        (data.learnings || []).forEach((l) => {
          if (hit(l.summary) || hit(l.feature))
            results.push({
              section: "Knowledge",
              anchor: "#learnings",
              type: l.type || "learning",
              name: l.summary || "",
              desc: l.feature || "",
            });
        });

        const design = data.design || {};
        (design.flows || []).forEach((f) => {
          if (hit(f.name) || hit(f.description))
            results.push({
              section: "Knowledge",
              anchor: "#learnings",
              type: "flow",
              name: f.name,
              desc: f.description || "",
            });
        });
        (design.principles || []).forEach((p) => {
          if (hit(p.name) || hit(p.description))
            results.push({
              section: "Knowledge",
              anchor: "#learnings",
              type: "principle",
              name: p.name,
              desc: p.description || "",
            });
        });

        const theme = data.theme || {};
        const themeColors = theme.colors || {};
        ["main", "accent", "semantic"].forEach((group) => {
          (themeColors[group] || []).forEach((c) => {
            if (hit(c.token) || hit(c.value) || hit(c.usage))
              results.push({
                section: "Design System",
                anchor: "#theme",
                type: "color",
                name: c.token,
                desc: c.value + (c.usage ? " — " + c.usage : ""),
              });
          });
        });
        const families = (theme.typography || {}).families || {};
        ["heading", "body", "mono"].forEach((role) => {
          if (families[role] && hit(families[role]))
            results.push({
              section: "Design System",
              anchor: "#theme",
              type: "font",
              name: families[role],
              desc: role,
            });
        });
        ((theme.typography || {}).sizes || []).forEach((s) => {
          if (hit(s.token) || hit(s.size))
            results.push({
              section: "Design System",
              anchor: "#theme",
              type: "type",
              name: s.token,
              desc: s.size,
            });
        });
        [
          { key: "spacing", items: (theme.spacing || {}).scale || [] },
          { key: "breakpoint", items: theme.breakpoints || [] },
          { key: "radius", items: theme.borderRadius || [] },
          { key: "shadow", items: theme.shadows || [] },
        ].forEach(({ key, items }) => {
          items.forEach((item) => {
            if (
              hit(item.token) ||
              hit(item.value) ||
              hit(item.usage) ||
              hit(item.target)
            )
              results.push({
                section: "Design System",
                anchor: "#theme",
                type: key,
                name: item.token,
                desc:
                  item.value +
                  (item.usage || item.target
                    ? " — " + (item.usage || item.target)
                    : ""),
              });
          });
        });

        if (!results.length) {
          return `<div class="sr-empty">No results for <strong>${esc(q)}</strong></div>`;
        }

        const groups = {};
        results.forEach((r) => {
          if (!groups[r.section]) groups[r.section] = [];
          groups[r.section].push(r);
        });

        return `<div class="sr-results">${Object.entries(groups)
          .map(
            ([section, items]) => `
          <div class="sr-section">
            <div class="sr-section-label">${esc(section)}</div>
            ${items
              .map(
                (item) => `
              <a href="${item.anchor}" class="sr-item" onclick="setTimeout(()=>{document.getElementById('dash-search').value='';render();},80)">
                <span class="sr-badge">${esc(item.type)}</span>
                <span class="sr-name">${esc(item.name)}</span>
                ${item.desc ? `<span class="sr-desc">${esc(item.desc)}</span>` : ""}
              </a>`,
              )
              .join("")}
          </div>`,
          )
          .join("")}</div>`;
      }

      function render() {
        const projectName = data.seed.name || data.name || "Dashboard";
        document.title = projectName + " — Dashboard";

        // Layout
        let layoutEl = document.querySelector(".layout");
        if (!layoutEl) {
          layoutEl = document.createElement("div");
          layoutEl.className = "layout";
          document.body.appendChild(layoutEl);
        }

        // Sidebar
        let sidebarEl = layoutEl.querySelector(".sidebar");
        if (!sidebarEl) {
          sidebarEl = document.createElement("nav");
          sidebarEl.className = "sidebar";
          layoutEl.prepend(sidebarEl);
        }

        // Determine which sections to show (skip empty optional ones)
        const d = data.design || {};
        const th = data.theme || {};
        const tc = th.colors && !Array.isArray(th.colors) ? th.colors : {};
        const hasTheme =
          (tc.main && tc.main.length) ||
          (tc.accent && tc.accent.length) ||
          (tc.semantic && tc.semantic.length) ||
          (th.typography &&
            th.typography.sizes &&
            th.typography.sizes.length) ||
          th.cssVars;
        const hasLearnings =
          (data.learnings || []).length > 0 ||
          (d.flows && d.flows.length) ||
          (d.principles && d.principles.length);
        const a = data.architecture || {};
        const hasArchitecture =
          (a.routes && a.routes.length) ||
          (a.components && a.components.length) ||
          (a.endpoints && a.endpoints.length) ||
          (a.entities && a.entities.length) ||
          (a.diagram && a.diagram.trim());
        const hasStack = !!(
          data.stack &&
          (data.stack.framework || data.stack.language)
        );
        const hasSeed = !!(data.seed && (data.seed.name || data.seed.content));
        const hasFeatures = (data.features || []).some((f) => f.shipped);
        const hiddenSections = {};
        if (!hasTheme) hiddenSections.theme = true;
        if (!hasLearnings) hiddenSections.learnings = true;
        if (!hasArchitecture) hiddenSections.architecture = true;
        if (!hasStack) hiddenSections.stack = true;
        if (!hasSeed) hiddenSections.seed = true;
        if (!hasFeatures) hiddenSections.features = true;

        const visibleTabs = TABS.filter((t) => !hiddenSections[t.id]);

        // Sidebar: anchor links (no tab switching)
        sidebarEl.innerHTML = visibleTabs
          .map(
            (t) =>
              `<a href="#${t.id}" data-section="${t.id}">${esc(t.label)}</a>`,
          )
          .join("");

        // Content: all sections simultaneously
        let contentEl = layoutEl.querySelector(".content");
        if (!contentEl) {
          contentEl = document.createElement("main");
          contentEl.className = "content";
          layoutEl.appendChild(contentEl);
        }

        // Toolbar — created once at top of content (preserves search focus)
        if (!contentEl.querySelector(".content-toolbar")) {
          const toolbar = document.createElement("div");
          toolbar.className = "content-toolbar";
          toolbar.innerHTML = `<input id="dash-search" class="content-toolbar-search" placeholder="Search..." oninput="render()" /><div class="content-toolbar-mode-toggle" id="team-mode-toggle-slot"></div>`;
          contentEl.appendChild(toolbar);
          if (window.SettingsModal && window.SettingsModal.mountToggle) {
            window.SettingsModal.mountToggle(
              toolbar.querySelector("#team-mode-toggle-slot"),
            );
          }
        }

        // Sections: replace on each render
        let sectionsEl = contentEl.querySelector(".dash-sections");
        if (!sectionsEl) {
          sectionsEl = document.createElement("div");
          sectionsEl.className = "dash-sections";
          contentEl.appendChild(sectionsEl);
        }
        const q = getDashSearch();
        if (q) {
          sectionsEl.innerHTML = renderSearchResults(q);
        } else {
          sectionsEl.innerHTML = visibleTabs
            .map(
              (t) =>
                `<section id="${t.id}" class="dash-section">${renderers[t.id] ? renderers[t.id]() : ""}</section>`,
            )
            .join("");
        }
        applyCollapseState();

        sectionsEl.onclick = (e) => {
          const modeTab = e.target.closest(".sg-mode-tab");
          if (modeTab) {
            const tabsEl = modeTab.closest(".sg-mode-tabs");
            const panelsEl = tabsEl.nextElementSibling;
            tabsEl
              .querySelectorAll(".sg-mode-tab")
              .forEach((t) => t.classList.toggle("active", t === modeTab));
            panelsEl
              .querySelectorAll(".sg-mode-panel")
              .forEach((p) =>
                p.classList.toggle(
                  "active",
                  p.dataset.modePanel === modeTab.dataset.mode,
                ),
              );
            return;
          }
          if (e.target.closest("button, a, input, select, textarea")) return;
          const learningsH3 = e.target.closest(".learnings-group > h3");
          if (learningsH3) {
            const el = learningsH3.parentElement;
            el.classList.toggle("collapsed");
            setCollapsed(
              el.dataset.collapseKey ||
                "learnings:" + learningsH3.textContent.trim(),
              el.classList.contains("collapsed"),
            );
            return;
          }
          const sgTitle = e.target.closest(".sg-section > .sg-section-title");
          if (sgTitle) {
            const el = sgTitle.parentElement;
            el.classList.toggle("collapsed");
            setCollapsed(
              el.dataset.collapseKey || "sg:" + sgTitle.textContent.trim(),
              el.classList.contains("collapsed"),
            );
            return;
          }
          const sectionHeader = e.target.closest(
            ".dash-section > .section-header",
          );
          if (sectionHeader) {
            const el = sectionHeader.parentElement;
            el.classList.toggle("collapsed");
            setCollapsed(
              "section:" + el.id,
              el.classList.contains("collapsed"),
            );
            return;
          }
        };

        // Sidebar active state: pick section closest to top of viewport
        let _dashClickFrozen = false;
        let _dashClickTimer = null;
        function setDashActive(id) {
          sidebarEl.querySelectorAll("a[data-section]").forEach((a) => {
            a.classList.toggle("active", a.dataset.section === id);
          });
        }
        function updateDashSidebarActive() {
          if (_dashClickFrozen) return;
          const sections = Array.from(
            contentEl.querySelectorAll(".dash-section[id]"),
          );
          if (!sections.length) return;
          // Find section whose top is closest to 60px (just below sticky header)
          let best = sections[0];
          let bestDist = Infinity;
          sections.forEach((s) => {
            const top = s.getBoundingClientRect().top;
            const dist = Math.abs(top - 60);
            if (dist < bestDist) {
              bestDist = dist;
              best = s;
            }
          });
          setDashActive(best.id);
        }
        // On click: freeze scroll-based updates for 800ms so click wins
        sidebarEl.querySelectorAll("a[data-section]").forEach((a) => {
          a.addEventListener("click", () => {
            const sec = document.getElementById(a.dataset.section);
            if (sec && sec.classList.contains("collapsed")) {
              sec.classList.remove("collapsed");
              setCollapsed("section:" + a.dataset.section, false);
            }
            _dashClickFrozen = true;
            setDashActive(a.dataset.section);
            clearTimeout(_dashClickTimer);
            _dashClickTimer = setTimeout(() => {
              _dashClickFrozen = false;
            }, 800);
          });
        });
        window.removeEventListener("scroll", window._dashSidebarScroll);
        window._dashSidebarScroll = updateDashSidebarActive;
        window.addEventListener("scroll", updateDashSidebarActive, {
          passive: true,
        });
        updateDashSidebarActive();
        requestAnimationFrame(updateSidebarVisibility);
      }

      function applyCollapseState() {
        // Top-level dash sections (default open)
        document.querySelectorAll(".dash-section[id]").forEach((sec) => {
          sec.classList.toggle(
            "collapsed",
            isCollapsed("section:" + sec.id, false),
          );
        });

        // Learnings groups (default open)
        document
          .querySelectorAll("[data-collapse-key^='learnings:']")
          .forEach((el) => {
            el.classList.toggle(
              "collapsed",
              isCollapsed(el.dataset.collapseKey, false),
            );
          });

        // Styleguide sections (default open)
        document
          .querySelectorAll("[data-collapse-key^='sg:']")
          .forEach((el) => {
            el.classList.toggle(
              "collapsed",
              isCollapsed(el.dataset.collapseKey, false),
            );
          });

        // Architecture sub-sections (default open)
        document
          .querySelectorAll(".arch-subsection-header[data-collapse-key]")
          .forEach((header) => {
            const shouldCollapse = isCollapsed(
              header.dataset.collapseKey,
              false,
            );
            const isCurrentlyCollapsed = header.classList.contains("collapsed");
            if (shouldCollapse !== isCurrentlyCollapsed) {
              header.classList.toggle("collapsed", shouldCollapse);
              const body = header.nextElementSibling;
              if (body) body.style.display = shouldCollapse ? "none" : "";
            }
          });

        // Architecture diagram (default: hidden when cards exist, shown otherwise)
        const archDiagramEl = document.getElementById("arch-diagram");
        if (archDiagramEl) {
          const key = "arch-diagram";
          if (key in loadAll()) {
            const wantHidden = isCollapsed(key, false);
            const isHidden = archDiagramEl.classList.contains(
              "architecture-diagram--hidden",
            );
            if (wantHidden !== isHidden) {
              archDiagramEl.classList.toggle(
                "architecture-diagram--hidden",
                wantHidden,
              );
              const btn = document.querySelector(".arch-diagram-toggle");
              if (btn) btn.classList.toggle("active", !wantHidden);
            }
          }
        }

        // Code card single-selection (default none expanded)
        const expandedComponent = getSingle("expandedCard");
        if (expandedComponent) {
          const card = document.querySelector(
            `.code-card[data-component="${CSS.escape(expandedComponent)}"]`,
          );
          if (card && !card.classList.contains("expanded")) toggleCard(card);
        }
      }

      function updateSidebarVisibility() {
        const layoutEl = document.querySelector(".layout");
        const sidebarEl = layoutEl ? layoutEl.querySelector(".sidebar") : null;
        if (!layoutEl || !sidebarEl) return;
        const linkCount = sidebarEl.querySelectorAll("a").length;
        const fitsViewport =
          document.documentElement.scrollHeight <= window.innerHeight + 1;
        layoutEl.classList.toggle(
          "layout--no-sidebar",
          linkCount <= 1 || fitsViewport,
        );
      }

      // ─── Init ───────────────────────────────────────────────
      mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
        themeVariables: {
          darkMode: true,
          background: "#161b22",
          primaryColor: "#58a6ff",
          primaryTextColor: "#c9d1d9",
          primaryBorderColor: "#30363d",
          lineColor: "#586069",
          secondaryColor: "#1c2128",
          tertiaryColor: "#161b22",
          fontFamily:
            '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif',
        },
      });
      let _sidebarResizeT;
      window.addEventListener("resize", () => {
        clearTimeout(_sidebarResizeT);
        _sidebarResizeT = setTimeout(updateSidebarVisibility, 150);
      });
      document.addEventListener("click", (e) => {
        const openBtn = e.target.closest(".bk-file-open-btn");
        if (openBtn) {
          e.preventDefault();
          e.stopPropagation();
          openInVSCode(openBtn.dataset.openUrl, openBtn);
          return;
        }
        const row = e.target.closest(".fm-file-row[data-path]");
        if (row) {
          e.preventDefault();
          e.stopPropagation();
          toggleFileDiffRow(row);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeStyleguide();
          return;
        }
        if (e.key === "Enter" || e.key === " ") {
          const row = document.activeElement?.closest?.(
            ".fm-file-row[data-path]",
          );
          if (row && document.activeElement === row) {
            e.preventDefault();
            toggleFileDiffRow(row);
          }
        }
      });
      // One-time: delegated clicks inside styleguide overlay
      document
        .getElementById("sg-overlay-content")
        ?.addEventListener("click", (e) => {
          const card = e.target.closest(".sg-anim-demo-card");
          if (card) {
            runAnimDemo(
              card,
              card.dataset.dur || null,
              card.dataset.ease || null,
            );
            return;
          }
        });
      render();

      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        const sec = id ? document.getElementById(id) : null;
        if (sec && sec.classList.contains("collapsed")) {
          sec.classList.remove("collapsed");
          setCollapsed("section:" + id, false);
        }
      });
    </script>
    <button
      id="back-to-top"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
      title="Back to top"
    >
      ↑
    </button>
    <script>
      (function () {
        const btn = document.getElementById("back-to-top");
        window.addEventListener(
          "scroll",
          () => {
            btn.classList.toggle("visible", window.scrollY > 300);
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>

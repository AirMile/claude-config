# Paths Configuration - DEFAULTS
#
# This file contains the default values per platform.
# For device-specific configuration, create a LOCAL file:
#   .claude/paths.local.yaml (in each project)
#
# This local file is NOT committed (listed in .gitignore).

paths:
  macos:
    # Root folder where projects are created
    projects_root: "$HOME/projects"

    # Location of the claude-config repository
    config_repo: "$HOME/claude-config"

    # Godot editor executable (used by /game-build, /game-verify)
    godot_executable: "/Applications/Godot.app/Contents/MacOS/Godot"

    # Extra bookmarked paths alongside git repos in projects_root
    # Override in paths.local.yaml with your own notes/scratch/etc.
    # extra_paths:
    #   - { name: "notes", path: "$HOME/Documents/Notes", type: "dir" }
    #   - { name: "scratch", path: "$HOME/scratch", type: "dir" }
    extra_paths: []

    # Written by /core-bootstrap — not a default, per-machine only.
    # preferences:
    #   claude_plan: "max-5x"  # one of: pro, max-5x, max-10x, skip

  windows:
    # Root folder where projects are created
    projects_root: "C:\\Projects"

    # Location of the claude-config repository
    config_repo: "C:\\Projects\\claude-config"

    # Godot editor executable (used by /game-build, /game-verify)
    godot_executable: "C:\\Godot\\Godot_v4.4.1-stable_win64.exe"

    # Extra bookmarked paths
    # extra_paths:
    #   - { name: "notes", path: "$env:USERPROFILE\\Documents\\Notes", type: "dir" }
    extra_paths: []

    # Written by /core-bootstrap — not a default, per-machine only.
    # preferences:
    #   claude_plan: "max-5x"  # one of: pro, max-5x, max-10x, skip

  linux:
    # Root folder where projects are created
    projects_root: "$HOME/projects"

    # Location of the claude-config repository
    config_repo: "$HOME/claude-config"

    # Godot editor executable
    godot_executable: "/usr/bin/godot4"

    # Extra bookmarked paths
    extra_paths: []

    # Written by /core-bootstrap — not a default, per-machine only.
    # preferences:
    #   claude_plan: "max-5x"  # one of: pro, max-5x, max-10x, skip

# Resolution order (first match wins):
# 1. Environment variable (CLAUDE_PROJECTS_ROOT, CLAUDE_CONFIG_REPO, CLAUDE_GODOT_EXECUTABLE)
# 2. Local: .claude/paths.local.yaml (per project, per device)
# 3. Shared: resources/paths.yaml (this file, defaults)
#
# Example paths.local.yaml:
# ```yaml
# paths:
#   projects_root: "/home/user/code"
#   config_repo: "/home/user/claude-config"
# preferences:
#   claude_plan: "max-5x"   # written automatically by /core-bootstrap
# ```
